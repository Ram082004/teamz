<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schemax File Tree</title>
<!--
  Exact HTML replica of the Schemax app's file-tree panel as it is today (E:\schemax\tool-script):
    - CollapsibleSidebar "treePanel"  (collapsiblesidebar.cpp)  - 350px default, 250-800, notch blade + resize grip
    - search row                      (MainApplication::setupTreeView, AppTheme::getTreeSearch*Style)
    - SmoothTreeWidget card           (AppTheme::getTreeWidgetStyle)
    - ClassicTreeStyle branches       (classictreestyle.h)  - solid 1px lines, 9x9 [+]/[-] boxes, root undecorated
    - HWBadgeDelegate                 - green "hardware solution" dot, search-match highlight
    - icons                           (resources/images/icons/tree/*.svg, beginner_folder_*.svg, painted amber folder)
  Behaviour mirrored: click = select, double-click / [+] box / arrow keys = expand, lazy "Loading..." child,
  Enter in search = flat result list with the match in bold blue, Ctrl+wheel / Ctrl+= / Ctrl+- / Ctrl+0 = text size
  (10-24px; row = px+9, icon = px*16/13, indent = px*20/13), drag the right edge to resize (< 200px closes),
  hover the right edge for the collapse blade.
-->
<style>
:root{
  /* ThemeManager tokens (light) */
  --primary:#3B5CD8; --background:#F5F6F8; --card:#FFFFFF; --border:#E5E7EB;
  --tree-bg:#FFFFFF; --tree-text:#111827; --base:#ffffff; --branch:#4B5563;
  --hover:rgba(59,92,216,.10); --sel:rgba(59,92,216,.28); --sel-idle:rgba(59,92,216,.18);
  --sb:rgba(0,0,0,.18); --sb-h:rgba(0,0,0,.30);
  --in-bg:#F9FAFB; --in-text:#111827; --in-border:#D1D5DB; --in-hover:#9ca3af; --in-focus-bg:#ffffff; --in-ph:#9ca3af;
  --dot:#16A34A; --match:#4D74F8;
  --fpx:13px; --row:22px; --icon:16px; --indent:20px;
}
[data-theme="dark"]{
  --primary:#4D74F8; --background:#121212; --card:#1E1E1E; --border:#374151;
  --tree-bg:#1E1E1E; --tree-text:#F3F4F6; --base:#1e1e1e; --branch:#C7CDD4;
  --hover:rgba(77,116,248,.16); --sel:rgba(77,116,248,.42); --sel-idle:rgba(77,116,248,.30);
  --sb:rgba(255,255,255,.20); --sb-h:rgba(255,255,255,.35);
  --in-bg:#2D2D2D; --in-text:#F3F4F6; --in-border:#4B5563; --in-hover:#94a3b8; --in-focus-bg:#1E1E1E; --in-ph:#94a3b8;
  --dot:#159A4E;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--background);font-family:'Segoe UI',sans-serif;color:var(--tree-text);display:flex;flex-direction:column}

/* demo controls (not part of the app) */
.demo{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;font:12px 'Segoe UI',sans-serif;color:#6B7280;border-bottom:1px solid var(--border)}
.demo b{color:var(--tree-text);font-weight:600}
.demo button{font:inherit;padding:3px 10px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--tree-text);cursor:pointer}
.demo button[aria-pressed="true"]{border-color:var(--primary);color:var(--primary)}
.demo .sp{flex:1}
.stage{flex:1;min-height:0;display:flex}
.content{flex:1;min-width:0;display:grid;place-items:center;color:#9CA3AF;font-size:12px;background:var(--background)}

/* ===== CollapsibleSidebar #treePanel ===== */
.panel{position:relative;flex:none;width:350px;height:100%;background:var(--background);padding:8px 10px 8px 8px;display:flex;flex-direction:column;transition:width .24s cubic-bezier(.65,0,.35,1)}
.panel.dragging{transition:none}
.panel.collapsed{width:13px !important;padding:4px 0}
.panel.collapsed .search,.panel.collapsed .prog,.panel.collapsed .tree{display:none}
.panel::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;background:var(--border)}
.panel.edge-hot:not(.collapsed)::after{background:var(--primary)}
.grip{position:absolute;top:0;bottom:0;right:0;width:10px;cursor:ew-resize;z-index:3}
.panel.collapsed .grip{width:13px;cursor:pointer}
.blade{position:absolute;right:0;top:50%;width:10px;height:36px;margin-top:-18px;z-index:4;cursor:pointer;opacity:0;transition:opacity .18s cubic-bezier(.33,1,.68,1);pointer-events:none}
.blade.on{opacity:1;pointer-events:auto}
.blade svg{display:block;overflow:visible}

/* search row: margins 8 6 8 6 */
.search{flex:none;padding:6px 8px;background:var(--background)}
.field{position:relative;height:28px}
.field input{width:100%;height:28px;margin:0;background:var(--in-bg);color:var(--in-text);border:1px solid var(--in-border);border-radius:6px;
  padding:4px 26px 4px 30px;font:13px 'Segoe UI',sans-serif;outline:none}
.field input::placeholder{color:var(--in-ph)}
.field input:hover{border-color:var(--in-hover)}
.field input:focus{border:2px solid var(--primary);background:var(--in-focus-bg);padding-left:29px;padding-right:25px}
.field input:disabled{opacity:.6}
.field .lead{position:absolute;left:8px;top:6px;width:16px;height:16px;cursor:pointer}
.field .clr{position:absolute;right:6px;top:6px;width:16px;height:16px;border:0;padding:0;background:transparent;cursor:pointer;display:none;color:var(--in-ph)}
.field .clr.on{display:block}
.field .clr:hover{color:var(--in-text)}

/* inline 3px search progress, margins 16 */
.prog{flex:none;height:3px;margin:0 16px;position:relative;overflow:hidden;visibility:hidden}
.prog.on{visibility:visible}
.prog i{position:absolute;top:0;bottom:0;width:30%;background:#3b82f6;border-radius:2px;animation:busy 1.1s linear infinite}
@keyframes busy{from{left:-30%}to{left:100%}}

/* ===== SmoothTreeWidget card ===== */
.tree{flex:1;min-height:0;background:var(--tree-bg);border:1px solid var(--border);border-radius:8px;padding:2px;overflow:auto;outline:none;
  font-size:var(--fpx);color:var(--tree-text);user-select:none;scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
.tree::-webkit-scrollbar{width:7px;height:7px}
.tree::-webkit-scrollbar-track{background:transparent;margin:2px 0}
.tree::-webkit-scrollbar-thumb{background:var(--sb);border-radius:3px;min-height:40px}
.tree::-webkit-scrollbar-thumb:hover{background:var(--sb-h)}
.tree::-webkit-scrollbar-corner{background:transparent}
.rows{min-width:100%;width:max-content}

.row{display:flex;height:var(--row);align-items:stretch}
.gut{flex:none;width:var(--indent);height:var(--row);background:var(--base)}
.gut svg{display:block;shape-rendering:crispEdges}
.gut.box{cursor:pointer}
.item{flex:1;min-width:0;display:flex;align-items:center;gap:5px;height:var(--row);border-radius:4px;border-left:3px solid transparent;padding-left:4px;padding-right:4px;white-space:nowrap}
.row:hover .item{background:var(--hover)}
.row.sel .item{background:var(--sel-idle);border-left-color:var(--primary)}
.tree:focus .row.sel .item{background:var(--sel)}
.ico{flex:none;width:var(--icon);height:var(--icon);display:block}
.name{min-width:0;overflow:hidden;text-overflow:ellipsis;line-height:var(--row)}
.name b{font-weight:700;color:var(--match)}
.row.sel .name b{font-weight:inherit;color:inherit}
.hw .name{max-width:calc(100% - var(--icon) - 5px - 16px)}
.dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--dot);margin-left:2px;transform:translateY(-1px)}
.loading .name{color:var(--tree-text)}
</style>
</head>

<script>
(() => {
  /* ---------------- library (names follow the app's rules; .txt files are hidden) ---------------- */
  const F = (name, children) => ({name, children});          // folder
  const f = name => ({name});                                 // file
  const LIB = [
    F('1. Apple', [
      F('iPhone 12_12Pro', [F('Hardware Solutions', [f('iPhone 12 HS No Power.w2re'), f('iPhone 12 HS No Charging.w2re')]),
        f('iPhone 12_12Pro.pcb'), f('iPhone 12_12Pro.bvr'), f('iPhone 12_12Pro Schematic.pdf'), f('readme.txt')]),
      F('iPhone 13mini', [f('iPhone 13mini.pcb'), f('iPhone 13mini Schematic.pdf')]),
      F('iPhone 13ProMAX', [F('Hardware Solutions', [f('iPhone 13ProMAX HS Backlight.w2re')]),
        f('iPhone 13ProMAX.pcb'), f('iPhone 13ProMAX Schematic.pdf'), f('iPhone 13ProMAX Block Diagram.pdf')]),
      F('iPhone 15_15 Plus', [f('iPhone 15_15 Plus.xzz'), f('iPhone 15_15 Plus Schematic.pdf')]),
      F('iPhone 16pro_Max', [f('iPhone 16pro_Max.pcb'), f('iPhone 16pro_Max Schematic.pdf'), f('iPhone 16pro_Max Board Photo.jpg')]),
    ]),
    F('2. Samsung', [
      F('Galaxy A15 5G', [f('SM-A156B.brd'), f('SM-A156B Schematic.pdf')]),
      F('Galaxy S23 Ultra', [f('SM-S918B.pcb'), f('SM-S918B Schematic.pdf'), f('notes.txt')]),
    ]),
    F('3. Xiaomi', [F('Redmi Note 13', [f('Redmi Note 13.cad'), f('Redmi Note 13 Schematic.pdf')])]),
    F('4. OnePlus', [F('OnePlus 12', [f('OnePlus 12.bvr'), f('OnePlus 12 Schematic.pdf')])]),
    F('5. Oppo', [F('Reno 11', [f('Reno 11.pcb')])]),
    F('6. Vivo', [F('V30', [f('V30 Schematic.pdf')])]),
    F('7. Realme', [F('Realme 12 Pro', [f('Realme 12 Pro.pcb'), f('Realme 12 Pro Schematic.pdf')])]),
    F('8. Motorola', [F('Moto G84', [f('Moto G84.brd2')])]),
    F('9. Google', [F('Pixel 8', [f('Pixel 8.pcb'), f('Pixel 8 Schematic.pdf')])]),
    F('10. Honor', [F('Honor X9b', [f('Honor X9b.xzzpcb'), f('Honor X9b Schematic.pdf')])]),
    F('[Beginner] Mobile Repair Basics', [f('Multimeter Basics.pdf'), f('Reading a Schematic.pdf'), f('Practice Board.pcb')]),
    F('Free - Trail Users', [F('iPhone 7', [f('iPhone 7.pcb'), f('iPhone 7 Schematic.pdf')])]),
  ];

  /* ---------------- the app's rules ---------------- */
  const BOARD = ['pcb','xzz','xzzpcb','brd','brd2','cad','bvr','w2r','w2s','w2re','pro'];
  const ext = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i + 1).toLowerCase() : ''; };
  const base = n => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(0, i) : n; };       // completeBaseName
  const isFolder = n => !!n.children;
  const isBeginner = n => isFolder(n) && /\[beginner\]/i.test(n.name);
  const isHsFile = n => !isFolder(n) && ext(n.name) === 'w2re' && /HS/.test(base(n.name));
  const visible = kids => kids.filter(k => isFolder(k) || ext(k.name) !== 'txt');
  // green dot: folder with a "hardware solution" subfolder, a .txt, or an HS .w2re; HS files themselves
  const hasDot = n => isHsFile(n) || (isFolder(n) && n.children.some(c =>
      (isFolder(c) && /hardware solution/i.test(c.name)) || ext(c.name) === 'txt' || isHsFile(c)));
  // UserRole+12 priority: -1 Beginner, 0 folder, 1 other file, 2 PDF; natural sort within
  const prio = n => isBeginner(n) ? -1 : isFolder(n) ? 0 : ext(n.name) === 'pdf' ? 2 : 1;
  const coll = new Intl.Collator(undefined, {numeric: true, sensitivity: 'base'});
  const sortKids = kids => [...kids].sort((a, b) => prio(a) - prio(b) || coll.compare(a.name, b.name));
  const sortRoot = kids => [...kids].sort((a, b) => {
    const ta = /^free - trail users$/i.test(a.name) ? -1 : 0, tb = /^free - trail users$/i.test(b.name) ? -1 : 0;
    return ta - tb || prio(a) - prio(b) || coll.compare(a.name, b.name); });

  const iconOf = (n, open) => {
    if (isFolder(n)) return isBeginner(n) ? (open ? 'i-beg-open' : 'i-beg') : (open ? 'i-folder-open' : 'i-folder');
    if (isHsFile(n)) return 'i-hw';
    const e = ext(n.name);
    return e === 'pdf' ? 'i-pdf' : BOARD.includes(e) ? 'i-pcb' : 'i-file';
  };

  /* ---------------- state ---------------- */
  let id = 0;
  const wrap = (n, parent) => { const w = {n, parent, id: ++id, open: false, loaded: false, loading: false};
    w.kids = isFolder(n) ? sortKids(visible(n.children)).map(c => wrap(c, w)) : null; return w; };
  const roots = sortRoot(LIB).map(n => wrap(n, null));
  let selected = null, searchTerm = '', searchHits = null, px = 13;

  /* ---------------- ClassicTreeStyle branch cell ---------------- */
  // solid 1px lines, crisp; cx/cy = centre of the indentation cell; 9x9 box filled with Base.
  function cell(kind, o = {}) {
    const W = Math.round(px * 20 / 13), H = px + 9, cx = Math.floor((W - 1) / 2), cy = Math.floor((H - 1) / 2);
    const L = 'var(--branch)', B = 'var(--base)';
    let s = '';
    const r = (x, y, w, h, c = L) => s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
    if (kind === 'pass') r(cx, 0, 1, H);
    if (kind === 'own') {
      r(cx, 0, 1, o.last ? cy + 1 : H);                     // T or L
      const hx = o.kids ? cx + 5 : cx;
      r(hx, cy, W - hx, 1);
      if (o.kids) {
        r(cx - 4, cy - 4, 9, 9); r(cx - 3, cy - 3, 7, 7, B);   // box: outline + Base fill
        r(cx - 2, cy, 5, 1);                                   // minus
        if (!o.open) r(cx, cy - 2, 1, 5);                      // plus
      }
    }
    return `<svg width="${W}" height="${H}">${s}</svg>`;
  }

  /* ---------------- render ---------------- */
  const rowsEl = document.getElementById('rows'), treeEl = document.getElementById('tree');
  let flat = [];
  const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  function label(text) {
    if (!searchTerm) return esc(text);
    const i = text.toLowerCase().indexOf(searchTerm.toLowerCase());
    if (i < 0) return esc(text);
    return esc(text.slice(0, i)) + '<b>' + esc(text.slice(i, i + searchTerm.length)) + '</b>' + esc(text.slice(i + searchTerm.length));
  }
  function rowHtml(w, depth, lastFlags, isLast) {
    const n = w.n, folder = isFolder(n), text = folder ? n.name : base(n.name), dot = hasDot(n);
    let g = '';
    for (let d = 1; d < depth; d++) g += `<span class="gut">${cell(lastFlags[d] ? 'none' : 'pass')}</span>`;
    if (depth > 0) g += `<span class="gut${folder ? ' box' : ''}" data-tog="${folder ? w.id : ''}">${cell('own', {last: isLast, kids: folder, open: w.open})}</span>`;
    return `<div class="row${w === selected ? ' sel' : ''}${dot ? ' hw' : ''}" data-id="${w.id}" role="treeitem" title="${esc(text)}">${g}` +
      `<span class="item"><svg class="ico"><use href="#${iconOf(n, w.open)}"/></svg><span class="name">${label(text)}</span>` +
      (dot ? `<span class="dot" title="Hardware solution available"></span>` : '') + `</span></div>`;
  }
  function render() {
    flat = []; let html = '';
    if (searchHits) {                                   // AWS search view: flat top-level rows, name only
      searchHits.forEach(w => { flat.push(w); html += rowHtml(w, 0, [], true); });
    } else {
      const walk = (list, depth, lastFlags) => list.forEach((w, i) => {
        const last = i === list.length - 1;
        flat.push(w); html += rowHtml(w, depth, lastFlags, last);
        if (w.open) {
          if (w.loading) {                              // lazy "Loading..." dummy child (no icon)
            let g = '';
            for (let d = 1; d <= depth; d++) g += `<span class="gut">${cell((d === depth ? last : lastFlags[d]) ? 'none' : 'pass')}</span>`;
            g += `<span class="gut">${cell('own', {last: true, kids: false})}</span>`;
            html += `<div class="row loading">${g}<span class="item"><span class="name">Loading...</span></span></div>`;
          } else walk(w.kids, depth + 1, [...lastFlags, last]);
        }
      });
      walk(roots, 0, []);
    }
    rowsEl.innerHTML = html;
  }

  /* ---------------- interaction ---------------- */
  const byId = i => flat.find(w => w.id === +i);
  function toggle(w, open = !w.open) {
    if (!w || !w.kids) return;
    w.open = open;
    if (open && !w.loaded) {                            // first expand fetches the children
      w.loading = true; render();
      setTimeout(() => { w.loading = false; w.loaded = true; render(); }, 280);
      return;
    }
    render();
  }
  function select(w, scroll) {
    selected = w; render();
    if (scroll) { const el = rowsEl.querySelector(`[data-id="${w.id}"]`); if (el) el.scrollIntoView({block: 'nearest'}); }
  }
  rowsEl.addEventListener('click', e => {
    const t = e.target.closest('[data-tog]');
    if (t && t.dataset.tog) { toggle(byId(t.dataset.tog)); return; }
    const r = e.target.closest('.row[data-id]'); if (r) select(byId(r.dataset.id));
  });
  rowsEl.addEventListener('dblclick', e => {
    if (e.target.closest('[data-tog]')) return;
    const r = e.target.closest('.row[data-id]'); if (r) toggle(byId(r.dataset.id));   // expandsOnDoubleClick
  });
  treeEl.addEventListener('keydown', e => {
    const i = flat.indexOf(selected);
    if (e.key === 'ArrowDown') { e.preventDefault(); select(flat[Math.min(flat.length - 1, i + 1)] || flat[0], true); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); select(flat[Math.max(0, i - 1)] || flat[0], true); }
    else if (e.key === 'ArrowRight' && selected) { e.preventDefault(); if (selected.kids && !selected.open) toggle(selected, true); else if (selected.open && selected.kids.length) select(selected.kids[0], true); }
    else if (e.key === 'ArrowLeft' && selected) { e.preventDefault(); if (selected.open) toggle(selected, false); else if (selected.parent && !searchHits) select(selected.parent, true); }
    else if (e.key === 'Enter' && selected && selected.kids) toggle(selected);
  });

  /* ---------------- search (Enter / magnifier) ---------------- */
  const q = document.getElementById('q'), clr = document.getElementById('clr'), prog = document.getElementById('prog');
  function runSearch() {
    const term = q.value.trim(); if (!term) return;
    q.disabled = true; prog.classList.add('on');
    setTimeout(() => {
      const hits = [];
      const walk = list => list.forEach(w => { if (w.n.name.toLowerCase().includes(term.toLowerCase())) hits.push(w); if (w.kids) walk(w.kids); });
      walk(roots);
      searchTerm = term; searchHits = hits.slice(0, 5000); selected = null;
      q.disabled = false; prog.classList.remove('on'); q.focus(); render(); treeEl.scrollTop = 0;
    }, 450);
  }
  function clearSearch() { searchTerm = ''; searchHits = null; render(); }
  q.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  document.getElementById('lead').addEventListener('click', runSearch);
  q.addEventListener('input', () => { clr.classList.toggle('on', !!q.value); if (!q.value.trim()) clearSearch(); });
  clr.addEventListener('click', () => { q.value = ''; clr.classList.remove('on'); clearSearch(); q.focus(); });

  /* ---------------- text size: Ctrl+wheel, Ctrl+= / Ctrl+- / Ctrl+0 (10-24px) ---------------- */
  const root = document.documentElement, pxLabel = document.getElementById('pxLabel');
  function setPx(v) {
    px = Math.max(10, Math.min(24, v));
    root.style.setProperty('--fpx', px + 'px'); root.style.setProperty('--row', (px + 9) + 'px');
    root.style.setProperty('--icon', Math.round(px * 16 / 13) + 'px'); root.style.setProperty('--indent', Math.round(px * 20 / 13) + 'px');
    pxLabel.textContent = `Text ${px}px`; render();
  }
  treeEl.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setPx(px + (e.deltaY < 0 ? 1 : -1)); } }, {passive: false});
  document.addEventListener('keydown', e => {
    if (!e.ctrlKey) return;
    if (e.key === '=' || e.key === '+') { e.preventDefault(); setPx(px + 1); }
    else if (e.key === '-') { e.preventDefault(); setPx(px - 1); }
    else if (e.key === '0') { e.preventDefault(); setPx(13); }
  });

  /* ---------------- CollapsibleSidebar: grip, divider, notch blade ---------------- */
  const panel = document.getElementById('panel'), grip = document.getElementById('grip'), blade = document.getElementById('blade');
  let hot = false, pressed = false, hideT = 0, width = 350;
  function drawBlade() {
    const collapsed = panel.classList.contains('collapsed'), active = hot || pressed;
    const cs = getComputedStyle(root), P = cs.getPropertyValue('--primary').trim(), C = cs.getPropertyValue('--card').trim(), Bd = cs.getPropertyValue('--border').trim();
    // left corners r6, flush & open on the right; inset .5
    const path = 'M10 0.5 L6.5 0.5 Q0.5 0.5 0.5 6.5 L0.5 29.5 Q0.5 35.5 6.5 35.5 L10 35.5';
    const fill = pressed ? `color-mix(in srgb, ${C} 85%, ${P})` : C;
    const ch = collapsed ? 'M3.9 14.4 L6.1 18 L3.9 21.6' : 'M6.1 14.4 L3.9 18 L6.1 21.6';
    blade.innerHTML = `<svg width="10" height="36">` +
      (active ? `<path d="${path}" transform="translate(0,2)" fill="${P}" fill-opacity=".18"/>` : '') +
      `<path d="${path}" fill="${fill}" stroke="${active ? P : Bd}" stroke-width="1"/>` +
      `<path d="${ch}" fill="none" stroke="${P}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    blade.title = collapsed ? 'Expand panel' : 'Collapse panel';
  }
  function showBlade(on) {
    clearTimeout(hideT);
    const want = on || panel.classList.contains('collapsed');
    if (want) blade.classList.add('on'); else hideT = setTimeout(() => blade.classList.remove('on'), 150);
  }
  function setHot(v) { hot = v; panel.classList.toggle('edge-hot', v || pressed); drawBlade(); showBlade(v || pressed); }
  function setCollapsed(c) { panel.classList.toggle('collapsed', c); if (!c) panel.style.width = width + 'px'; drawBlade(); showBlade(hot); }
  [grip, blade].forEach(el => { el.addEventListener('mouseenter', () => setHot(true)); el.addEventListener('mouseleave', () => setHot(false)); });
  blade.addEventListener('mousedown', e => { e.stopPropagation(); pressed = true; drawBlade(); });
  blade.addEventListener('mouseup', () => { pressed = false; setCollapsed(!panel.classList.contains('collapsed')); });
  grip.addEventListener('mousedown', e => {
    if (panel.classList.contains('collapsed')) { setCollapsed(false); return; }
    const x0 = e.clientX, w0 = panel.getBoundingClientRect().width; let moved = false;
    pressed = true; panel.classList.add('dragging'); drawBlade();
    const mv = ev => { const w = w0 + ev.clientX - x0; if (Math.abs(ev.clientX - x0) > 2) moved = true;
      panel.style.width = Math.max(200, Math.min(800, w)) + 'px'; };
    const up = ev => {
      document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
      pressed = false; panel.classList.remove('dragging');
      const w = w0 + ev.clientX - x0;
      if (!moved) setCollapsed(true);                   // click in place toggles
      else if (w < 200) setCollapsed(true);             // dragged narrower than 200 closes
      else { width = Math.max(250, Math.min(800, w)); panel.style.width = width + 'px'; }
      setHot(false);
    };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });

  /* ---------------- theme ---------------- */
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => {
    root.dataset.theme = b.dataset.themeBtn;
    document.querySelectorAll('[data-theme-btn]').forEach(x => x.setAttribute('aria-pressed', x === b));
    drawBlade(); render();
  }));

  // initial view: Apple > iPhone 12_12Pro open, its board file selected
  roots.forEach(w => { if (w.n.name === '1. Apple') { w.open = w.loaded = true;
    const m = w.kids.find(k => k.n.name === 'iPhone 12_12Pro'); m.open = m.loaded = true; selected = m.kids.find(k => ext(k.n.name) === 'pcb'); } });
  // ?theme=dark opens in dark mode
  if (new URLSearchParams(location.search).get('theme') === 'dark')
    document.querySelector('[data-theme-btn="dark"]').click();
  drawBlade(); render();
})();
</script>
</body>
</html>
