<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schemax Main Window Concepts</title>
<style>
:root{--ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--disp:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;--spring:cubic-bezier(.2,.9,.25,1.15);--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme="light"]{--page:#e4e9f0;--win:#f6f8fb;--panel:#fff;--panel-2:#f2f5f9;--panel-3:#e8edf3;--hover:rgba(14,33,64,.05);--press:rgba(14,33,64,.09);--hair:rgba(14,33,64,.09);--hair-2:rgba(14,33,64,.15);--line:#c3cdd9;--text:#0e2140;--text-2:#45556b;--text-3:#7d8a9b;--accent:#0f8f88;--accent-2:#12a39b;--accent-text:#0b7570;--accent-soft:rgba(18,163,155,.12);--sel:rgba(18,163,155,.14);--red:#d92d2d;--copper:#c2540c;--ok:#16a34a;--blue:#2563eb;--amber:#d97706;--shadow:0 1px 2px rgba(14,33,64,.06),0 10px 30px -12px rgba(14,33,64,.22);--pop:0 22px 60px -16px rgba(14,33,64,.4),0 0 0 1px rgba(14,33,64,.08);--canvas:#dfe4ea}
[data-theme="dark"]{--page:#04070b;--win:#0c1219;--panel:#111923;--panel-2:#16202c;--panel-3:#1d2937;--hover:rgba(255,255,255,.05);--press:rgba(255,255,255,.09);--hair:rgba(255,255,255,.07);--hair-2:rgba(255,255,255,.13);--line:#33425a;--text:#e6edf6;--text-2:#a8b5c6;--text-3:#6c7b8f;--accent:#16a69d;--accent-2:#2dd4bf;--accent-text:#5fe3d3;--accent-soft:rgba(45,212,191,.12);--sel:rgba(45,212,191,.15);--red:#f87171;--copper:#fb923c;--ok:#4ade80;--blue:#7aa7ff;--amber:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7);--pop:0 24px 64px -16px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.09);--canvas:#0a0f15}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text);font:13px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}input{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:600 10px/1 var(--mono);padding:3px 5px;border-radius:5px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair-2);color:var(--text-2)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

/* ===== picker ===== */
.pick{height:50px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:var(--text-2)}
.pick b{color:var(--text);font-weight:700;margin-right:6px}
.pick .ds{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
.pick .ds button{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;font-weight:600;color:var(--text-2);transition:background .2s,color .2s}
.pick .ds button i{font:700 10px var(--mono);font-style:normal;color:var(--text-3)}
.pick .ds button[aria-pressed="true"]{background:var(--accent);color:#fff}.pick .ds button[aria-pressed="true"] i{color:#cff7f1}
.pick .sp{flex:1}
.pick .tb{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);font-weight:600}
.pick .note{color:var(--text-3);font-size:11.5px}

/* ===== stage ===== */
.stagewrap{position:absolute;left:14px;right:14px;top:50px;bottom:14px}
.dz{position:absolute;inset:0;border-radius:14px;overflow:hidden;display:none;background:var(--win);box-shadow:0 0 0 1px var(--hair-2),0 30px 80px -30px rgba(14,33,64,.45)}
.dz:not(.on){display:none!important}.dz.on{animation:dzIn .55s var(--ease)}.d1.on{display:block}
@keyframes dzIn{from{opacity:0;transform:scale(.985) translateY(10px)}}
.dz.imm .chrome{display:none!important}

/* ===== shared atoms ===== */
.ib{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s,transform .15s}
.ib:hover{background:var(--hover);color:var(--text)}.ib:active{transform:scale(.92)}
.wc{display:flex;align-self:stretch}.wc button{width:44px;display:grid;place-items:center;color:var(--text-2)}.wc button:hover{background:var(--hover)}.wc button.x:hover{background:#d01c29;color:#fff}
.brand{display:flex;align-items:center;gap:9px;user-select:none;flex:none}.brand img{height:24px}
.brand .dk{display:none}[data-theme="dark"] .brand .lt{display:none}[data-theme="dark"] .brand .dk{display:block}
.wm{display:flex;flex-direction:column;line-height:1}.wm b{font:700 14.5px/1 var(--disp)}.wm b span{color:var(--accent-text);font-weight:600}.wm small{font:500 8px/1 var(--mono);letter-spacing:.2em;color:var(--text-3);margin-top:4px}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--disp);color:#fff;background:linear-gradient(135deg,#0d847d,#0e2140);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 14px;border-radius:9px;font-weight:650;font-size:12.5px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair-2);transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(13,132,125,.9)}.btn.wa{background:#1fa855;color:#fff}.btn.ghost{background:none;box-shadow:none;color:var(--text-2)}.btn.ghost:hover{background:var(--hover)}.btn.red{color:var(--red);background:none;box-shadow:none}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--text-2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 4px 10px -5px rgba(13,132,125,.8)}
.seg svg.i{width:14px;height:14px}
.sw{width:34px;height:20px;border-radius:999px;background:var(--panel-3);box-shadow:inset 0 0 0 1px var(--hair-2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--spring)}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{transform:translateX(14px)}
.meter{height:6px;border-radius:9px;background:var(--panel-3);overflow:hidden}.meter i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent-2));animation:grow 1.2s var(--ease) both}
@keyframes grow{from{width:0}}
.tg{font:700 9px var(--mono);letter-spacing:.08em;padding:2px 6px;border-radius:5px;font-style:normal}
.tg.new{background:rgba(22,163,74,.12);color:var(--ok)}.tg.info{background:rgba(37,99,235,.11);color:var(--blue)}.tg.upd{background:rgba(194,84,12,.12);color:var(--copper)}
.toasts{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:11px;background:var(--text);color:var(--panel);font-size:12.5px;font-weight:550;box-shadow:var(--pop);animation:tin .35s var(--spring)}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.94)}}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* floating panels (popovers / drawers / sheets) */
.fl{position:absolute;z-index:40;opacity:0;pointer-events:none;transform:translateY(-8px) scale(.97);transition:opacity .2s,transform .35s var(--spring);background:var(--panel);border-radius:14px;box-shadow:var(--pop)}
.fl.on{opacity:1;pointer-events:auto;transform:none}

/* ===== tree ===== */
.treebox{flex:1;overflow:auto;padding:4px 6px 10px;outline:0;--rh:calc(var(--tfs,13px) + 13px)}
.treebox::-webkit-scrollbar{width:9px}.treebox::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:9px;border:3px solid transparent;background-clip:padding-box}
.row{display:flex;align-items:center;height:var(--rh);border-radius:7px;padding-right:8px;white-space:nowrap;font-size:var(--tfs,13px);cursor:default;position:relative;animation:rowIn .28s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}}
.row:hover{background:var(--hover)}.row.sel{background:var(--sel)}
.row .g{flex:none;overflow:visible}.row .g .ln{stroke:var(--tl,var(--line));stroke-width:1;fill:none;shape-rendering:crispEdges}
.row .g .bb{fill:var(--panel);stroke:var(--tl,var(--line))}.row .g .bi{stroke:var(--text-2);stroke-width:1.3;fill:none}
.row .g .bx{cursor:pointer}.row .g .bx:hover .bb{stroke:var(--accent-2)}
.row .g .pad{fill:var(--tl,var(--line))}
.row .ico{width:calc(var(--tfs,13px) + 3px);height:calc(var(--tfs,13px) + 3px);flex:none;margin-right:7px}
.row .nm{overflow:hidden;text-overflow:ellipsis}.row .nm mark{background:none;color:#4d74f8;font-weight:700}
.row .hd{flex:none;width:6px;height:6px;border-radius:50%;background:#16a34a;margin-left:7px}
.row .pth{margin-left:auto;padding-left:8px;font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;max-width:45%}
.tsearch{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .2s}
.tsearch:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent-2),0 0 0 4px var(--accent-soft)}
.tsearch input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:12.5px}.tsearch input::placeholder{color:var(--text-3)}
.tfs{display:flex;align-items:center;border-radius:8px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.tfs button{width:24px;height:22px;font-weight:700;color:var(--text-2)}.tfs button:hover{color:var(--accent-text)}.tfs output{min-width:36px;text-align:center;font:600 10.5px var(--mono)}

/* ===== tabs + view mode ===== */
.tabs{display:flex;align-items:center;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 10px;border-radius:8px;color:var(--text-2);font-size:12px;flex:none;max-width:190px;transition:background .2s,color .2s}
.tab:hover{background:var(--hover)}.tab.on{color:var(--text);background:var(--panel);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair)}
.tab>svg:first-child{width:15px;height:15px;flex:none}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--text-3);opacity:.0}.tab:hover .x,.tab.on .x{opacity:1}
.tab .x svg{width:11px;height:11px}.tab.home{padding:0 10px}
.lane{font:700 9px var(--mono);letter-spacing:.1em;color:var(--text-3);display:flex;gap:5px;align-items:center;padding:0 4px 0 8px;flex:none}
.lane b{font-weight:700}.lane.pdf b{color:var(--red)}.lane.pcb b{color:var(--blue)}.lane.tool b{color:var(--accent-text)}
.lane i{font-style:normal;padding:2px 5px;border-radius:5px;background:var(--panel-3);color:var(--text-2)}
.vm{display:flex;align-items:center;gap:6px;flex:none}
.dz[data-mode="single"] [data-swap]{display:none}
[data-swap]{animation:tin .3s var(--spring)}

/* ===== viewer area ===== */
.vw{position:relative;display:flex;flex:1;min-height:0;min-width:0;overflow:hidden}
.pn{display:none;flex:1;min-width:0;min-height:0;flex-direction:column;animation:pnIn .4s var(--ease);border-left:1px solid var(--hair);margin-left:-1px;background:var(--win)}
@keyframes pnIn{from{opacity:0;transform:translateY(6px)}}
.dz[data-mode="single"][data-view="home"] .pn-home,.dz[data-mode="single"][data-view="pdf"] .pn-pdf,.dz[data-mode="single"][data-view="pdf2"] .pn-pdf2,
.dz[data-mode="single"][data-view="pcb"] .pn-pcb,.dz[data-mode="single"][data-view="tool"] .pn-tool,.dz[data-mode="single"][data-view="settings"] .pn-set,
.dz[data-mode="pdfpcb"] .pn-pdf,.dz[data-mode="pdfpcb"] .pn-pcb,.dz[data-mode="pdfpdf"] .pn-pdf,.dz[data-mode="pdfpdf"] .pn-pdf2{display:flex}
.dz.swap .vw{flex-direction:row-reverse}
.vw .ldbar{position:absolute;top:0;left:0;height:2px;background:var(--accent-2);z-index:5;width:0;box-shadow:0 0 8px var(--accent-2)}
.vw.loading .ldbar{animation:ld .7s var(--ease)}
@keyframes ld{0%{width:0;opacity:1}90%{width:100%;opacity:1}100%{width:100%;opacity:0}}
.vt{height:38px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--hair);background:var(--panel);font-size:12px;color:var(--text-2)}
.vt .t{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.vt .t svg{width:16px;height:16px;flex:none}
.vt .sp{flex:1}.vt .pg{font:600 11px var(--mono);padding:4px 8px;border-radius:7px;background:var(--panel-2)}
.canvas{flex:1;overflow:auto;background:var(--canvas);display:flex;justify-content:center;padding:22px}
.paper{width:min(720px,100%);aspect-ratio:1.414;background:#fff;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);position:relative;flex:none}
.paper svg{position:absolute;inset:0;width:100%;height:100%}
.boardv{flex:1;background:radial-gradient(circle at 50% 40%,#173328,#070d0b);position:relative;overflow:hidden}.boardv svg{position:absolute;inset:0;width:100%;height:100%}
.hov{position:absolute;left:14px;bottom:14px;padding:9px 12px;border-radius:10px;background:rgba(10,20,16,.82);color:#d8f3ea;font:11.5px var(--mono);box-shadow:0 0 0 1px rgba(45,212,191,.3)}.hov b{color:#5fe3d3}
.toolv{flex:1;overflow:auto;padding:22px 26px;animation:pnIn .4s var(--ease)}.toolv h2{margin:0;font:700 20px var(--disp)}.toolv>p{margin:4px 0 16px;color:var(--text-3)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair)}
.tbl th{text-align:left;font:700 9.5px var(--mono);letter-spacing:.1em;color:var(--text-3);padding:10px 12px;border-bottom:1px solid var(--hair);background:var(--panel-2)}.tbl td{padding:9px 12px;border-bottom:1px solid var(--hair)}
.term{background:#0a0f15;color:#9be7c4;font:12px/1.7 var(--mono);border-radius:12px;padding:14px 16px;min-height:220px}.term .d{color:#5b6b80}
.rffe{position:absolute;top:0;right:0;bottom:0;width:270px;background:var(--panel);border-left:1px solid var(--hair);z-index:6;padding:14px;display:flex;flex-direction:column;gap:10px;transform:translateX(105%);transition:transform .4s var(--spring)}
.dz.rffeon .rffe{transform:none}
.rffe h3{margin:0;display:flex;align-items:center;gap:8px;font:650 13px var(--disp)}.rffe h3 .sp{flex:1}.rffe p{margin:0;font-size:11.5px;color:var(--text-3)}
.rffe .rl{flex:1;border-radius:10px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair);font:11.5px var(--mono);overflow:auto}
.rffe .rl div{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--hair);animation:rowIn .3s both}.rffe .rl b{color:var(--accent-text);font-weight:600}

/* ===== home (web page) ===== */
.home{flex:1;overflow:auto}
.home::-webkit-scrollbar{width:11px}.home::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:9px;border:3px solid transparent;background-clip:padding-box}
.hw{max-width:1060px;margin:0 auto;padding:0 24px 36px}
.ntc{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;height:36px;padding:0 24px;background:color-mix(in srgb,var(--win) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.ntc .nl{display:flex;align-items:center;gap:7px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--accent-text);flex:none}
.ntc .nl i{width:7px;height:7px;border-radius:50%;background:var(--accent-2);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,212,191,.55)}100%{box-shadow:0 0 0 9px rgba(45,212,191,0)}}
.ntc .tk{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ntc .tr{display:inline-flex;gap:26px;white-space:nowrap;animation:tick 46s linear infinite;font-size:12.5px;color:var(--text-2)}.ntc:hover .tr{animation-play-state:paused}
.ntc .tr span{display:inline-flex;gap:7px;align-items:center}
@keyframes tick{to{transform:translateX(-50%)}}
.hg{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:18px}
.card{background:var(--panel);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--hair)}
.me{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.me .hi{display:flex;gap:12px;align-items:center}.me .hi .av{width:38px;height:38px;font-size:15px}
.me h1{margin:0;font:700 18px var(--disp)}.me h1+p{margin:2px 0 0;color:var(--text-3);font-size:12px}
.me .st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.me .st{padding:9px 11px;border-radius:10px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.me .st small{display:block;font:700 9px var(--mono);letter-spacing:.12em;color:var(--text-3)}.me .st b{display:block;font:700 16px var(--disp);margin-top:3px}.me .st em{font-style:normal;font-size:11px;color:var(--text-3)}
.offer{position:relative;overflow:hidden;padding:18px 20px;border-radius:14px;color:#fff;background:radial-gradient(circle at 85% 20%,rgba(255,214,102,.55),transparent 38%),linear-gradient(120deg,#5b1208,#9a2a0c 45%,#c2410c)}
.offer .eb{font:700 10px var(--mono);letter-spacing:.18em;color:#ffd98a}.offer h2{margin:6px 0 4px;font:800 22px/1.1 var(--disp)}.offer h2 em{font-style:normal;color:#ffd98a}
.offer p{margin:0;font-size:12px;color:#ffe9d6;max-width:300px}
.offer .cd{display:flex;gap:6px;margin-top:12px}.offer .cd span{min-width:44px;padding:5px 8px;border-radius:9px;background:rgba(0,0,0,.25);text-align:center;font:700 15px var(--disp)}.offer .cd small{display:block;font:600 8.5px var(--mono);color:#ffd0a8}
.offer .lamp{position:absolute;right:22px;bottom:16px;width:70px;height:70px}.offer .lamp .fl2{transform-origin:40px 46px;animation:flick 1.4s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.92,1.08) skewX(3deg)}}
.offer .spk i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd98a;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.1;transform:scale(.4)}}
.sech{display:flex;align-items:flex-end;gap:12px;margin-top:26px;flex-wrap:wrap}.sech .eb{font:700 10px var(--mono);letter-spacing:.18em;color:var(--copper)}.sech h2{margin:3px 0 0;font:700 20px var(--disp)}.sech .sp{flex:1}
.sech a{font-size:12.5px;font-weight:650;color:var(--accent-text);text-decoration:none;display:flex;gap:5px;align-items:center;cursor:pointer}
.pills{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.pills button{height:28px;padding:0 12px;border-radius:999px;font:650 10.5px var(--mono);letter-spacing:.06em;color:var(--text-2);background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair-2);transition:all .2s}
.pills button[aria-pressed="true"]{background:var(--text);color:var(--panel);box-shadow:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.pc{position:relative;padding:14px;display:flex;flex-direction:column;gap:5px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow),inset 0 0 0 1px var(--hair);transition:transform .25s var(--spring),box-shadow .25s;cursor:pointer}
.pc:hover{transform:translateY(-3px)}.pc.on{box-shadow:0 0 0 2px var(--accent-2),0 18px 36px -18px rgba(13,132,125,.7)}
.pc .k{font:700 9.5px var(--mono);letter-spacing:.14em;color:var(--text-3)}.pc .pr{font:800 24px var(--disp)}.pc .pm{font-size:11.5px;color:var(--text-3)}
