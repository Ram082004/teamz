<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schemax Loaders</title>
<style>
:root{
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--disp:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
  --page:#e7ecf2;--panel:#ffffff;--panel-2:#f2f5f9;--panel-3:#e6ebf2;--text:#0e2140;--text-2:#475569;--text-3:#8492a6;
  --hair:rgba(14,33,64,.09);--hair-2:rgba(14,33,64,.15);--hover:rgba(14,33,64,.05);
  --accent:#0f8f88;--accent-2:#12a39b;--red:#d92d2d;--copper:#c2540c;--ok:#16a34a;
  --stg:#f7f9fc;--ink:rgba(14,33,64,.16);
}
[data-theme="dark"]{
  --page:#05080d;--panel:#111923;--panel-2:#16202c;--panel-3:#1f2b3a;--text:#eef3fb;--text-2:#a9b6c9;--text-3:#6f7f96;
  --hair:rgba(255,255,255,.07);--hair-2:rgba(255,255,255,.13);--hover:rgba(255,255,255,.05);
  --accent:#16a69d;--accent-2:#2dd4bf;--red:#f87171;--copper:#fb923c;--ok:#4ade80;
  --stg:#0b1118;--ink:rgba(180,200,230,.14);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:14px/1.45 var(--ui);transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:16px 24px;background:color-mix(in srgb,var(--page) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.top h1{margin:0;font:700 19px var(--disp)}.top p{margin:2px 0 0;font-size:12.5px;color:var(--text-3)}
.ctl{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button .dt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.grid{max-width:1500px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,640px),1fr));gap:22px}
.opt{border-radius:18px;background:color-mix(in srgb,var(--panel) 55%,transparent);box-shadow:inset 0 0 0 1px var(--hair);overflow:hidden}
.meta{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.num{flex:none;font:700 11.5px var(--mono);color:var(--accent);background:color-mix(in srgb,var(--accent-2) 13%,transparent);border-radius:7px;padding:3px 8px}
.meta b{display:block;font:650 15px var(--disp)}.meta span{font-size:12.5px;color:var(--text-3)}
.meta .rp{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair-2)}
.meta .rp:hover{background:var(--hover);color:var(--text)}
.meta .rp svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* fake viewer behind the loader */
.stg{position:relative;height:440px;margin:0 12px 12px;border-radius:14px;overflow:hidden;background:var(--stg);display:grid;place-items:center;isolation:isolate;
  background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
.stg::before{content:"";position:absolute;inset:0;background:rgba(8,14,22,.28);backdrop-filter:blur(2.5px);z-index:0}
.stg>*{position:relative;z-index:1}
.stg .tabs{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:end;gap:4px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--hair);z-index:0}
.stg .tabs i{width:90px;height:24px;border-radius:7px 7px 0 0;background:var(--panel-2)}
.cxl{position:absolute;inset:auto 0 18px;text-align:center;font:600 12px var(--mono);color:#fff;opacity:0;transition:.2s;z-index:3;pointer-events:none}
.cxl.on{opacity:1}
.xb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--text-3);transition:.18s}
.xb:hover{background:var(--hover);color:var(--red);transform:rotate(90deg)}
.xb svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.gone{animation:gone .35s ease-in both!important}@keyframes gone{to{opacity:0;transform:scale(.95) translateY(-6px)}}
.mono{font-family:var(--mono)}

/* ========== 01 Chip Core ========== */
.d1{position:relative;width:440px;max-width:calc(100% - 28px);display:grid;grid-template-columns:132px 1fr;gap:22px;align-items:center;padding:22px;border-radius:26px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 40px 80px -30px rgba(0,0,0,.55),inset 0 0 0 1px var(--hair-2),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden;animation:d1in .45s cubic-bezier(.2,1.3,.4,1) both}
.d1::before{content:"";position:absolute;inset:-40% auto auto -20%;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 30%,transparent),transparent);filter:blur(10px);animation:d1glow 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes d1in{from{opacity:0;transform:translateY(14px) scale(.94)}}@keyframes d1glow{to{transform:translate(40px,30px) scale(1.15)}}
.d1 .core{position:relative;width:132px;height:132px}.d1 .core svg.rg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.d1 .trk{fill:none;stroke:var(--panel-3);stroke-width:5}
.d1 .prg{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .18s linear;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 70%,transparent))}
.d1 .run{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:4 96;opacity:.75;animation:d1run 1.4s linear infinite}@keyframes d1run{to{stroke-dashoffset:-100}}
.d1 .tr path{fill:none;stroke:var(--hair-2);stroke-width:1.6;stroke-linecap:round;transition:stroke .3s}
.d1 .tr circle{fill:var(--panel);stroke:var(--hair-2);stroke-width:1.6;transition:.3s}
.d1 .tr g.on path{stroke:var(--c)}.d1 .tr g.on circle{fill:var(--c);stroke:var(--c);filter:drop-shadow(0 0 4px var(--c))}
.d1 .chipc{position:absolute;inset:30px;border-radius:24px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 11%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent);overflow:hidden}
.d1 .chipc>svg{width:34px;height:34px;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.d1 .chipc::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 30%,transparent),transparent);animation:d1scan 1.6s linear infinite}@keyframes d1scan{to{top:100%}}
.d1.done .chipc::after,.d1.done .run{display:none}
.chk{position:absolute;inset:0;display:grid;place-items:center;background:var(--c);opacity:0;transform:scale(.4);transition:.35s cubic-bezier(.2,1.5,.4,1)}
.chk svg{width:30px;height:30px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.done .chk{opacity:1;transform:none}
.d1 .info{min-width:0}
.eb{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;font:700 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.eb i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--c)}70%,100%{box-shadow:0 0 0 7px transparent}}
.d1 .eb{padding-right:30px}
.d1 h3{margin:6px 0 2px;font:700 19px/1.2 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d1 .pct{font:800 34px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:8px 0 10px}
.d1 .pct small{font-size:15px;color:var(--text-3);margin-left:2px}
.d1 .steps{display:flex;gap:4px}.d1 .steps span{flex:1;min-width:0}
.d1 .steps b{display:block;height:4px;border-radius:9px;background:var(--panel-3);overflow:hidden;position:relative}
.d1 .steps b::after{content:"";position:absolute;inset:0;width:var(--f,0%);background:var(--c);border-radius:9px;transition:width .18s linear}
.d1 .steps em{display:block;margin-top:5px;font:600 9.5px var(--mono);font-style:normal;color:var(--text-3);white-space:nowrap;overflow:hidden}
.d1 .steps span.cur em{color:var(--text)}.d1 .steps span.ok em{color:var(--c)}
.d1 .ft{display:flex;justify-content:space-between;margin-top:12px;font:600 10.5px var(--mono);color:var(--text-3);font-variant-numeric:tabular-nums}
.d1 .xb{position:absolute;top:12px;right:12px;z-index:2}

/* ========== 02 Dynamic Island ========== */
.stg.top-anchored{place-items:start center}
.d2{margin-top:48px;width:230px;height:40px;border-radius:22px;background:#0a0e14;color:#fff;box-shadow:0 20px 40px -14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.07);overflow:hidden;position:relative;
  transition:width .55s cubic-bezier(.2,1.25,.35,1),height .55s cubic-bezier(.2,1.25,.35,1),border-radius .55s;animation:d2drop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes d2drop{from{transform:translateY(-70px) scale(.6);opacity:0}}
.d2.big{width:420px;max-width:calc(100% - 24px);height:96px;border-radius:30px}
.d2.done{width:250px;height:44px;border-radius:22px}
.d2 .mini{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding:0 8px 0 10px;transition:opacity .25s}
.d2 .mini svg.fi{width:22px;height:22px}.d2 .mini b{flex:1;font:600 12.5px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d2 .wave{display:flex;gap:2px;align-items:center;height:16px}.d2 .wave i{width:3px;border-radius:2px;background:var(--c);animation:d2w .9s ease-in-out infinite}
.d2 .wave i:nth-child(2){animation-delay:.15s}.d2 .wave i:nth-child(3){animation-delay:.3s}.d2 .wave i:nth-child(4){animation-delay:.45s}
@keyframes d2w{0%,100%{height:4px}50%{height:15px}}
.d2.big .mini,.d2.done .mini{opacity:0;pointer-events:none}
.d2 .full{position:absolute;inset:0;display:grid;grid-template-columns:52px 1fr 54px;gap:14px;align-items:center;padding:0 18px 6px 16px;opacity:0;transition:opacity .25s .1s}
.d2.big .full{opacity:1}
.d2 .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 26%,#0a0e14);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent)}
.d2 .ic svg{width:28px;height:28px}
.d2 .tx{min-width:0}.d2 .tx small{display:block;font:700 9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.d2 .tx b{display:block;font:650 15.5px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.d2 .tx span{font:500 11px var(--mono);color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.d2 .ring{position:relative;width:54px;height:54px}.d2 .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.d2 .ring circle{fill:none;stroke-width:4.5}.d2 .ring .bg{stroke:rgba(255,255,255,.1)}
.d2 .ring .fg{stroke:var(--c);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .18s linear}
.d2 .ring em{position:absolute;inset:0;display:grid;place-items:center;font:700 12px var(--mono);font-style:normal;font-variant-numeric:tabular-nums}
.d2 .ln{position:absolute;left:18px;right:18px;bottom:9px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;opacity:0;transition:opacity .25s}
.d2.big .ln{opacity:1}
.d2 .ln i{display:block;height:100%;width:0;background:linear-gradient(90deg,transparent,var(--c));box-shadow:0 0 10px var(--c);transition:width .18s linear}
.d2 .ok{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;font:650 13px var(--ui);opacity:0;transition:opacity .25s .2s}
.d2.done .ok{opacity:1}.d2.done .full{opacity:0}
.d2 .ok b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);animation:pop .4s cubic-bezier(.2,1.6,.4,1) .25s both}
.d2 .ok b svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(0)}}
.d2 .xb{position:absolute;top:6px;right:6px;width:22px;height:22px;color:rgba(255,255,255,.45);opacity:0;transition:.2s;z-index:2}.d2.big:hover .xb{opacity:1}.d2 .xb svg{width:11px;height:11px}
.d2 .xb:hover{background:rgba(255,255,255,.1)}

/* ========== 03 Liquid Fill ========== */
.d3{width:300px;padding:22px 22px 18px;border-radius:24px;background:var(--panel);box-shadow:0 40px 80px -30px rgba(0,0,0,.55),inset 0 0 0 1px var(--hair-2);text-align:center;position:relative;animation:d1in .45s cubic-bezier(.2,1.3,.4,1) both}
.d3 .doc{width:132px;height:160px;margin:4px auto 12px;display:block;overflow:visible;filter:drop-shadow(0 14px 18px color-mix(in srgb,var(--c) 30%,transparent))}
.d3 .shell{fill:var(--panel-2);stroke:color-mix(in srgb,var(--c) 45%,var(--hair-2));stroke-width:2}
.d3 .fold{fill:color-mix(in srgb,var(--c) 25%,var(--panel-3))}
.d3 .lq{fill:var(--c)}.d3 .lq2{fill:color-mix(in srgb,var(--c) 55%,#fff);opacity:.55}
.d3 .wv{animation:d3w 1.6s linear infinite}.d3 .wv2{animation:d3w 2.4s linear infinite reverse}
@keyframes d3w{to{transform:translateX(-60px)}}
.d3 .lvl{transition:transform .2s linear}
.d3 .t1{fill:var(--c);font:800 30px var(--disp);font-variant-numeric:tabular-nums}.d3 .t2{fill:#fff;font:800 30px var(--disp);font-variant-numeric:tabular-nums}
.d3 .bub{fill:rgba(255,255,255,.55);animation:d3b 2.2s ease-in infinite}
.d3 .bub:nth-of-type(2){animation-delay:.7s}.d3 .bub:nth-of-type(3){animation-delay:1.4s}
@keyframes d3b{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(-70px);opacity:0}}
.d3 .ic{fill:none}
.d3 .eb{justify-content:center}
.d3 h3{margin:6px 0 4px;font:700 17px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d3 .st{font:600 11px var(--mono);color:var(--text-3);font-variant-numeric:tabular-nums}
.d3 .dots{display:flex;justify-content:center;gap:6px;margin:12px 0 2px}
.d3 .dots i{width:8px;height:8px;border-radius:50%;background:var(--panel-3);transition:.3s}
.d3 .dots i.ok{background:var(--c)}.d3 .dots i.cur{background:var(--c);width:22px;border-radius:9px;animation:d3p 1s ease-in-out infinite alternate}
@keyframes d3p{to{opacity:.45}}
.d3 .xb{position:absolute;top:12px;right:12px}
.d3 .okb{position:absolute;left:50%;top:84px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:#fff;display:grid;place-items:center;transform:scale(0);transition:.4s cubic-bezier(.2,1.6,.4,1);box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.d3 .okb svg{width:28px;height:28px;stroke:var(--c);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.d3.done .okb{transform:scale(1)}

/* ========== 04 Board Scan ========== */
.d4{width:480px;max-width:calc(100% - 24px);border-radius:22px;background:var(--panel);box-shadow:0 40px 80px -30px rgba(0,0,0,.55),inset 0 0 0 1px var(--hair-2);overflow:hidden;position:relative;animation:d1in .45s cubic-bezier(.2,1.3,.4,1) both}
.d4 .bd{position:relative;height:172px;background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--c) 35%,#06100e),#070d12 70%);overflow:hidden}
.d4 .bd svg{position:absolute;inset:0;width:100%;height:100%}
.d4 .tc{fill:none;stroke:color-mix(in srgb,var(--c) 80%,#fff);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 3px var(--c))}
.d4 .tg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:1.6}
.d4 .cp rect.body{fill:#151c22;stroke:rgba(255,255,255,.18);stroke-width:1;transition:.4s}
.d4 .cp .pin{fill:rgba(255,255,255,.18);transition:.4s}
.d4 .cp.on rect.body{fill:#1d262e;stroke:var(--c);filter:drop-shadow(0 0 5px var(--c))}.d4 .cp.on .pin{fill:#e3c27a}
.d4 .cp text{fill:rgba(255,255,255,.0);font:700 7px var(--mono);transition:.4s}.d4 .cp.on text{fill:rgba(255,255,255,.7)}
.d4 .laser{position:absolute;top:0;bottom:0;width:2px;left:0;background:#fff;box-shadow:0 0 12px 3px var(--c),0 0 40px 8px color-mix(in srgb,var(--c) 50%,transparent);transition:left .18s linear}
.d4 .laser::after{content:"";position:absolute;top:0;bottom:0;right:2px;width:70px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 22%,transparent))}
.d4.done .laser{opacity:0;transition:.3s}
.d4 .bd .tag{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;font:700 9px var(--mono);letter-spacing:.16em;color:rgba(255,255,255,.75);text-transform:uppercase}
.d4 .bd .tag i{width:7px;height:7px;border-radius:50%;background:var(--c);animation:ping 1.4s infinite}
.d4 .bd .xb{position:absolute;top:6px;right:6px;color:rgba(255,255,255,.55)}.d4 .bd .xb:hover{background:rgba(255,255,255,.1)}
.d4 .lo{padding:14px 18px 16px}
.d4 .row1{display:flex;align-items:baseline;gap:12px}
.d4 h3{flex:1;margin:0;font:700 17px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d4 .pct{font:800 22px var(--mono);color:var(--c);font-variant-numeric:tabular-nums}
.d4 .blocks{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin:10px 0}
.d4 .blocks i{height:10px;border-radius:2px;background:var(--panel-3);transition:background .15s,box-shadow .15s}
.d4 .blocks i.on{background:var(--c);box-shadow:0 0 6px color-mix(in srgb,var(--c) 60%,transparent)}
.d4 .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.d4 .chips span{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font:600 10.5px var(--mono);color:var(--text-3);background:var(--panel-2);transition:.25s}
.d4 .chips span svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.35}
.d4 .chips span.ok{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}.d4 .chips span.ok svg{opacity:1}
.d4 .chips span.cur{color:var(--text);box-shadow:inset 0 0 0 1px var(--c)}
.d4 .chips .mb{margin-left:auto;font:600 10.5px var(--mono);color:var(--text-3);font-variant-numeric:tabular-nums}

/* ========== 05 Meter Gauge ========== */
.d5{width:340px;padding:16px 18px 16px;border-radius:24px;background:var(--panel);box-shadow:0 40px 80px -30px rgba(0,0,0,.55),inset 0 0 0 1px var(--hair-2);position:relative;animation:d1in .45s cubic-bezier(.2,1.3,.4,1) both}
.d5 .hd{display:flex;align-items:center;gap:10px}
.d5 .hd .fi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--panel-2))}.d5 .hd .fi svg{width:20px;height:20px}
.d5 .hd .t{flex:1;min-width:0}.d5 .hd b{display:block;font:700 15px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d5 .gauge{display:block;width:100%;height:auto;margin:6px 0 0;overflow:visible}
.d5 .tk{stroke:var(--panel-3);stroke-width:3;stroke-linecap:round;transition:stroke .15s}
.d5 .tk.mj{stroke-width:3.6}
.d5 .tk.on{stroke:var(--c)}.d5 .tk.on.hot{filter:drop-shadow(0 0 3px var(--c))}
.d5 .arc{fill:none;stroke:var(--hair);stroke-width:1}
.d5 .lab{fill:var(--text-3);font:600 8px var(--mono);text-anchor:middle}
.d5 .ndl{transform-origin:120px 122px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.d5 .ndl path{fill:var(--text)}.d5 .hub{fill:var(--panel);stroke:var(--text);stroke-width:3}
.d5 .lcd{margin:-30px auto 0;width:150px;position:relative;padding:8px 10px 6px;border-radius:10px;background:#0b1712;box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);text-align:center;color:color-mix(in srgb,var(--c) 70%,#d9ffe9)}
[data-theme="light"] .d5 .lcd{background:#1a2420}
.d5 .lcd b{display:block;font:700 28px/1 var(--mono);letter-spacing:.04em;text-shadow:0 0 8px var(--c);font-variant-numeric:tabular-nums}
.d5 .lcd small{font:600 9px var(--mono);letter-spacing:.14em;opacity:.7;text-transform:uppercase}
.d5 .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.d5 .cells div{padding:7px 9px;border-radius:10px;background:var(--panel-2)}
.d5 .cells small{display:block;font:700 8.5px var(--mono);letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
.d5 .cells b{font:650 13px var(--mono);font-variant-numeric:tabular-nums}
.d5.done .lcd b{animation:d5f .5s steps(2) 2}@keyframes d5f{50%{opacity:.2}}
.d5 .xb{margin-left:auto}

/* ================= professional pass: calm surfaces, no neon, consistent type ================= */
.d1,.d3,.d4,.d5{border-radius:16px;background:var(--panel);backdrop-filter:none;box-shadow:0 1px 2px rgba(0,0,0,.06),0 24px 48px -20px rgba(8,20,40,.35),0 0 0 1px var(--hair-2);animation:proin .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes proin{from{opacity:0;transform:translateY(8px)}}
.gone{animation:proout .25s ease-in both!important}@keyframes proout{to{opacity:0;transform:translateY(-4px)}}
.eb{font:600 11px var(--ui);letter-spacing:.01em;text-transform:none;color:var(--text-2);gap:8px}
.eb i{width:6px;height:6px;animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.eb .kd{color:var(--c);font-weight:700}
.xb{width:26px;height:26px;border-radius:7px}.xb:hover{transform:none;background:var(--hover);color:var(--text)}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);font:500 11.5px var(--ui);color:var(--text-3);font-variant-numeric:tabular-nums}
.pfoot .cn{padding:5px 12px;border-radius:7px;font:600 12px var(--ui);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair-2)}
.pfoot .cn:hover{background:var(--hover);color:var(--text)}
.done .pfoot .cn{visibility:hidden}

/* 01 Chip Core */
.d1{grid-template-columns:112px 1fr;gap:20px;padding:20px}
.d1::before,.d1 .run,.d1 .chipc::after{display:none}
.d1 .core{width:112px;height:112px}
.d1 .trk{stroke-width:4}.d1 .prg{stroke-width:4;filter:none}
.d1 .tr path{stroke:var(--hair-2);stroke-width:1.4}.d1 .tr circle{r:2.6;stroke-width:1.4}
.d1 .tr g.on circle{filter:none}
.d1 .chipc{inset:28px;border-radius:18px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.d1 .chipc>svg{width:28px;height:28px;animation:none}
.d1 h3{font:650 17px/1.25 var(--disp);margin:6px 0 0}
.d1 .pct{font:700 28px/1 var(--ui);letter-spacing:-.02em;margin:10px 0 12px}
.d1 .pct small{font-size:13px;font-weight:600}
.d1 .steps b{height:3px}
.d1 .steps em{font:500 10.5px var(--ui)}
.d1 .ft{font:500 11.5px var(--ui);margin-top:10px}

/* 02 Dynamic Island */
.d2{box-shadow:0 18px 36px -16px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.d2 .ic{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);border-radius:14px}
.d2 .tx small{font:600 10.5px var(--ui);letter-spacing:.01em;text-transform:none}
.d2 .tx b{font:650 15px var(--disp)}.d2 .tx span{font:500 11px var(--ui)}
.d2 .ring em{font:650 11.5px var(--ui)}
.d2 .ln i{background:var(--c);box-shadow:none}

/* 03 Liquid Fill */
.d3{width:290px;padding:24px 22px 16px}
.d3 .doc{width:104px;height:126px;filter:none;margin:2px auto 16px}
.d3 .shell{fill:var(--panel-2);stroke:var(--hair-2);stroke-width:1.5}
.d3 .fold{fill:var(--panel-3)}
.d3 .bub{display:none}
.d3 .lq2{opacity:.3}.d3 .wv{animation-duration:2.6s}.d3 .wv2{animation-duration:3.6s}
.d3 .t1,.d3 .t2{font:700 24px var(--ui)}
.d3 .t1{fill:var(--text)}
.d3 h3{font:650 16px var(--disp);margin:6px 0 2px}
.d3 .st{font:500 11.5px var(--ui)}
.d3 .dots{display:none}
.d3 .okb{top:68px;width:48px;height:48px;margin-left:-24px;box-shadow:0 6px 16px -6px rgba(0,0,0,.35)}
.d3 .pfoot{text-align:left}

/* 04 Board Scan */
.d4{width:460px;border-radius:16px}
.d4 .bd{height:150px;background:#0c1319;border-bottom:1px solid var(--hair)}
[data-theme="light"] .d4 .bd{background:#f3f6f9}
[data-theme="light"] .d4 .tg{stroke:rgba(14,33,64,.07)}
[data-theme="light"] .d4 .cp rect.body{fill:#fff;stroke:rgba(14,33,64,.18)}
[data-theme="light"] .d4 .cp.on rect.body{fill:#fff}
[data-theme="light"] .d4 .cp .pin{fill:rgba(14,33,64,.2)}
[data-theme="light"] .d4 .cp.on text{fill:var(--text-2)}
[data-theme="light"] .d4 .bd .tag{color:var(--text-2)}
[data-theme="light"] .d4 .bd .xb{color:var(--text-3)}
.d4 .tc{stroke:var(--c);stroke-width:1.3;filter:none;opacity:.85}
.d4 .cp.on rect.body{filter:none;stroke:var(--c)}
.d4 .laser{width:1.5px;background:var(--c);box-shadow:none;opacity:.9}
.d4 .laser::after{width:48px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 10%,transparent))}
.d4 .bd .tag{font:600 11px var(--ui);letter-spacing:.01em;text-transform:none}
.d4 .bd .tag i{width:6px;height:6px;animation:none}
.d4 .lo{padding:14px 18px 14px}
.d4 h3{font:650 16px var(--disp)}
.d4 .pct{font:700 18px var(--ui);color:var(--text)}
.d4 .blocks{gap:2px;margin:10px 0 12px}.d4 .blocks i{height:6px;border-radius:1.5px}
.d4 .blocks i.on{box-shadow:none}
.d4 .chips span{font:500 11px var(--ui);background:none;padding:2px 8px 2px 4px}
.d4 .chips span.ok{background:none}.d4 .chips span.cur{box-shadow:none;font-weight:650}
.d4 .chips .mb{font:500 11px var(--ui)}
.d4 .pfoot{margin-top:10px}

/* 05 Meter Gauge */
.d5{width:330px;padding:16px 18px 14px}
.d5 .hd .fi{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.d5 .hd b{font:650 15px var(--disp)}
.d5 .tk{stroke-width:2.4}.d5 .tk.mj{stroke-width:2.8}.d5 .tk.on.hot{filter:none}
.d5 .lab{font:500 8px var(--ui)}
.d5 .ndl path{fill:var(--text-2)}.d5 .hub{stroke:var(--text-2);stroke-width:2.5}
.d5 .lcd{width:132px;background:var(--panel-2);box-shadow:0 0 0 1px var(--hair);color:var(--text)}
[data-theme="light"] .d5 .lcd{background:var(--panel-2)}
.d5 .lcd b{font:700 24px/1 var(--ui);letter-spacing:-.01em;text-shadow:none}
.d5 .lcd small{font:500 10px var(--ui);letter-spacing:0;text-transform:none;color:var(--text-3);opacity:1}
.d5.done .lcd b{animation:none;color:var(--c)}
.d5 .cells div{background:none;box-shadow:inset 0 0 0 1px var(--hair)}
.d5 .cells small{font:500 10px var(--ui);letter-spacing:0;text-transform:none}
.d5 .cells b{font:650 13px var(--ui)}
.d5 .gauge{max-width:240px;margin:8px auto 0}.d5 .lcd{margin-top:-26px;padding:6px 10px 5px}.d5 .lcd b{font-size:22px}

/* ================= shared for 06-10 ================= */
.stg.clear::before{display:none}
.cn{padding:5px 12px;border-radius:7px;font:600 12px var(--ui);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair-2);background:var(--panel)}
.cn:hover{background:var(--panel-2);color:var(--text)}
.done .cn{visibility:hidden}
.lk{font:600 12px var(--ui);color:var(--text-2);padding:4px 6px;border-radius:6px}.lk:hover{background:var(--hover);color:var(--text)}
.spin{flex:none;width:12px;height:12px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--c) 25%,transparent);border-top-color:var(--c);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tile{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.tile svg{width:22px;height:22px}
.card{background:var(--panel);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -18px rgba(8,20,40,.35),0 0 0 1px var(--hair-2)}

/* 06 In-tab skeleton */
.d6{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;background:var(--stg);animation:proin .25s both}
.d6 .tb{flex:none;height:36px;display:flex;align-items:end;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--hair);position:relative}
.d6 .tab{display:flex;align-items:center;gap:8px;height:29px;padding:0 12px;border-radius:8px 8px 0 0;font:500 12px var(--ui);color:var(--text-3);max-width:240px}
.d6 .tab svg{flex:none;width:14px;height:14px}.d6 .tab b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d6 .tab.on{background:var(--stg);color:var(--text);box-shadow:0 0 0 1px var(--hair);clip-path:inset(-2px -2px 0 -2px)}
.d6 .tab .tx{display:none;width:14px;height:14px;color:var(--text-3)}.d6.done .tab .spin{display:none}.d6.done .tab .tx{display:block}
.d6 .ln{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--c);transition:width .18s linear}
.d6.done .ln{opacity:0;transition:opacity .4s .2s}
.d6 .sk{flex:1;display:grid;place-items:center;min-height:0}
.d6 .pg{width:230px;height:250px;border-radius:6px;background:var(--panel);box-shadow:0 0 0 1px var(--hair),0 12px 28px -18px rgba(0,0,0,.4);padding:22px 20px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.d6 .pg i{display:block;height:8px;border-radius:4px;background:var(--panel-3)}
.d6 .pg i.h{height:14px;width:55%;margin-bottom:6px}
.d6 .pg .bx{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}.d6 .pg .bx i{height:54px;border-radius:6px}
.d6 .pg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--panel) 75%,#fff 25%) 50%,transparent 70%);transform:translateX(-100%);animation:shim 1.4s ease-in-out infinite}
[data-theme="dark"] .d6 .pg::after{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%)}
@keyframes shim{to{transform:translateX(100%)}}
.d6 .pg.brd{width:300px;height:190px;border-radius:18px;padding:16px;display:block}
.d6 .pg.brd i{position:absolute;border-radius:4px}
.d6.done .pg::after{display:none}.d6.done .pg i{background:color-mix(in srgb,var(--c) 22%,var(--panel-3));transition:background .4s}
.d6 .cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:99px;white-space:nowrap;font:500 12px var(--ui);color:var(--text-2);background:var(--panel);box-shadow:0 8px 20px -10px rgba(0,0,0,.35),0 0 0 1px var(--hair-2)}
.d6 .cap b{color:var(--text);font-variant-numeric:tabular-nums}.d6 .cap .cn{border-radius:99px;padding:4px 11px}
.d6.done .cap{opacity:0;transition:opacity .3s}

/* 07 Toast */
.d7wrap{position:absolute;right:16px;bottom:16px;width:330px;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:8px;z-index:2}
.d7{padding:12px 12px 12px 12px;animation:t7in .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes t7in{from{opacity:0;transform:translateY(16px)}}
.d7 .r{display:flex;align-items:center;gap:11px}
.d7 .t{flex:1;min-width:0}.d7 .t b{display:block;font:600 13px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d7 .t span{font:500 11.5px var(--ui);color:var(--text-3);font-variant-numeric:tabular-nums}
.d7 .t span .kd{color:var(--c);font-weight:600}
.d7 .bar{height:3px;border-radius:3px;background:var(--panel-3);margin:11px 0 0;overflow:hidden}.d7 .bar i{display:block;height:100%;width:0;background:var(--c);border-radius:3px;transition:width .18s linear}
.d7 .tile{position:relative;overflow:hidden}
.d7 .tile .chk{border-radius:10px}.d7 .tile .chk svg{width:18px;height:18px}
.d7.done .bar{opacity:0;transition:.3s}
.d7 .sh{display:none}.d7.done .sh{display:inline-block}.d7.done .cn{display:none}
.d7q{padding:9px 12px;display:flex;align-items:center;gap:10px;opacity:.9;transform:scale(.97);transform-origin:bottom;font:500 12px var(--ui);color:var(--text-3)}
.d7q svg{width:16px;height:16px}.d7q b{color:var(--text-2);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 08 Side sheet */
.d8{position:absolute;top:0;right:0;bottom:0;width:310px;max-width:88%;z-index:2;background:var(--panel);border-left:1px solid var(--hair-2);box-shadow:-24px 0 48px -28px rgba(8,20,40,.45);display:flex;flex-direction:column;animation:s8in .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes s8in{from{transform:translateX(100%)}}
.d8.gone{animation:s8out .3s ease-in both!important}@keyframes s8out{to{transform:translateX(100%)}}
.d8 .h{display:flex;gap:12px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--hair)}
.d8 .h .tile{width:44px;height:44px;border-radius:12px}.d8 .h .tile svg{width:26px;height:26px}
.d8 .h b{display:block;font:650 15px/1.25 var(--disp)}.d8 .h small{font:600 11px var(--ui);color:var(--c)}
.d8 dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;padding:14px 18px;border-bottom:1px solid var(--hair);font-size:12px}
.d8 dt{color:var(--text-3)}.d8 dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.d8 ol{list-style:none;margin:0;padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:0}
.d8 li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;font-size:12.5px;color:var(--text-3);position:relative;padding-bottom:16px}
.d8 li:not(:last-child)::before{content:"";position:absolute;left:9px;top:20px;bottom:2px;width:1.5px;background:var(--hair-2)}
.d8 li.ok:not(:last-child)::before{background:var(--c)}
.d8 li .m{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--hair-2);background:var(--panel)}
.d8 li .m svg{width:11px;height:11px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.d8 li.ok{color:var(--text-2)}.d8 li.ok .m{background:var(--c);box-shadow:none}.d8 li.ok .m svg{display:block}
.d8 li.cur{color:var(--text);font-weight:600}.d8 li.cur .m{box-shadow:inset 0 0 0 1.5px var(--c)}
.d8 li.cur .m::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);animation:d8p 1s ease-in-out infinite alternate}
@keyframes d8p{to{opacity:.3}}
.d8 li em{font:500 11px var(--ui);font-style:normal;color:var(--text-3);font-variant-numeric:tabular-nums}
.d8 .f{padding:14px 18px 16px;border-top:1px solid var(--hair)}
.d8 .f .bar{height:4px;border-radius:4px;background:var(--panel-3);overflow:hidden}.d8 .f .bar i{display:block;height:100%;width:0;background:var(--c);transition:width .18s linear}
.d8 .f .r{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font:600 12px var(--ui);font-variant-numeric:tabular-nums}

/* 09 Minimal line */
.d9{width:400px;max-width:calc(100% - 28px);padding:30px 30px 22px;text-align:center;animation:proin .3s both}
.d9 .tile{margin:0 auto 14px;width:44px;height:44px;border-radius:12px}.d9 .tile svg{width:24px;height:24px}
.d9 h3{margin:0;font:650 18px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d9 .sub{margin:4px 0 26px;font:500 12px var(--ui);color:var(--text-3)}
.d9 .sub .kd{color:var(--c);font-weight:600}
.d9 .trk{position:relative;height:2px;border-radius:2px;background:var(--panel-3)}
.d9 .trk i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);border-radius:2px;transition:width .18s linear}
.d9 .hd{position:absolute;top:-30px;left:0;transform:translateX(-50%);padding:3px 7px;border-radius:6px;font:650 11px var(--ui);color:#fff;background:var(--c);font-variant-numeric:tabular-nums;transition:left .18s linear}
.d9 .hd::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--c)}
.d9 .dot{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 2px var(--c);transition:left .18s linear}
.d9 .meta2{display:flex;justify-content:space-between;margin-top:12px;font:500 11.5px var(--ui);color:var(--text-3);font-variant-numeric:tabular-nums}
.d9 .ft{margin-top:20px;display:flex;justify-content:center}

/* 10 Layer stack */
.d10{width:420px;max-width:calc(100% - 28px);padding:18px 20px 16px;animation:proin .3s both}
.d10 .tp{display:flex;gap:12px;align-items:center}
.d10 .tp .t{flex:1;min-width:0}.d10 .tp b{display:block;font:650 15px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d10 .tp small{font:500 11.5px var(--ui);color:var(--text-3)}.d10 .tp small .kd{color:var(--c);font-weight:600}
.d10 .tp .pc{font:700 20px var(--ui);font-variant-numeric:tabular-nums}
.d10 .stk{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center;margin:14px 0 4px}
.d10 .iso{position:relative;height:150px}
.d10 .lyr{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:12px;border:1.5px dashed var(--hair-2);background:transparent;
  transform:translateY(calc(var(--y) * 1px - 26px)) scaleY(.55) rotate(45deg);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.4,1),opacity .35s,background .3s,border-color .3s}
.d10 .lyr.cur{opacity:1;border-color:var(--c);transform:translateY(calc(var(--y) * 1px - 14px)) scaleY(.55) rotate(45deg)}
.d10 .lyr.ok{opacity:1;border-style:solid;border-color:color-mix(in srgb,var(--c) 70%,var(--panel));background:color-mix(in srgb,var(--c) calc(var(--a) * 1%),var(--panel));transform:translateY(calc(var(--y) * 1px)) scaleY(.55) rotate(45deg);box-shadow:0 6px 10px -6px rgba(0,0,0,.25)}
.d10 ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.d10 li{display:flex;align-items:center;gap:9px;font:500 12px var(--ui);color:var(--text-3)}
.d10 li i{flex:none;width:9px;height:9px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--hair-2)}
.d10 li.ok{color:var(--text-2)}.d10 li.ok i{background:var(--c);box-shadow:none}
.d10 li.cur{color:var(--text);font-weight:600}.d10 li.cur i{box-shadow:inset 0 0 0 1.5px var(--c)}
.d10 li em{margin-left:auto;font-style:normal;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ================= 11-15: bold / badass (always dark) ================= */
.bx{position:relative;color:#e9f0fa;background:#05080d;border-radius:20px;overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08),0 0 60px -20px color-mix(in srgb,var(--c) 55%,transparent);animation:bxin .55s cubic-bezier(.2,1.2,.3,1) both}

/* w11 layers */
.w11 .lyr{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:9px;border:1.5px dashed var(--hair-2);
  transform:translateY(calc(var(--y) * 1px - 18px)) scaleY(.55) rotate(45deg);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.4,1),opacity .35s,background .3s,border-color .3s}

/* w16 preview */
.w16 .art{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);transition:filter .25s linear,transform .25s linear}
.w16 .art .ln{stroke:var(--text-3);stroke-width:1.6;fill:none}.w16 .art .bk{fill:var(--panel);stroke:var(--text-2);stroke-width:1.5}.w16 .art .ac{fill:color-mix(in srgb,var(--c) 30%,var(--panel));stroke:var(--c);stroke-width:1.5}
.w16 .bl{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--panel-3)}.w16 .bl i{display:block;height:100%;width:0;background:var(--c);transition:width .18s linear}

/* w17 digits */

  background:conic-gradient(var(--c) calc(var(--p,0) * 1%),transparent 0) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* w18 vertical timeline */
.w18 .vt{position:absolute;left:18px;right:12px;top:14px;bottom:14px}
.w18 .vt .rl{position:absolute;left:10px;top:10px;bottom:10px;width:2px;background:var(--panel-3)}.w18 .vt .rl i{display:block;width:100%;height:0;background:var(--c);transition:height .25s linear}

.w18 .vt .nd.ok{color:var(--text-2)}.w18 .vt .nd.ok b{background:var(--c);box-shadow:none}.w18 .vt .nd.ok b svg{opacity:1}
.w18 .vt .nd.cur{color:var(--text);font-weight:650}.w18 .vt .nd.cur b{box-shadow:inset 0 0 0 2px var(--c),0 0 0 4px color-mix(in srgb,var(--c) 15%,transparent)}

/* w19 bar chart */
.w19 .bc{position:absolute;left:20px;right:20px;bottom:22px;top:22px;display:flex;align-items:flex-end;gap:9px;border-bottom:1.5px solid var(--hair-2)}
.w19 .bc span{flex:1;height:var(--t);border-radius:5px 5px 0 0;background:var(--panel-3);position:relative;overflow:hidden}

.w19 .bc span:nth-child(2) i{background:color-mix(in srgb,var(--c) 80%,#fff)}.w19 .bc span:nth-child(4) i{background:color-mix(in srgb,var(--c) 80%,#000)}
.w19 .cap{position:absolute;bottom:6px;left:20px;right:20px;display:flex;font:600 8.5px var(--ui);color:var(--text-3)}.w19 .cap b{flex:1;text-align:center;font-weight:600}

/* w20 cloud */
.w20 .cl{fill:var(--panel);stroke:color-mix(in srgb,var(--c) 45%,var(--hair-2));stroke-width:2}

.k .pa0{fill:none;stroke:var(--panel-3);stroke-width:3.5}

.gy{position:absolute;inset:0;perspective:340px;transform-style:preserve-3d}

.k .sw{position:absolute;inset:8px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 72%,color-mix(in srgb,var(--c) 45%,transparent) 100%);animation:spin 2.2s linear infinite}
.k .bp{fill:var(--c);opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .2s}.k .bp.on{opacity:1;animation:bp 1.6s ease-out infinite}

.k .pl{fill:none;stroke:var(--c);stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-out infinite;opacity:0}
.k .pl:nth-of-type(2){animation-delay:.8s}.k .pl:nth-of-type(3){animation-delay:1.6s}

.k .sg{stroke:var(--panel-3);stroke-width:6;stroke-linecap:round;fill:none;transition:stroke .2s}.k .sg.on{stroke:var(--c)}
/* gears */
.k .gr{fill:color-mix(in srgb,var(--c) 10%,var(--panel));stroke:color-mix(in srgb,var(--c) 40%,var(--hair-2));stroke-width:1.3;stroke-linejoin:round}
.k .grp{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .18s linear}
/* saturn */
.k .rg0{fill:none;stroke:var(--panel-3);stroke-width:5}.k .rgp{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .18s linear}
.k .pln{fill:color-mix(in srgb,var(--c) 16%,var(--panel));stroke:color-mix(in srgb,var(--c) 45%,var(--hair-2));stroke-width:1.3}
/* stopwatch */
.k .tk{stroke:var(--panel-3);stroke-width:2;stroke-linecap:round;transition:stroke .15s}.k .tk.mj{stroke-width:2.8}.k .tk.on{stroke:var(--c)}
.k .crn{fill:var(--text-3)}
.k .hnd{stroke:var(--text-2);stroke-width:2.2;stroke-linecap:round}
/* activity rings */
.k .ar0{fill:none;stroke-width:8;opacity:.16}.k .arp{fill:none;stroke-width:8;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .2s linear;transform:rotate(-90deg);transform-origin:62px 62px}
/* hex ring */
.k .hx{fill:var(--panel);stroke:var(--hair-2);stroke-width:1.4;transition:fill .25s,stroke .25s;transform-box:fill-box;transform-origin:center}
.k .hx.on{fill:var(--c);stroke:var(--c)}.k .hx.hd{animation:bp 1s ease-out infinite}
.k .hxc{fill:none;stroke:color-mix(in srgb,var(--c) 45%,var(--hair-2));stroke-width:1.5}

.k .fl{fill:none;stroke:var(--hair-2);stroke-width:1.5;stroke-dasharray:3 6;animation:flw 1.4s linear infinite;transition:stroke .3s}

@keyframes flw{to{stroke-dashoffset:-18}}

/* turbine */
.k .bld{fill:color-mix(in srgb,var(--c) 22%,var(--panel));stroke:color-mix(in srgb,var(--c) 70%,var(--panel));stroke-width:1.2}
.k .hub{fill:var(--panel);stroke:var(--hair-2);stroke-width:1.2}
/* chaser */
.k .ch{fill:none;stroke-linecap:round;transform-box:view-box;transform-origin:62px 62px}
.k .ch1{stroke:var(--c);stroke-width:3.5;animation:chd 1.6s ease-in-out infinite,spin 2s linear infinite}
.k .ch2{stroke:color-mix(in srgb,var(--c) 45%,var(--panel-3));stroke-width:3;animation:chd 2.1s ease-in-out infinite reverse,spin 2.8s linear infinite reverse}
@keyframes chd{0%{stroke-dasharray:1 300;stroke-dashoffset:0}50%{stroke-dasharray:110 300;stroke-dashoffset:-40}100%{stroke-dasharray:110 300;stroke-dashoffset:-290}}
/* sacred geometry */
.k .pg{fill:none;stroke:color-mix(in srgb,var(--c) 55%,var(--hair-2));stroke-width:1.5;stroke-linejoin:round}
.k .vx{fill:var(--panel);stroke:var(--hair-2);stroke-width:1.4;transition:.25s}.k .vx.on{fill:var(--c);stroke:var(--c)}

    <g transform="translate(7, 21) scale(2.1)"><path fill="white" d="M23.63 15.3c-.71-.745-2.166-1.17-4.224-1.17-1.1 0-2.377.106-3.761.354a19.443 19.443 0 0 1-2.307-2.661c-.532-.71-.994-1.49-1.42-2.236.817-2.484 1.207-4.507 1.207-5.962 0-1.632-.603-3.336-2.342-3.336-.532 0-1.065.32-1.349.781-.78 1.384-.425 4.4.923 7.381a60.277 60.277 0 0 1-1.703 4.507c-.568 1.349-1.207 2.733-1.917 4.01C2.834 18.53.314 20.34.03 21.758c-.106.533.071 1.03.462 1.42.142.107.639.533 1.49.533 2.59 0 5.323-4.188 6.707-6.707 1.065-.355 2.13-.71 3.194-.994a34.963 34.963 0 0 1 3.407-.745c2.732 2.448 5.145 2.839 6.352 2.839 1.49 0 2.023-.604 2.2-1.1.32-.64.106-1.349-.213-1.704zm-1.42 1.03c-.107.532-.64.887-1.384.887-.213 0-.39-.036-.604-.071-1.348-.32-2.626-.994-3.903-2.059a17.717 17.717 0 0 1 2.98-.248c.746 0 1.385.035 1.81.142.497.106 1.278.426 1.1 1.348zm-7.524-1.668a38.01 38.01 0 0 0-2.945.674 39.68 39.68 0 0 0-2.52.745 40.05 40.05 0 0 0 1.207-2.555c.426-.994.78-2.023 1.136-2.981.354.603.745 1.207 1.135 1.739a50.127 50.127 0 0 0 1.987 2.378zM10.038 1.46a.768.768 0 0 1 .674-.425c.745 0 .887.851.887 1.526 0 1.135-.355 2.874-.958 4.861-1.03-2.768-1.1-5.074-.603-5.962zM6.134 17.997c-1.81 2.981-3.549 4.826-4.613 4.826a.872.872 0 0 1-.532-.177c-.213-.213-.32-.461-.249-.745.213-1.065 2.271-2.555 5.394-3.904Z"/></g>

    <rect x="44" y="36" width="11" height="5" rx="2" fill="white"/><rect x="44" y="43" width="11" height="5" rx="2" fill="white"/>

<header class="top">
  <div><h1>File loader — 20 designs</h1><p>All 20 in the Orbit / Reactor family — kinetic motion around the file icon, Option 1 layout. Pick the file type, switch the theme, press Cancel, or Replay.</p></div>
  <div class="ctl">
    <div class="seg" id="kind"><button data-k="pcb" aria-pressed="true"><i class="dt" style="background:var(--copper)"></i>Boardview</button><button data-k="pdf" aria-pressed="false"><i class="dt" style="background:var(--red)"></i>Schematic</button><button data-k="hs" aria-pressed="false"><i class="dt" style="background:var(--ok)"></i>Hardware fix</button></div>
    <div class="seg" id="theme"><button data-t="light" aria-pressed="true">Light</button><button data-t="dark" aria-pressed="false">Dark</button></div>
  </div>
</header>
<main class="grid" id="grid"></main>
<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const X = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>', TICK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const K = {pcb: {l: 'Boardview', c: 'var(--copper)', i: 'i-pcb', n: 'iPhone 12_12Pro', mb: 9.6},
  pdf: {l: 'Schematic', c: 'var(--red)', i: 'i-pdf', n: 'iPhone 12_12Pro Schematic', mb: 4.2},
  hs: {l: 'Hardware Solution', c: 'var(--ok)', i: 'i-hw', n: 'iPhone 12 HS No Power', mb: 1.8}};
const ST = ['Connecting', 'Downloading', 'Verifying', 'Opening'], CUT = [0, 8, 86, 96, 100];
const stageOf = p => p >= 100 ? 4 : Math.max(0, CUT.findIndex((c, i) => i < 4 && p < CUT[i + 1]));
const lab = s => `<span class="kd">${s.k.l}</span> · ${s.si > 3 ? 'Ready' : ST[s.si]}`;
const esc = t => t.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const loop = (el, fn) => { const f = () => { if (!el.isConnected) return; fn(); requestAnimationFrame(f); }; requestAnimationFrame(f); };
const colOf = (el, v = '--c') => { el._cc = el._cc || {}; if (!el._cc[v]) { const t = document.createElement('i'); t.style.color = `var(${v})`; el.appendChild(t); el._cc[v] = getComputedStyle(t).color; t.remove(); } return el._cc[v]; };
const PA = q => `<circle class="pa0" cx="62" cy="62" r="${q}"/><circle class="pa" cx="62" cy="62" r="${q}" pathLength="100"/>`;
const kset = (el, s) => { o1set(el, s); $$('.pa', el).forEach(a => a.style.strokeDashoffset = 100 - s.p); };
const gear = (cx, cy, n, ro, ri) => { const P = 2 * Math.PI / n; let d = ''; for (let i = 0; i < n; i++) { const a = i * P;
  [[ri, a], [ro, a + .18 * P], [ro, a + .45 * P], [ri, a + .62 * P]].forEach(([q, t], j) => d += (i || j ? 'L' : 'M') + (cx + Math.cos(t) * q).toFixed(1) + ' ' + (cy + Math.sin(t) * q).toFixed(1)); } return d + 'Z'; };
const o1 = (k, cls, vis, o = {}) => `<div class="o1 ${cls}">${o.extra || ''}<div class="vis ${o.v || ''}">${vis}${o.ic === false ? '' : `<span class="ic${o.sm ? ' sm' : ''}">${use(k.i)}<span class="chk">${TICK}</span></span>`}${o.ic === false ? `<span class="vk">${TICK}</span>` : ''}</div>
  <div class="oi"><div class="eb"><i></i><span class="sl"></span></div>${o.v24 ? `<div class="tr"><h3>${k.n}</h3><div class="pct"><span class="n">0</span><small>%</small></div></div><div class="bar"><i></i></div>` : `<h3>${k.n}</h3><div class="pct"><span class="n">0</span><small>%</small></div>`}
  <div class="steps">${['Connect', 'Download', 'Verify', 'Open'].map(t => `<span><b></b><em>${t}</em></span>`).join('')}</div>
  <div class="pfoot"><span><span class="mb"></span> · <span class="sp"></span></span><button class="cn" data-x>Cancel</button></div></div></div>`;
const o1set = (el, s) => { $$('.oi .n', el).forEach(n => n.textContent = Math.round(s.p)); if (0) $('.n', el).textContent = Math.round(s.p); $('.sl', el).innerHTML = lab(s); $('.mb', el).textContent = `${s.mb} / ${s.k.mb} MB`; $('.sp', el).textContent = s.sp;
  $$('.steps span', el).forEach((x, i) => { const f = Math.max(0, Math.min(1, (s.p - CUT[i]) / (CUT[i + 1] - CUT[i]))); x.style.setProperty('--f', f * 100 + '%'); x.classList.toggle('ok', f >= 1); x.classList.toggle('cur', i === s.si && f < 1); }); };
const use = id => `<svg><use href="#${id}"/></svg>`;

/* each design: html(k) → markup; set(el, s) with s = {p, si, mb, sp, eta, k}; done(el) */
const D = [
 {name: 'Orbit', desc: 'Three satellites circle the file icon on tilted orbits inside a filling ring, on a softly tinted card.',
  html: k => o1(k, 'v25', `<svg viewBox="0 0 124 124"><circle class="pr0" cx="62" cy="62" r="58"/><circle class="pr" cx="62" cy="62" r="58" pathLength="100"/>
    ${[[0, '3.2s', 44], [60, '4.6s', 40], [120, '2.4s', 46]].map(([t, d, rr]) => `<g transform="rotate(${t} 62 62) translate(62 62) scale(1 .38) translate(-62 -62)"><circle class="trk" cx="62" cy="62" r="${rr}"/><g><animateTransform attributeName="transform" type="rotate" from="0 62 62" to="360 62 62" dur="${d}" repeatCount="indefinite"/><circle class="sat" cx="${62 + rr}" cy="62" r="5"/></g></g>`).join('')}</svg>`),
  set: (el, s) => { o1set(el, s); $('.pr', el).style.strokeDashoffset = 100 - s.p; }},

 {name: 'Reactor', desc: 'Three rings turn at different speeds around the icon; the outer ring of 40 segments charges up with the download.',
  html: k => { let seg = ''; for (let i = 0; i < 40; i++) { const a0 = i / 40 * 6.2832 - 1.5708 + .025, a1 = (i + 1) / 40 * 6.2832 - 1.5708 - .025, R = 56;
      seg += `<path class="seg" d="M${(62 + Math.cos(a0) * R).toFixed(2)} ${(62 + Math.sin(a0) * R).toFixed(2)}A${R} ${R} 0 0 1 ${(62 + Math.cos(a1) * R).toFixed(2)} ${(62 + Math.sin(a1) * R).toFixed(2)}"/>`; }
    const rot = (d, rev) => `<animateTransform attributeName="transform" type="rotate" from="${rev ? 360 : 0} 62 62" to="${rev ? 0 : 360} 62 62" dur="${d}" repeatCount="indefinite"/>`;
    return o1(k, 'w14', `<svg viewBox="0 0 124 124">${seg}<g><circle class="r2" cx="62" cy="62" r="46"/>${rot('6s')}</g><g><circle class="r3" cx="62" cy="62" r="38" pathLength="102"/>${rot('2.6s', 1)}</g><circle class="core" cx="62" cy="62" r="28"/></svg>`, {sm: true}); },
  set: (el, s) => { o1set(el, s); const n = Math.round(s.p * .4); $$('.seg', el).forEach((x, i) => x.classList.toggle('on', i < n)); }},


 {name: 'Gyroscope', desc: 'Three rings spin on different axes in real 3D around the file icon, each carrying a small light, inside a filling progress ring.',
  html: k => o1(k, 'k', `${PA(58)}<span class="gy"><i></i><i></i><i></i></span>`, {sm: true}), set: kset},

 {name: 'Radar', desc: 'A radar sweep turns around the icon; a new blip lights up for each part of the file that arrives.',
  html: k => o1(k, 'k', `<span class="sw"></span><svg viewBox="0 0 124 124">${[20, 36, 52].map(q => `<circle class="ln" cx="62" cy="62" r="${q}"/>`).join('')}<path class="ln" d="M62 8V116M8 62H116"/>
    ${[[40, 38], [88, 36], [94, 80], [32, 86], [62, 26], [74, 98]].map(([x, y], i) => `<circle class="bp" data-t="${12 + i * 15}" cx="${x}" cy="${y}" r="3.4"/>`).join('')}${PA(58)}</svg>`, {sm: true}),
  set: (el, s) => { kset(el, s); $$('.bp', el).forEach(b => b.classList.toggle('on', s.p >= +b.dataset.t)); }},

 {name: 'Sonar Pulse', desc: 'Rings ripple out from the icon like sonar while 12 bold segments around the edge charge up one by one.',
  html: k => { let sg = ''; for (let i = 0; i < 12; i++) { const a0 = i / 12 * 6.2832 - 1.5708 + .1, a1 = (i + 1) / 12 * 6.2832 - 1.5708 - .1;
      sg += `<path class="sg" d="M${(62 + Math.cos(a0) * 57).toFixed(1)} ${(62 + Math.sin(a0) * 57).toFixed(1)}A57 57 0 0 1 ${(62 + Math.cos(a1) * 57).toFixed(1)} ${(62 + Math.sin(a1) * 57).toFixed(1)}"/>`; }
    return o1(k, 'k', `<svg viewBox="0 0 124 124"><circle class="pl" cx="62" cy="62" r="50"/><circle class="pl" cx="62" cy="62" r="50"/><circle class="pl" cx="62" cy="62" r="50"/>${sg}</svg>`); },
  set: (el, s) => { kset(el, s); const n = Math.round(s.p * .12); $$('.sg', el).forEach((x, i) => x.classList.toggle('on', i < n)); }},

 {name: 'Gear Train', desc: 'A big gear turns behind the icon and drives two small gears; the big gear\'s outline is traced in colour as the file loads.',
  html: k => { const G = gear(62, 62, 18, 36, 31), g1 = gear(98.4, 31.5, 8, 16, 12), g2 = gear(25.6, 92.5, 8, 16, 12);
    const rot = (cx, cy, d, rev) => `<animateTransform attributeName="transform" type="rotate" from="${rev ? 360 : 0} ${cx} ${cy}" to="${rev ? 0 : 360} ${cx} ${cy}" dur="${d}" repeatCount="indefinite"/>`;
    return o1(k, 'k', `<svg viewBox="0 0 124 124"><g><path class="gr" d="${g1}"/>${rot(98.4, 31.5, '4s', 1)}</g><g><path class="gr" d="${g2}"/>${rot(25.6, 92.5, '4s', 1)}</g>
      <g><path class="gr" d="${G}"/><path class="grp" pathLength="100" d="${G}"/>${rot(62, 62, '9s')}</g></svg>`, {sm: true}); },
  set: (el, s) => { kset(el, s); $('.grp', el).style.strokeDashoffset = 100 - s.p; }},

 {name: 'Saturn', desc: 'The icon is a planet: its tilted ring fills with colour as progress, and a small moon circles it.',
  html: k => { const id = 'sat' + Math.random().toString(36).slice(2, 7), E = 'cx="62" cy="62" rx="56" ry="15"';
    return o1(k, 'k', `<svg viewBox="0 0 124 124"><defs><clipPath id="${id}"><rect x="0" y="62" width="124" height="70"/></clipPath></defs>
      <g transform="rotate(-22 62 62)"><ellipse class="rg0" ${E}/><ellipse class="rgp" ${E} pathLength="100"/></g><circle class="pln" cx="62" cy="62" r="27"/>
      <g transform="rotate(-22 62 62)" clip-path="url(#${id})"><ellipse class="rg0" ${E}/><ellipse class="rgp" ${E} pathLength="100"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="0 62 62" to="360 62 62" dur="5s" repeatCount="indefinite"/><circle class="dot" cx="62" cy="10" r="4.5"/></g></svg>`, {sm: true}); },
  set: (el, s) => { kset(el, s); $$('.rgp', el).forEach(x => x.style.strokeDashoffset = 100 - s.p); }},

 {name: 'Comet', desc: 'Two comets with glowing tails race around the icon in opposite directions while the progress ring fills behind them.',
  html: k => { const comet = (rr, d, rev) => `<g><animateTransform attributeName="transform" type="rotate" from="${rev ? 360 : 0} 62 62" to="${rev ? 0 : 360} 62 62" dur="${d}" repeatCount="indefinite"/>
      ${Array.from({length: 11}, (_, j) => { const a = (rev ? j : -j) * 5 * Math.PI / 180 - Math.PI / 2; return `<circle class="dot" cx="${(62 + Math.cos(a) * rr).toFixed(1)}" cy="${(62 + Math.sin(a) * rr).toFixed(1)}" r="${(4.6 * (1 - j / 13)).toFixed(2)}" opacity="${(1 - j / 11).toFixed(2)}"/>`; }).join('')}</g>`;
    return o1(k, 'k', `<svg viewBox="0 0 124 124">${PA(50)}<circle class="ln" cx="62" cy="62" r="36"/>${comet(50, '1.8s')}${comet(36, '2.6s', 1)}</svg>`, {sm: true}); },
  set: kset},

 {name: 'Stopwatch', desc: 'A stopwatch face: 60 ticks fill as the file loads while a sweep hand runs around the dial, with a crown on top.',
  html: k => { let t = ''; for (let i = 0; i < 60; i++) { const a = i / 60 * 6.2832 - 1.5708, mj = i % 5 === 0, r0 = mj ? 47 : 51;
      t += `<line class="tk${mj ? ' mj' : ''}" x1="${(62 + Math.cos(a) * r0).toFixed(1)}" y1="${(62 + Math.sin(a) * r0).toFixed(1)}" x2="${(62 + Math.cos(a) * 57).toFixed(1)}" y2="${(62 + Math.sin(a) * 57).toFixed(1)}"/>`; }
    return o1(k, 'k', `<svg viewBox="0 0 124 124"><rect class="crn" x="57" y="-5" width="10" height="5" rx="1.5"/><rect class="crn" x="93" y="9" width="8" height="4" rx="1.5" transform="rotate(45 97 11)"/>${t}
      <g><animateTransform attributeName="transform" type="rotate" from="0 62 62" to="360 62 62" dur="2s" repeatCount="indefinite"/><line class="hnd" x1="62" y1="38" x2="62" y2="20"/><circle class="dot" cx="62" cy="20" r="3"/></g></svg>`, {sm: true}); },
  set: (el, s) => { kset(el, s); const n = Math.round(s.p * .6); $$('.tk', el).forEach((x, i) => x.classList.toggle('on', i < n)); }},

 {name: 'Helix Ring', desc: 'A DNA-style double helix wraps around the icon and keeps twisting; its beads take the file colour as the download moves round.',
  html: k => o1(k, 'k', '<canvas width="248" height="248"></canvas>', {sm: true}),
  init: el => { const cv = $('canvas', el), g = cv.getContext('2d'); let t = 0;
    loop(el, () => { const col = colOf(el), gr = colOf(el, '--panel-3'), p = el._p || 0; t += el.classList.contains('done') ? .2 : .04; g.clearRect(0, 0, 248, 248);
      const P = []; for (let i = 0; i < 72; i++) { const th = i / 72 * 6.2832 - 1.5708; P.push([0, 1].map(sd => { const ph = 6 * th + t + sd * Math.PI, rr = (44 + 8 * Math.sin(ph)) * 2; return [124 + Math.cos(th) * rr, 124 + Math.sin(th) * rr, Math.cos(ph)]; })); }
      g.lineWidth = 1.5; P.forEach((q, i) => { if (i % 3) return; g.strokeStyle = gr; g.globalAlpha = .6; g.beginPath(); g.moveTo(q[0][0], q[0][1]); g.lineTo(q[1][0], q[1][1]); g.stroke(); });
      P.forEach((q, i) => q.forEach(([x, y, z]) => { g.globalAlpha = .45 + .55 * (z + 1) / 2; g.fillStyle = i / 72 * 100 < p ? col : gr; g.beginPath(); g.arc(x, y, 2.6 + 2 * (z + 1) / 2, 0, 6.2832); g.fill(); }));
      g.globalAlpha = 1; }); },
  set: (el, s) => { kset(el, s); el._p = s.p; }},

 {name: 'Spirograph', desc: 'A spirograph pattern draws itself around the icon as the file loads, while the whole figure slowly turns.',
  html: k => { const R = 50, q = 14, d = 14; let path = ''; for (let i = 0; i <= 700; i++) { const t = i / 700 * Math.PI * 14, x = (R - q) * Math.cos(t) + d * Math.cos((R - q) / q * t), y = (R - q) * Math.sin(t) - d * Math.sin((R - q) / q * t);
      path += (i ? 'L' : 'M') + (62 + x * 1.1).toFixed(1) + ' ' + (62 + y * 1.1).toFixed(1); }
    return o1(k, 'k', `<svg viewBox="0 0 124 124"><g><animateTransform attributeName="transform" type="rotate" from="0 62 62" to="360 62 62" dur="16s" repeatCount="indefinite"/>
      <path d="${path}" fill="none" stroke="var(--panel-3)" stroke-width="1"/><path class="spp" d="${path}" pathLength="100" fill="none" stroke="var(--c)" stroke-width="1.4" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset .18s linear"/></g></svg>`, {sm: true}); },
  set: (el, s) => { kset(el, s); $('.spp', el).style.strokeDashoffset = 100 - s.p; }},

 {name: 'Activity Rings', desc: 'Three rings like a fitness watch: the outer one is total progress, the middle one is the current step and the inner one shows live speed.',
  html: k => o1(k, 'k', `<svg viewBox="0 0 124 124">${[[54, 'var(--c)'], [43, 'color-mix(in srgb,var(--c) 60%,#fff)'], [32, 'color-mix(in srgb,var(--c) 60%,#000)']].map(([q, c], i) => `<circle class="ar0" cx="62" cy="62" r="${q}" stroke="${c}"/><circle class="arp ar${i}" cx="62" cy="62" r="${q}" stroke="${c}" pathLength="100"/>`).join('')}</svg>`, {sm: true}),
  set: (el, s) => { kset(el, s); const f = Math.max(0, Math.min(1, (s.p - CUT[Math.min(3, s.si)]) / ((CUT[Math.min(3, s.si) + 1]) - CUT[Math.min(3, s.si)])));
    $('.ar0', el).style.strokeDashoffset = 100 - s.p; $('.ar1', el).style.strokeDashoffset = 100 - (s.p >= 100 ? 100 : f * 100); $('.ar2', el).style.strokeDashoffset = 100 - Math.min(100, (parseFloat(s.sp) || (s.p >= 100 ? 15 : 0)) / 15 * 100); }},

 {name: 'Swarm', desc: 'A swarm of particles orbits the icon at different heights and speeds, leaving soft trails; more of them light up as the file arrives.',
  html: k => o1(k, 'k', '<canvas width="248" height="248"></canvas>'),
  init: el => { const cv = $('canvas', el), g = cv.getContext('2d'), P = Array.from({length: 70}, (_, i) => ({r: 62 + Math.random() * 54, a: Math.random() * 6.283, w: (.012 + Math.random() * .03) * (i % 2 ? 1 : -1), z: Math.random()}));
    loop(el, () => { const col = colOf(el), gr = colOf(el, '--panel-3'), bg = colOf(el, '--panel'), p = el._p || 0, sp = el.classList.contains('done') ? 4 : .6 + (el._sp || 0) / 10;
      g.globalAlpha = .25; g.fillStyle = bg; g.fillRect(0, 0, 248, 248); g.globalAlpha = 1;
      P.forEach((o, i) => { o.a += o.w * sp; g.fillStyle = i / 70 * 100 < p ? col : gr; g.beginPath(); g.arc(124 + Math.cos(o.a) * o.r, 124 + Math.sin(o.a) * o.r * .92, 1.8 + o.z * 2.2, 0, 6.283); g.fill(); }); }); },
  set: (el, s) => { kset(el, s); el._p = s.p; el._sp = parseFloat(s.sp) || 0; }},

 {name: 'Hex Ring', desc: 'Twelve hexagon cells circle the icon and slowly rotate; each cell snaps to colour (the newest pulses) as the file loads.',
  html: k => { const hx = (cx, cy, q) => Array.from({length: 6}, (_, i) => { const a = Math.PI / 3 * i + Math.PI / 6; return (i ? 'L' : 'M') + (cx + Math.cos(a) * q).toFixed(1) + ' ' + (cy + Math.sin(a) * q).toFixed(1); }).join('') + 'Z';
    const cells = Array.from({length: 12}, (_, i) => { const a = i / 12 * 6.2832 - 1.5708; return `<path class="hx" d="${hx(62 + Math.cos(a) * 48, 62 + Math.sin(a) * 48, 8)}"/>`; }).join('');
    return o1(k, 'k', `<svg viewBox="0 0 124 124"><path class="hxc" d="${hx(62, 62, 30)}"/><g><animateTransform attributeName="transform" type="rotate" from="0 62 62" to="360 62 62" dur="24s" repeatCount="indefinite"/>${cells}</g></svg>`, {sm: true}); },

 {name: 'Wave Ring', desc: 'A ring that ripples like liquid around the icon; the ripple grows with the speed and the colour flows round as progress.',

let KIND = 'pcb';

function run(i) {

  const el = w.firstElementChild; let p = 0; d.init && d.init(el);
  const tick = () => { const si = stageOf(p), mb = (k.mb * p / 100).toFixed(1), spd = 6 + Math.random() * 8;
    d.set(el, {p, si, mb, k, sp: p > 8 && p < 100 ? spd.toFixed(1) + ' MB/s' : p >= 100 ? 'Done' : '— MB/s', eta: p >= 100 ? '0 s' : p > 8 ? Math.max(1, Math.ceil((k.mb - mb) / spd)) + ' s' : '…'});
