<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass pin card + vertical layers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{--page:#e9edf3;--card:#fff;--hair:#dfe4ec;--text:#0e2140;--text-2:#4a5b75;--text-3:#8592a6;--acc:#0d847d;--acc-soft:rgba(13,132,125,.12);
  --gl:rgba(255,255,255,.56);--gb:rgba(255,255,255,.6);--ghi:rgba(255,255,255,.95);--gt:#0c1d36;--gs:#3e4f69;--gline:rgba(14,33,64,.13);--gfill:rgba(255,255,255,.4);--gfill2:rgba(255,255,255,.7);--gbg:#fff;--gacc:#0d847d}
[data-theme=dark]{--page:#070b12;--card:#0f1623;--hair:#1d2738;--text:#e6edf7;--text-2:#a7b4c8;--text-3:#6f7f99;--acc-soft:rgba(45,212,191,.14);
  --gl:rgba(14,20,32,.5);--gb:rgba(255,255,255,.14);--ghi:rgba(255,255,255,.2);--gt:#eef3fa;--gs:#a9b6c9;--gline:rgba(255,255,255,.12);--gfill:rgba(255,255,255,.06);--gfill2:rgba(255,255,255,.14);--gbg:#0b1220;--gacc:#2dd4bf}
*{box-sizing:border-box;margin:0}
body{font:13px/1.45 Inter,system-ui,sans-serif;background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:600 10px 'JetBrains Mono';padding:1px 5px;border-radius:4px;background:var(--gfill2);box-shadow:inset 0 0 0 1px var(--gline);color:var(--gt)}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.top .in{max-width:1340px;margin:auto;padding:13px 24px;display:flex;align-items:center;gap:16px}
.top h1{font-size:17px}.top p{font-size:12.5px;color:var(--text-2)}
.tbtn{margin-left:auto;flex:none;height:34px;padding:0 13px;border-radius:9px;background:var(--card);box-shadow:0 0 0 1px var(--hair);font-weight:600;font-size:12.5px}
main{max-width:1340px;margin:auto;padding:20px 24px 80px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--hair),0 14px 30px -22px rgba(14,33,64,.5);display:grid;gap:10px;min-width:0}
.meta{display:flex;gap:10px;align-items:flex-start;padding:2px 4px}
.num{font:700 12px 'JetBrains Mono';color:var(--acc);background:var(--acc-soft);border-radius:7px;padding:3px 7px}
.meta h3{font-size:14px}.meta p{font-size:12px;color:var(--text-3)}
.stg{position:relative;height:410px;border-radius:12px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0c2a1f,#050f0b 78%);user-select:none}
.brd{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px)}
.brd .ly{transition:opacity .25s}
.brd .pn{fill:#d9b55c}
.brd .pn.bt{fill:#8fa3a0}
.brd .pn.dim{opacity:.25}
.brd .pn.hl{fill:#fff;stroke:#2dd4bf;stroke-width:1.6}
.brd .pn.cur{fill:#fff;stroke:#fff;stroke-width:2.2}
.brd .hit{fill:transparent;cursor:pointer}
.cd{position:absolute;z-index:20;pointer-events:none}
.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#0e2140;color:#fff;padding:9px 15px;border-radius:10px;font-weight:600;font-size:12.5px;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sw{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}

/* ---------- glass base ---------- */
.gls{background:var(--gl);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);box-shadow:inset 0 0 0 1px var(--gb),inset 0 1px 0 var(--ghi),0 18px 40px -16px rgba(0,0,0,.75);color:var(--gt)}
.smk{--gl:rgba(10,15,25,.5);--gb:rgba(255,255,255,.15);--ghi:rgba(255,255,255,.22);--gt:#f1f5fb;--gs:#a7b4c8;--gline:rgba(255,255,255,.12);--gfill:rgba(255,255,255,.07);--gfill2:rgba(255,255,255,.14);--gbg:#0b1220;--gacc:#2dd4bf}
.vb{position:absolute;z-index:10}
.mid{top:50%;transform:translateY(-50%)}
/* leader line: pin → card */
.ld{position:absolute;z-index:19;height:2px;margin-top:-1px;pointer-events:none;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 35%,transparent))}
.ld.l{background:linear-gradient(270deg,var(--c),color-mix(in srgb,var(--c) 35%,transparent))}
.ld::before{content:"";position:absolute;left:0;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;box-shadow:0 0 0 2px var(--c),0 0 12px var(--c)}
.ld.l::before{left:100%}
.ld::after{content:"";position:absolute;left:100%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c)}
.ld.l::after{left:0}

/* ======================= LAYER BARS ======================= */
/* 21 bottom edge tabs */
.v21{left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:flex-end;gap:3px}
.v21 button.gls{display:flex;flex-direction:column;align-items:center;gap:2px;width:42px;height:28px;padding-top:7px;border-radius:10px 10px 0 0;font:800 11.5px Inter;transition:height .2s;box-shadow:inset 0 3px 0 var(--c),inset 0 0 0 1px var(--gb),0 -6px 14px -6px rgba(0,0,0,.6)}
.v21 button span{display:none;font:600 9px Inter;opacity:.85;white-space:nowrap}
.v21 button.gls:hover{height:34px}
.v21 button.gls.on{height:48px;background:color-mix(in srgb,var(--c) 45%,var(--gl));box-shadow:inset 0 3px 0 var(--c),inset 0 0 0 1px var(--c),0 0 16px -4px var(--c)}.v21 button.on span{display:block}
.v21 .all.gls{width:50px;box-shadow:inset 0 0 0 1px var(--gb),0 -6px 14px -6px rgba(0,0,0,.6)}.v21 .all.gls.on{height:34px;background:var(--gt);color:var(--gbg)}
/* ======================= DOCKED LAYER TOOLBARS (20 unique) ======================= */
:root{--nm:#e4e9f0;--nmd:rgba(130,145,170,.55);--nml:#fff}
[data-theme=dark]{--nm:#1b2232;--nmd:rgba(0,0,0,.6);--nml:rgba(255,255,255,.07)}
@keyframes slx{from{left:var(--from)}to{left:var(--to)}}
@keyframes rot{from{transform:rotate(var(--rf))}to{transform:rotate(var(--rt))}}
@keyframes pu{50%{box-shadow:0 0 0 6px transparent,0 0 10px var(--c)}}
@keyframes flp{from{transform:perspective(200px) rotateX(-90deg)}to{transform:none}}
.vb .all.on{background:var(--gt);color:var(--gbg)}
.dk{left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:0}
.dk.gls{box-shadow:inset 0 1px 0 var(--gb),inset 0 2px 0 var(--ghi),0 -12px 30px -14px rgba(0,0,0,.7)}
.dk .sep{flex:none;width:1px;height:22px;background:var(--gline)}
.dk .cap{font:800 8.5px Inter;letter-spacing:.12em;color:var(--gs);text-transform:uppercase;white-space:nowrap;line-height:1.4}
.dk .cnt{font:600 10px 'JetBrains Mono';font-style:normal;color:var(--gs);white-space:nowrap}
.dk .tbn{flex:none;height:28px;padding:0 11px;border-radius:7px;font:700 11px Inter;color:var(--gt);box-shadow:inset 0 0 0 1px var(--gline);white-space:nowrap}
.dk .tbn:hover{background:var(--gfill2)}
.dk .ml{margin-left:auto}
.dk .nm{display:flex;align-items:center;gap:7px;font:600 11.5px Inter;white-space:nowrap;color:var(--gt)}
.dk .nm .sw{border-radius:50%;box-shadow:0 0 8px var(--c)}

/* e1 notched tab bar with centre button */
.dk.e1{height:54px;overflow:visible;justify-content:space-between;padding:0 10px}
.e1 .grp{display:flex;gap:1px}
.e1 .grp button{display:grid;justify-items:center;align-content:center;gap:2px;width:46px;height:46px;border-radius:10px;color:var(--gs)}
.e1 .grp button i{width:8px;height:8px;border-radius:4px;background:var(--c);transition:width .2s}
.e1 .grp button b{font:800 11.5px 'JetBrains Mono'}.e1 .grp button small{font:500 8.5px Inter;white-space:nowrap}
.e1 .grp button:hover{background:var(--gfill2);color:var(--gt)}
.e1 .grp button.on{color:var(--gt)}.e1 .grp button.on i{width:22px;box-shadow:0 0 8px var(--c)}
.e1 .fab{position:absolute;left:50%;top:-24px;width:62px;height:62px;margin-left:-31px;border-radius:50%;display:grid;place-items:center;align-content:center;background:var(--c);color:#0b1220;box-shadow:0 0 0 6px #06110c,0 0 24px -2px var(--c),0 10px 20px rgba(0,0,0,.5)}
.e1 .fab.rb{background:conic-gradient(#4f8ff7,#f59e42,#4cc46a,#f5c84b,#3fd0e0,#ef5a5a,#9b7cf2,#4f8ff7);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.e1 .fab b{font:800 17px 'JetBrains Mono';line-height:1}.e1 .fab small{font:800 7.5px Inter;letter-spacing:.1em}

/* e2 neumorphic */
.dk.e2{height:58px;background:var(--nm);justify-content:center;gap:11px;box-shadow:0 -1px 0 var(--nml),0 -12px 26px -12px rgba(0,0,0,.6)}
.e2 button{position:relative;width:36px;height:36px;border-radius:11px;background:var(--nm);font:800 12px Inter;color:var(--gs);box-shadow:4px 4px 9px var(--nmd),-4px -4px 9px var(--nml);transition:.15s}
.e2 button::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:var(--c);transition:.15s}
.e2 button:hover{color:var(--gt)}
.e2 button.on,.vb.e2 .all.on{background:var(--nm);color:var(--gt);box-shadow:inset 3px 3px 7px var(--nmd),inset -3px -3px 7px var(--nml)}
.e2 button.on::after{width:16px;margin-left:-8px;box-shadow:0 0 8px var(--c)}
.e2 .all{width:52px;font-size:10px;letter-spacing:.06em}.e2 .all::after{background:linear-gradient(90deg,#4f8ff7,#f59e42,#4cc46a,#ef5a5a,#9b7cf2);width:20px;margin-left:-10px}

/* e3 blueprint */
.dk.e3{height:52px;gap:4px;background:#0d3b74;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:10px 10px;border-top:2px solid rgba(255,255,255,.75);color:#dbe9ff}
.e3 .ttl{font:700 8.5px/1.35 'JetBrains Mono';letter-spacing:.1em;padding-right:8px;margin-right:4px;border-right:1px dashed rgba(255,255,255,.5)}
.e3 button{position:relative;height:28px;min-width:34px;padding:0 4px;border:1px solid rgba(255,255,255,.55);font:600 10px 'JetBrains Mono';color:#dbe9ff}
.e3 button::before{content:"";position:absolute;left:-1px;right:-1px;top:-6px;height:4px;border:1px solid rgba(255,255,255,.35);border-bottom:0}
.e3 button::after{content:"";position:absolute;left:3px;bottom:3px;width:4px;height:4px;background:var(--c)}
.e3 button:hover{background:rgba(255,255,255,.12)}
.e3 button.on,.vb.e3 .all.on{background:#fff;color:#0d3b74;font-weight:800}
.e3 .all::after{display:none}
.e3 .rt{margin-left:auto;font:600 8.5px/1.4 'JetBrains Mono';text-align:right;letter-spacing:.06em;white-space:nowrap;padding-left:8px;border-left:1px dashed rgba(255,255,255,.5)}

/* e4 piano keys */
.dk.e4{height:66px;padding:0;gap:0;align-items:stretch;background:#0e1116;box-shadow:0 -10px 24px -10px rgba(0,0,0,.7)}
.e4 button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;padding-bottom:9px;background:linear-gradient(#fdfdfd,#e4e8ee 85%,#cfd5de);border-left:1px solid #9aa3b0;border-radius:0 0 6px 6px;font:800 13px Inter;color:#2a3342;box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 75%,transparent);transition:transform .08s}
.e4 button small{font:600 8.5px Inter;color:#6b7686}
.e4 button:hover{background:linear-gradient(#fff,#f2f5f9)}
.e4 button.on{transform:translateY(3px);background:linear-gradient(#e8ecf1,#d2d8e1);box-shadow:inset 0 -11px 0 var(--c),inset 0 4px 7px rgba(0,0,0,.25),0 0 22px -4px var(--c)}
.e4 .all,.vb.e4 .all.on{flex:.85;margin:0 1px 12px 0;border:0;background:linear-gradient(#2d333d,#11151b);color:#e2e8f0;box-shadow:inset 0 -3px 0 #000}.vb.e4 .all.on{color:#2dd4bf;box-shadow:inset 0 -3px 0 #2dd4bf,0 0 14px -4px #2dd4bf}
.e4 .all small{color:#8b95a5}

/* e5 hardware switches */
.dk.e5{height:64px;gap:0;justify-content:space-around;background:linear-gradient(#3b424d,#21262e);border-top:1px solid #5d6672;color:#cfd6df}
.e5 .t5{display:grid;justify-items:center;gap:4px;font:700 9.5px 'JetBrains Mono';color:#cfd6df}
.e5 .led{width:8px;height:8px;border-radius:50%;background:#15181d;box-shadow:inset 0 1px 2px #000}
.e5 .t5.on .led{background:var(--c);box-shadow:0 0 9px var(--c),inset 0 0 2px #fff}
.e5 .tg{position:relative;width:16px;height:24px;border-radius:4px;background:linear-gradient(#14171c,#2b3038);box-shadow:inset 0 1px 3px #000,0 1px 0 #5d6672}
.e5 .tg::after{content:"";position:absolute;left:3px;right:3px;top:12px;height:10px;border-radius:3px;background:linear-gradient(#eef1f4,#97a0ab);box-shadow:0 2px 2px rgba(0,0,0,.6);transition:top .15s}
.e5 .t5.on .tg::after{top:2px}
.e5 .pbs{display:grid;justify-items:center;gap:5px;font:800 8px Inter;letter-spacing:.1em;color:#9aa3ae}
.e5 .pb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a7a,#b91c1c);box-shadow:0 3px 0 #5c0d0d,0 0 0 3px #15181d}
.e5 .pb.k{background:radial-gradient(circle at 40% 35%,#6b7280,#1f2937);box-shadow:0 3px 0 #000,0 0 0 3px #15181d}
.e5 .pb:active{transform:translateY(2px);box-shadow:0 1px 0 #5c0d0d,0 0 0 3px #15181d}

/* e6 timeline + playhead */
.dk.e6{height:54px;padding:0 12px 0 0;gap:10px}
.e6 .all{align-self:stretch;width:58px;border-right:1px solid var(--gline);font:800 10px Inter;letter-spacing:.08em;color:var(--gt)}
.vb.e6 .all.on{background:color-mix(in srgb,var(--gacc) 22%,transparent);color:var(--gt)}
.e6 .tl{position:relative;flex:1;height:100%;display:flex}
.e6 .tl::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,var(--gs) 0 1px,transparent 1px 10%),repeating-linear-gradient(90deg,var(--gline) 0 1px,transparent 1px 2%);opacity:.8;pointer-events:none}
.e6 .tl button{flex:1;display:grid;place-items:center;padding-top:9px;font:700 10.5px 'JetBrains Mono';color:var(--gs)}
.e6 .tl button span{padding-bottom:2px;box-shadow:inset 0 -2px 0 var(--c)}
.e6 .tl button:hover{background:var(--gfill)}.e6 .tl button.on{color:var(--gt)}
.e6 .ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--c);box-shadow:0 0 8px var(--c);pointer-events:none;left:var(--to);animation:slx .45s cubic-bezier(.3,.7,.2,1)}
.e6 .ph::before{content:"";position:absolute;left:50%;top:0;width:14px;height:11px;margin-left:-7px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.e6 .rg{position:absolute;left:0;right:0;top:9px;bottom:0;background:linear-gradient(color-mix(in srgb,var(--gacc) 16%,transparent),transparent);pointer-events:none}

/* e7 sliding pill */
.dk.e7{justify-content:center;gap:12px}
.e7 .sg{position:relative;display:flex;padding:3px;border-radius:12px;background:var(--gfill);box-shadow:inset 0 0 0 1px var(--gline)}
.e7 .sg button{position:relative;z-index:1;width:40px;height:32px;font:800 12px Inter;color:var(--gs);transition:color .25s}
.e7 .sg button:hover{color:var(--gt)}
.e7 .sg button.on,.vb.e7 .sg .all.on{background:none;color:#0b1220}
.e7 .pill{position:absolute;top:3px;bottom:3px;width:40px;border-radius:9px;background:var(--c);box-shadow:0 0 16px -2px var(--c),inset 0 1px 0 rgba(255,255,255,.5);left:var(--to);animation:slx .4s cubic-bezier(.3,.7,.2,1)}
.e7 .pill.rb{background:linear-gradient(135deg,#4f8ff7,#4cc46a,#f5c84b,#ef5a5a)}

/* e8 cross-section */
.dk.e8{height:62px;gap:12px}
.e8 .xs{position:relative;flex:none;width:280px;height:52px;display:grid;grid-template-rows:repeat(10,1fr);padding:0 6px 0 16px;border-radius:6px;background:linear-gradient(90deg,#29452f,#3a5c41 50%,#29452f);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}
.e8 .xs::after{content:"";position:absolute;top:4px;bottom:4px;left:70px;right:40px;background:repeating-linear-gradient(90deg,transparent 0 52px,rgba(217,181,92,.5) 52px 55px);pointer-events:none}
.e8 .xs button{position:relative;display:block}
.e8 .xs button::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:var(--c);opacity:.55;transition:.15s}
.e8 .xs button:hover::before{opacity:1}
.e8 .xs button.on::before{height:4px;margin-top:-2px;opacity:1;box-shadow:0 0 8px var(--c)}
.e8 .xs button.on::after{content:"";position:absolute;left:-13px;top:50%;margin-top:-4px;border:4px solid transparent;border-left:7px solid #fff}
.e8 .ro{display:grid;gap:2px}.e8 .ro b{display:flex;align-items:center;gap:6px;font:700 12px Inter;color:var(--gt)}.e8 .ro b .sw{border-radius:50%;box-shadow:0 0 8px var(--c)}.e8 .ro span{font:500 10.5px Inter;color:var(--gs)}

/* e9 rotary knob + LCD */
.dk.e9{height:60px;gap:14px;background:linear-gradient(#2b3038,#171a20);border-top:1px solid #454c57;color:#cfd6df}
.e9 .kb{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5d6573,#262a31 70%);box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.3),0 0 0 3px #101215,0 0 0 4px #3b424d}
.e9 .kb .pt{position:absolute;inset:0;transform:rotate(var(--rt));animation:rot .45s cubic-bezier(.3,.7,.2,1);pointer-events:none}
.e9 .kb .pt::before{content:"";position:absolute;left:50%;top:5px;width:3px;height:11px;margin-left:-1.5px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c)}
.e9 .kb button{position:absolute;top:0;bottom:0;width:50%}.e9 .kb .l{left:0;cursor:w-resize}.e9 .kb .r{right:0;cursor:e-resize}
.e9 .lcd{display:grid;min-width:150px;padding:4px 12px;border-radius:5px;background:linear-gradient(#bccc9c,#a6b885);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 0 0 2px #0d0f12;color:#1d2812;font:800 19px/1.05 'JetBrains Mono';letter-spacing:.06em}
.e9 .lcd small{font:700 9px 'JetBrains Mono';letter-spacing:.06em;opacity:.75}
.e9 .lds{display:flex;gap:5px}
.e9 .lds button{display:grid;justify-items:center;gap:3px;font:700 8.5px 'JetBrains Mono';color:#8b95a5}
.e9 .lds button i{width:9px;height:9px;border-radius:2px;background:#14171c;box-shadow:inset 0 1px 2px #000}
.e9 .lds button.lit i{background:var(--c);box-shadow:0 0 7px var(--c)}.e9 .lds button.on{color:#fff}
.e9 .all,.vb.e9 .all.on{height:30px;padding:0 11px;border-radius:5px;background:linear-gradient(#3e444d,#24282e);color:#cfd6df;font:800 10px 'JetBrains Mono';box-shadow:0 2px 0 #0b0d10}.vb.e9 .all.on{color:#bccc9c}

/* e10 folder tabs — browser-style tabs on a folder body */
.dk.e10{--fb:#f5f7fa;--ft:#0e2140;--fs:#5d6b80;--fl:rgba(14,33,64,.12);display:block;height:58px;padding:0;background:none}
[data-theme=dark] .dk.e10{--fb:#141b26;--ft:#f1f5f9;--fs:#94a3b8;--fl:rgba(255,255,255,.1)}
.e10 .tabs{position:absolute;left:12px;right:6px;bottom:22px;height:34px;display:flex;align-items:flex-end}
.e10 .tab{position:relative;flex:none;display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:9px 9px 0 0;font:700 11px 'JetBrains Mono';color:var(--fs);background:color-mix(in srgb,var(--fb) 62%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin-right:2px;transition:height .15s,background .15s}

<body>

  <button class="tbtn" data-a="theme">◐ Light / Dark</button>
</div></header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);

  chip:'M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4', pin:'M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 11v10', net:'M4 12h5M15 12h5M9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0', link:'M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1',
  copy:'M9 9h11v11H9zM5 15H4V4h11v1', hl:'M12 3v3M12 18v3M3 12h3M18 12h3M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', doc:'M6 3h9l4 4v14H6zM14 3v5h5', search:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8', prev:'M15 6l-6 6 6 6', next:'M9 6l6 6-6 6', diode:'M3 12h5M16 12h5M8 6.5l8 5.5-8 5.5zM16 6.5v11'};

let sd = 11; const R = () => (sd = sd * 16807 % 2147483647) / 2147483647, ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const TR = {};
for (const l of L10) TR[l] = Array.from({length: ri(7, 11)}, () => { let x = ri(30, 610), y = ri(30, 370), d = `M${x} ${y}`; for (let k = 0; k < 4; k++) { if (k % 2) { y = Math.max(24, Math.min(376, y + (R() < .5 ? -1 : 1) * ri(20, 110))); d += `V${y}`; } else { x = Math.max(24, Math.min(616, x + (R() < .5 ? -1 : 1) * ri(30, 160))); d += `H${x}`; } } return d; });

const NCNT = {GND: 312}; NETS.forEach(n => NCNT[n] = NCNT[n] || ri(4, 120)); NCNT.NET39 = 75;
const REFS = ['U2400', 'C6005', 'R2101', 'L1203', 'Q3101', 'C2810', 'U3300', 'R6020', 'J4500', 'D1700', 'C7712', 'U1100'];
const COMPS = [], PINS = [];

REFS.forEach((ref, k) => {
  const two = /^[CRLD]/.test(ref), w = two ? ri(26, 34) : ri(46, 72), h = two ? 14 : ri(30, 46), [cx, cy] = SPOTS[k], side = k % 4 === 3 ? 'BOTTOM' : 'TOP';

    PINS.push({x, y, part: ref, pin: String(i + 1), net, conn: NCNT[net] - 1, diode: R() < .7 ? (0.3 + R() * .4).toFixed(3) : '', side, layer: side === 'TOP' ? 1 : 10}); });
});
const DEF = PINS.findIndex(p => p.part === 'C6005' && p.pin === '1');

/* ---------- state ---------- */
const ST = {};

const isAll = s => L10.every(l => s.op[l] > 0);
const soloOf = s => { const v = L10.filter(l => s.op[l] > 0); return v.length === 1 ? v[0] : null; };
const vis = (s, l) => s.op[l] > 0;
const on = (s, l) => isAll(s) ? false : vis(s, l);

/* ---------- board ---------- */
function board(s) {
  let h = `<svg class="brd" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet"><rect x="6" y="6" width="628" height="388" rx="20" fill="#0f3d2b" stroke="#c9a24a" stroke-width="2"/>`;
  for (const l of [...L10].reverse()) h += `<g class="ly" data-l="${l}" style="opacity:${s.op[l] > 0 ? s.op[l] : .05}" fill="none" stroke="${LC[l]}" stroke-width="${l === 1 || l === 10 ? 2 : 1.4}" stroke-linejoin="round">${TR[l].map(d => `<path d="${d}"/>`).join('')}</g>`;

  return h + '</svg>';
}
const cnt = l => TR[l].length;
IC.up = 'M6 15l6-6 6 6'; IC.down = 'M6 9l6 6 6-6'; IC.layers = 'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5'; IC.chev = 'M6 9l6 6 6-6';
const SN = l => l === 1 ? 'TOP' : l === 10 ? 'BOT' : 'IN' + l;

/* ---------- 20 vertical layer bars ---------- */
const B = (s, l, cls, inner, extra = '') => `<button class="${cls || ''}${on(s, l) ? ' on' : ''}" data-solo="${l}" style="--c:${LC[l]}" title="Show layer ${l} only (${LN(l)})" ${extra}>${inner}</button>`;
const ALLB = (s, cls = 'all', inner = 'ALL') => `<button class="${cls}${isAll(s) ? ' on' : ''}" data-all title="Show all layers">${inner}</button>`;
const DOTS = `<i>${L10.map(l => `<b style="--c:${LC[l]}"></b>`).join('')}</i>`;
const SN2 = l => l === 1 ? 'Top' : l === 10 ? 'Bottom' : 'In ' + l;
const nVis = s => L10.filter(l => vis(s, l)).length;
const pad = n => String(n).padStart(2, '0');
const CC = s => { const so = soloOf(s); return so ? LC[so] : '#2dd4bf'; };
const PV = s => s.pv ?? (soloOf(s) || 0);
const HARD = 'linear-gradient(90deg,' + L10.map((l, k) => `${LC[l]} ${k * 10}% ${(k + 1) * 10}%`).join(',') + ')';
const DK = (n, inner, extra = '', glass = true, style = '') => `<div class="vb dk e${n}${glass ? ' gls' : ''}${extra}"${style ? ` style="${style}"` : ''}>${inner}</div>`;
const CUR = s => { const so = soloOf(s); return `<span class="nm" style="--c:${CC(s)}"><i class="sw"></i>${so ? `L${so} · ${LN(so)}` : 'All layers'}</span>`; };
const U = {
  1: s => { const so = soloOf(s), it = l => B(s, l, '', `<i></i><b>${l}</b><small>${SN2(l)}</small>`); return DK(1, `<div class="grp">${[1, 2, 3, 4, 5].map(it).join('')}</div><button class="fab${so ? '' : ' rb'}" data-all title="Show all layers" style="--c:${CC(s)}"><b>${so ? 'L' + so : 'ALL'}</b><small>${so ? 'TAP = ALL' : 'LAYERS'}</small></button><div class="grp">${[6, 7, 8, 9, 10].map(it).join('')}</div>`); },

$('#main').innerHTML = META.map(([t, d], k) => `<section class="card"><div class="meta"><span class="num">${String(k + 1).padStart(2, '0')}</span><div><h3>${t}</h3><p>${d}</p></div></div><div class="stg" id="s${k + 1}" data-n="${k + 1}"></div></section>`).join('');
function render(n) { const s = st(n), el = $('#s' + n); el.innerHTML = board(s) + U[n](s) + '<i class="ld"></i><div class="cd"></div>'; card(n); }
const GAP = 30, DEFN = {};
function card(n) {
  const s = st(n), el = $('#s' + n), i = s.hov ?? (DEFN[n] ?? DEF), p = PINS[i], cd = el.querySelector('.cd'), ld = el.querySelector('.ld');
  el.querySelectorAll('.pn').forEach(c => { const q = PINS[+c.dataset.pv]; c.classList.toggle('hl', q.net === p.net && +c.dataset.pv !== i); c.classList.toggle('cur', +c.dataset.pv === i); });
  cd.innerHTML = C[n](p); cd.style.setProperty('--c', LC[p.layer]); ld.style.setProperty('--c', LC[p.layer]);
  cd.style.left = '0px'; cd.style.top = '0px';
  const pr = el.querySelector(`[data-pv="${i}"]`).getBoundingClientRect(), er = el.getBoundingClientRect(), px = pr.left + pr.width / 2 - er.left, py = pr.top + pr.height / 2 - er.top;
  const w = cd.offsetWidth, h = cd.offsetHeight; let x = px + GAP, right = true;
  if (x + w > er.width - 8) { x = px - GAP - w; right = false; }
  const vb = el.querySelector('.vb'), vr = vb.getBoundingClientRect(), lim = vr.bottom > er.bottom - 30 ? vr.top - er.top - 10 : er.height - 8;
  let y = Math.max(8, Math.min(lim - h, py - h / 2));

  ld.classList.toggle('l', !right); ld.style.top = py + 'px';

for (let n = 1; n <= 21; n++) render(n);

let tt; const toast = m => { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1500); };
const HT = {};

});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (a) { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; return; }
  const act = e.target.closest('[data-act]'); if (act) return toast(act.dataset.act);
  const stg = e.target.closest('.stg'); if (!stg) return; const n = +stg.dataset.n, s = st(n);
  const b = e.target.closest('[data-solo],[data-all],[data-none],[data-eye],[data-step],[data-side],[data-col],[data-set],[data-dd],[data-cyc],[data-run]'); if (!b) return;
  s.pv = soloOf(s) || 0;
  if (b.dataset.solo) { const l = +b.dataset.solo; L10.forEach(k => s.op[k] = k === l ? 1 : 0); toast(`Layer ${l} only · ${LN(l)}`); }
  else if ('all' in b.dataset) { L10.forEach(k => s.op[k] = 1); toast('All layers'); }
  else if ('none' in b.dataset) { L10.forEach(k => s.op[k] = 0); }
  else if (b.dataset.eye) { const l = +b.dataset.eye; s.op[l] = s.op[l] > 0 ? 0 : 1; }
  else if (b.dataset.step) { const cur = soloOf(s) || (b.dataset.step > 0 ? 0 : 11), l = ((cur - 1 + +b.dataset.step + 10) % 10) + 1; L10.forEach(k => s.op[k] = k === l ? 1 : 0); }
  else if (b.dataset.side) { s.side = b.dataset.side; }
  else if ('col' in b.dataset) { s.col = !s.col; }
  else if (b.dataset.set) { const v = b.dataset.set.split(',').map(Number); L10.forEach(k => s.op[k] = v.includes(k) ? 1 : 0); }
  else if ('dd' in b.dataset) { s.dd = !s.dd; }
  else if (b.dataset.cyc) { const l = +b.dataset.cyc; s.op[l] = s.op[l] >= 1 ? .5 : s.op[l] > 0 ? 0 : 1; }
  else if (b.dataset.run) { runCmd(s, b.dataset.run); }
  if (!('dd' in b.dataset)) s.dd = false;
  render(n);
});
document.addEventListener('input', e => {
  const r = e.target.closest('[data-op]'); if (!r) return; const stg = r.closest('.stg'), n = +stg.dataset.n, s = st(n), l = +r.dataset.op;
  s.op[l] = +r.value / 100; stg.querySelector(`.ly[data-l="${l}"]`).style.opacity = s.op[l] > 0 ? s.op[l] : .05;
  const em = r.parentElement.querySelector('em'); if (em) em.textContent = r.value + (r.closest('.b12') ? '' : '%');
  stg.querySelectorAll('.pn').forEach(c => c.classList.toggle('dim', !vis(s, PINS[+c.dataset.pv].layer)));
});
document.addEventListener('keydown', e => {
  if (e.target.matches('[data-cmd]') && e.key === 'Enter') { const stg = e.target.closest('.stg'), n = +stg.dataset.n, s = st(n); s.pv = soloOf(s) || 0; runCmd(s, e.target.value); render(n); stg.querySelector('[data-cmd]').focus(); return; }
  if (e.target.matches('input')) return; const stg = document.querySelector('.stg:hover'); if (!stg) return; const n = +stg.dataset.n, s = st(n); s.pv = soloOf(s) || 0;
  if (/^[0-9]$/.test(e.key)) { const l = e.key === '0' ? 10 : +e.key; L10.forEach(k => s.op[k] = k === l ? 1 : 0); render(n); }
  if (e.key.toLowerCase() === 'a') { L10.forEach(k => s.op[k] = 1); render(n); }
});
</script>
</body>
