<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installer Concepts</title>
<style>
:root{
  --ui:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;
  --disp:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1); --out:cubic-bezier(.16,1,.3,1); --io:cubic-bezier(.65,0,.2,1);
}
:root,[data-theme="dark"],.force-dark{
  --page:#06070a; --text:#f3f7ff; --text-2:#a8b7d4; --text-3:#6e7fa0; --hair:rgba(255,255,255,.09); --hair-2:rgba(255,255,255,.16);
  --win:linear-gradient(160deg,#111b2f,#0a1120); --panel:#141f36; --panel-2:#192743; --field:#0a1324; --btn:rgba(255,255,255,.06); --btn-h:rgba(255,255,255,.11);
  --accent:#16a69d; --accent-2:#2dd4bf; --accent-text:#5fe3d3; --focus:rgba(45,212,191,.26); --ok:#34d399; --warn:#ffcf5c; --danger:#ff8a94;
  --danger-bg:rgba(255,80,96,.12); --danger-line:rgba(255,120,130,.35);
  --grad:linear-gradient(110deg,#0a6f6a 0%,#0d847d 52%,#10968e 100%);
  --logo:url(assests/schemax-anim-dark/mark.png); color-scheme:dark;
}
[data-theme="light"]{
  --page:#e7eaf0; --text:#0e2140; --text-2:#46557a; --text-3:#7a87a5; --hair:rgba(20,40,90,.1); --hair-2:rgba(20,40,90,.18);
  --win:linear-gradient(160deg,#fbfcfe,#f1f4f9); --panel:#ffffff; --panel-2:#f5f7fb; --field:#f1f4f8; --btn:rgba(14,33,64,.05); --btn-h:rgba(14,33,64,.09);
  --accent:#0f8f88; --accent-2:#12a39b; --accent-text:#0b7570; --focus:rgba(18,163,155,.2); --ok:#0f8a5f; --warn:#a86a00; --danger:#c4283a;
  --danger-bg:rgba(220,40,60,.08); --danger-line:rgba(220,40,60,.28);
  --grad:linear-gradient(110deg,#0a6f6a 0%,#0c7f79 52%,#0f938c 100%);
  --logo:url(assests/schemax-anim/mark.png); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:400 14px/20px var(--ui);-webkit-font-smoothing:antialiased;transition:background .3s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- page chrome ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 28px;background:color-mix(in srgb,var(--page) 85%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
.top h1{margin:0;font:600 18px var(--disp)}
.top p{margin:2px 0 0;color:var(--text-3);font-size:12.5px}
.sp{flex:1}
.seg{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 24px 70px;display:flex;flex-direction:column;gap:24px}
.opt{border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--panel) 45%,transparent);box-shadow:inset 0 0 0 1px var(--hair)}
.meta{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:13px 15px}
.num{flex:none;font:700 11.5px var(--ui);color:var(--accent-text);background:color-mix(in srgb,var(--accent-2) 12%,transparent);border-radius:6px;padding:3px 7px}
.meta .txt{flex:1;min-width:280px}
.meta b{display:block;font:600 14.5px var(--ui)}
.meta .txt span{font-size:12.5px;line-height:17px;color:var(--text-3)}
.stage{display:grid;place-items:center;padding:22px 12px 28px;background:radial-gradient(ellipse at 50% 0%,rgba(18,163,155,.09),transparent 70%)}

/* =================================================================
   SHARED installer content (every design styles on top of this)
   ================================================================= */
.iw{position:relative;width:780px;max-width:100%;height:540px;border-radius:12px;overflow:hidden;color:var(--text);background:var(--win);
  box-shadow:0 40px 80px -36px rgba(0,0,0,.75),inset 0 0 0 1px var(--hair);display:flex;flex-direction:column;isolation:isolate}
.iw svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding-left:12px;font:500 12px var(--ui);color:var(--text-2);position:relative;z-index:3}
.tb .tile{width:18px;height:18px;border-radius:5px;background:#fff url(assests/schemax-anim/mark.png) center/13px no-repeat;flex:none}
.tb b{color:var(--text);font-weight:600}.tb i{font-style:normal;color:var(--text-3)}
.tb .grow{flex:1}
.tb .cap{width:44px;height:36px;border:0;background:transparent;color:var(--text-2);display:grid;place-items:center}
.tb .cap svg{width:10px;height:10px;stroke-width:1.2}
.tb .cap.x:hover{background:#c42b1c;color:#fff}
.logo{background:var(--logo) center/contain no-repeat}
.pages{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.pg{display:none;flex:1;min-height:0;flex-direction:column}
.pg.on{display:flex;animation:pgIn .45s var(--out) both}
.pg.on.back{animation-name:pgBack}
@keyframes pgIn{from{opacity:0;transform:translateX(18px)}}
@keyframes pgBack{from{opacity:0;transform:translateX(-18px)}}
.kicker{font:700 10.5px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);margin-bottom:6px}
.pg h1{margin:0;font:650 22px/28px var(--disp);letter-spacing:-.015em}
.lead{margin:6px 0 0;color:var(--text-2);font-size:13px;line-height:19px;white-space:pre-line}
.pub{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--text-3)}
.pub svg{width:14px;height:14px;color:var(--accent-text)}
.pglogo{display:none}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.feat{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:11px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.feat i{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;color:var(--accent-text);background:color-mix(in srgb,var(--accent-2) 12%,transparent)}
.feat i svg{width:16px;height:16px}
.feat b{display:block;font:600 12.5px var(--ui)}.feat span{font-size:11px;color:var(--text-3)}
.lic{flex:1;min-height:0;overflow:auto;margin-top:12px;padding:12px 14px;border-radius:10px;white-space:pre-line;font-size:12px;line-height:18px;color:var(--text-2);background:var(--field);box-shadow:inset 0 0 0 1px var(--hair-2)}
.radios{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.radio{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;transition:background .15s}
.radio:hover{background:var(--btn)}
.radio .dot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--hair-2);display:grid;place-items:center}
.radio.sel .dot{box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.radio.sel .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent-2)}
.radio.big{padding:11px 12px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.radio.big.sel{box-shadow:inset 0 0 0 1.5px var(--accent-2);background:color-mix(in srgb,var(--accent-2) 8%,var(--btn))}
.radio .ico,.toggle .ico,.row .ico{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;color:var(--accent-text);background:color-mix(in srgb,var(--accent-2) 12%,transparent)}
.radio .ico svg,.toggle .ico svg,.row .ico svg{width:16px;height:16px}
.radio .t,.toggle .t{font-weight:600}.radio .d,.toggle .d{font-size:11.5px;color:var(--text-3)}
.ico.dz{color:var(--danger)!important;background:var(--danger-bg)!important}
.checks{display:flex;flex-direction:column;gap:5px;margin-top:12px;overflow:auto;min-height:0}
.row{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:10px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair);opacity:.45;transition:opacity .2s}
.row.live{opacity:1}
.row .ico{width:28px;height:28px}
.row .n{font:600 12.5px var(--ui)}.row .v{font-size:11.5px;color:var(--text-3)}
.row>div:nth-child(2){flex:1;min-width:0}
.row .tag{font:700 9.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;color:var(--text-3);background:var(--btn);opacity:0}
.row.ok .tag,.row.warn .tag,.row.bad .tag{opacity:1}
.row.ok .tag{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.row.warn .tag{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.row.bad .tag{color:var(--danger);background:var(--danger-bg)}
.st{width:20px;height:20px;display:grid;place-items:center;flex:none}
.st svg{width:14px;height:14px;stroke-width:2.6}
.row.ok .st{color:var(--ok)}.row.warn .st{color:var(--warn)}.row.bad .st{color:var(--danger)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--hair-2);border-top-color:var(--accent-2);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.callout{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-top:12px;font-size:12.5px;line-height:17px;color:var(--text-2);background:color-mix(in srgb,var(--accent-2) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent-2) 28%,transparent)}
.callout svg{width:16px;height:16px;flex:none;color:var(--accent-text);margin-top:1px}
.callout.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 34%,transparent)}.callout.warn svg{color:var(--warn)}
.callout.err{background:var(--danger-bg);box-shadow:inset 0 0 0 1px var(--danger-line)}.callout.err svg{color:var(--danger)}
.callout a{color:var(--accent-text);font-weight:600}
.lbl{margin-top:16px;font:600 12px var(--ui)}
.pathrow{display:flex;gap:8px;margin-top:6px}
.ctl{flex:1;display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:10px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair-2)}
.ctl svg{width:16px;height:16px;color:var(--text-3)}
.ctl input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 12.5px var(--mono)}
.space{margin-top:14px}
.space .bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--hair)}
.space .bar i:first-child{width:39%;background:color-mix(in srgb,var(--text) 22%,transparent)}
.space .bar i:last-child{width:2%;background:var(--accent-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--text-3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.legend b{color:var(--text-2)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.toggle{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;cursor:pointer;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.toggle>span:nth-child(2){flex:1;font-size:13px;line-height:17px}
.sw{position:relative;width:38px;height:22px;border-radius:99px;flex:none;background:var(--hair-2);transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s var(--ease)}
.toggle.on .sw{background:var(--grad)}.toggle.on .sw::after{left:19px}
.sum{margin:14px 0 0;padding:4px 14px;border-radius:12px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.sum>div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.sum>div:last-child{border:0}
.sum dt{width:120px;flex:none;color:var(--text-3)}.sum dd{margin:0;flex:1}
.mono{font-family:var(--mono);font-size:12px}
.prog{margin-top:16px}
.prog .ptop{display:flex;align-items:flex-end;justify-content:space-between}
.prog .pct{font:700 34px/1 var(--disp)}.prog .pct small{font-size:15px;color:var(--text-3);margin-left:2px}
.prog .eta{font-size:12px;color:var(--text-3)}
.prog .track{height:8px;border-radius:5px;margin-top:10px;background:var(--hair-2);overflow:hidden}
.prog .track i{display:block;height:100%;width:0;background:var(--grad);border-radius:5px}
.prog .file{margin-top:7px;font:500 11px var(--mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .ring{display:none}
.tasks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.tasks li{display:flex;align-items:center;gap:10px;padding:5px 2px;font-size:12.5px;color:var(--text-3)}
.tasks li .st .spin,.tasks li .st svg{display:none}
.tasks li.run{color:var(--text)}.tasks li.run .st .spin{display:inline-block}
.tasks li.done{color:var(--text-2)}.tasks li.done .st svg{display:block;color:var(--ok)}
.tasks li::before{content:"";display:none}
.tasks li:not(.run):not(.done) .st::before{content:"";width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--hair-2)}
.tasks em{margin-left:auto;font-style:normal;font-size:11px;color:var(--ok)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0 0}
.badge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ok);box-shadow:0 0 0 8px color-mix(in srgb,var(--ok) 16%,transparent);animation:pop .55s var(--spring) both}
.badge svg{width:28px;height:28px;stroke-width:2.6}
.badge.bye{background:var(--accent)}.badge.err{background:#d23a4a;box-shadow:0 0 0 8px var(--danger-bg)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.hero h1{margin-top:16px}
.vers{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:4px 10px;border-radius:99px;font-size:11.5px;color:var(--text-2);background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.chip b{color:var(--text)}.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);box-shadow:none}
.chip.new{color:var(--accent-text);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent-2) 55%,transparent)}
.vers .arrow{color:var(--text-3)}
.news{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.news h3{margin:0 0 8px;font:600 13px var(--ui)}
.news ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-2)}
.news b{color:var(--text)}
/* footer controls */
.btn{height:38px;border:0;border-radius:10px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 13px var(--ui);background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair-2);white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.primary{color:#fff;background:var(--grad);box-shadow:0 12px 24px -12px rgba(13,132,125,.9),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.danger{color:#fff;background:linear-gradient(110deg,#a8231a,#c42b1c)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn .spin{display:none;border-color:rgba(255,255,255,.35);border-top-color:#fff}
.btn.busy .spin{display:inline-block}
.hint{font-size:12px;color:var(--text-3)}.hint.ok{color:var(--ok)}.hint.bad{color:var(--danger)}
/* cancel confirm + confetti */
.layer{position:absolute;inset:36px 0 0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,#000 45%,transparent);opacity:0;pointer-events:none;transition:opacity .2s}
.layer.on{opacity:1;pointer-events:auto}
.ncard{width:360px;padding:20px;border-radius:14px;background:var(--panel);box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 0 0 1px var(--hair-2);transform:scale(.94);transition:transform .3s var(--spring)}
.layer.on .ncard{transform:none}
.ncard small{font:700 10px var(--ui);letter-spacing:.14em;color:var(--accent-text)}
.ncard h2{margin:4px 0 6px;font:650 18px var(--disp)}
.ncard p{margin:0;font-size:12.5px;color:var(--text-2)}
.ncard .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.confetti{position:absolute;left:50%;top:44%;width:0;height:0;z-index:25;pointer-events:none}
.confetti i{position:absolute;display:block}
.flows{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--btn);box-shadow:inset 0 0 0 1px var(--hair)}
.flows button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:11.5px;color:var(--text-2)}
.flows button[aria-pressed="true"]{background:var(--grad);color:#fff}

/* =================================================================
   D1 · ONE-CLICK RING — centered, minimal, progress is a ring around the logo
   ================================================================= */
.d1 .pages{width:100%;max-width:560px;margin:0 auto;padding:8px 24px 0}
.d1 .pg[data-page="welcome"]{align-items:center;text-align:center}
.d1 .pg[data-page="welcome"] .pglogo{display:block;width:96px;height:96px;margin:14px auto 14px}
.d1 .pg[data-page="welcome"] .pub{justify-content:center}
.d1 .pg h1{font-size:23px}
.d1 .prog{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:10px}
.d1 .prog .ring{display:grid;place-items:center;position:relative;width:150px;height:150px}
.d1 .prog .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.d1 .prog .ring .rb{fill:none;stroke:var(--hair-2);stroke-width:6}
.d1 .prog .ring .rf{fill:none;stroke:var(--accent-2);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px var(--accent-2))}
.d1 .prog .ring .rl{width:70px;height:70px;background:var(--logo) center/contain no-repeat}
.d1 .prog .track{display:none}
.d1 .prog .ptop{flex-direction:column;align-items:center;gap:4px;margin-top:10px}
.d1 .prog .pct{font-size:26px}
.d1 .tasks{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin-top:10px}
.d1 .tasks li{padding:2px}
.d1 .tasks em{display:none}
.d1 .foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 24px 16px}
.d1 .foot .row-b{display:flex;gap:8px;justify-content:center}
.d1 .foot .btn.primary{min-width:190px;height:42px}
.d1 .dots{display:flex;gap:5px}
.d1 .dots i{width:6px;height:6px;border-radius:50%;background:var(--hair-2);transition:all .3s}
.d1 .dots i.on{width:20px;border-radius:4px;background:var(--accent-2)}
.d1 .dots i.done{background:color-mix(in srgb,var(--accent-2) 55%,transparent)}

/* =================================================================
   D2 · FLUENT HEADER — Windows 11 command-bar style, progress line under the title bar
   ================================================================= */
.d2{background:var(--panel-2)}
.d2 .tb{background:var(--panel-2)}
.d2 .fline{flex:none;height:3px;background:var(--hair)}
.d2 .fline i{display:block;height:100%;width:0;background:var(--grad);transition:width .5s var(--ease)}
.d2 .head{flex:none;display:flex;align-items:center;gap:14px;padding:16px 26px 14px;border-bottom:1px solid var(--hair)}
.d2 .head .lg{width:40px;height:40px;border-radius:10px;background:#fff url(assests/schemax-anim/mark.png) center/30px no-repeat;box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.d2 .head b{display:block;font:650 17px var(--disp)}
.d2 .head small{font-size:12px;color:var(--text-3)}
.d2 .head .cnt{margin-left:auto;font:600 11.5px var(--ui);color:var(--text-3)}
.d2 .pages{padding:16px 26px 0;background:var(--panel)}
.d2 .pg h1{font-size:19px}
.d2 .feat,.d2 .row,.d2 .toggle,.d2 .radio.big,.d2 .sum,.d2 .news{border-radius:6px}
.d2 .foot{flex:none;display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--panel-2);border-top:1px solid var(--hair)}
.d2 .foot .hint{margin-right:auto}
.d2 .btn{border-radius:6px;height:34px}

/* =================================================================
   D3 · CIRCUIT BOARD — always dark; chip column, LED progress, console log
   ================================================================= */
.d3{background:radial-gradient(circle at 18% 40%,rgba(45,212,191,.12),transparent 45%),#060d18}

  const FLOWS = {
    install: {title: 'Schemax Schematics setup', meta: '1.7.5 · 220 MB', steps: ['Welcome', 'License', 'System check', 'Location', 'Options', 'Ready', 'Install', 'Finish'], pages: ['welcome', 'license', 'system', 'destination', 'tasks', 'ready', 'installing', 'finished']},

  const RUN = {
    installing: {title: 'Installing Schemax Schematics', lead: 'Roughly a minute. You can keep using your PC.', time: 5200,

      files: ['Schemax.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'pdfium.dll', 'libEGL.dll', 'glew32.dll', 'glfw3.dll', 'symbols\\ieee.lib', 'config\\pcb_themes_builtin.json', 'MicrosoftEdgeWebView2Setup.exe', 'Schemax Schematics.lnk']},
    updating: {title: 'Updating Schemax Schematics', lead: 'Roughly a minute. You can keep using your PC.', time: 4200,

    uninstalling: {title: 'Removing Schemax Schematics', lead: 'Removing Schemax Schematics from your computer.', time: 3600,
      tasks: ['Stopping Schemax Schematics', 'Removing application files', 'Removing shortcuts', 'Removing user data'],
      files: ['Schemax.exe', 'Qt6Core.dll', 'pdfium.dll', 'Schemax Schematics.lnk', '%APPDATA%\\Schemax']},
  };
  const SYSTEM = [
    {n: 'Operating system', v: 'Windows 11 Pro · 64-bit', s: 'ok', tag: 'OK', icon: 'win'}, {n: 'Processor', v: 'Intel Core i7-10700 · 2.9 GHz', s: 'ok', tag: 'OK', icon: 'cpu'},
    {n: 'Memory', v: '16 GB', s: 'ok', tag: 'OK', icon: 'mem'}, {n: 'Disk space', v: '220 MB required · 312 GB free on C:', s: 'ok', tag: 'OK', icon: 'disk'},
    {n: 'Graphics · display', v: '1920 × 1080 · 60 Hz', s: 'ok', tag: 'OK', icon: 'gpu'}, {n: 'WebView2 Runtime', v: 'Missing — will install', s: 'warn', tag: 'Will install', icon: 'web'},
    {n: 'Visual C++ Runtime', v: 'Installed · 14.40', s: 'ok', tag: 'OK', icon: 'pkg'}, {n: 'Smart App Control', v: 'Off', s: 'ok', tag: 'OK', icon: 'shield'},
  ];

  /* =================================================================
     5 DESIGNS — chrome around the same PAGES
     ================================================================= */
  const FLOWBTNS = `<div class="flows" role="group" aria-label="Flow">${[['install', 'Install'], ['update', 'Update'], ['uninstall', 'Uninstall'], ['blocked', 'Blocked check'], ['error', 'Setup failed']].map(([k, t], i) => `<button data-flow="${k}" aria-pressed="${!i}">${t}</button>`).join('')}</div>`;
  const SLIDES = {
    install: [['BOARDVIEW', 'Every pin, exactly where it is.', 'Pin-accurate board layouts with net highlighting for thousands of devices.', '<rect x="10" y="20" width="100" height="80" rx="8"/><path d="M10 50h36v50M76 20v30h34"/><circle cx="60" cy="72" r="6"/>'],
      ['SCHEMATICS', '2.3 million+ files, one search away.', 'Search by model, part number or net name and jump straight to the page.', '<circle cx="52" cy="52" r="34"/><path d="m78 78 30 30M34 52h36M52 34v36"/>'],
      ['REPAIR TOOLS', 'Find the fault faster.', 'Power rails, nets and known faults side by side with the board.', '<path d="M6 64h28l10-30 18 60 14-38h38"/>'],
      ['HWID RESET', 'Move PCs without the hassle.', 'Release your licence to a new computer — up to 3 times a month.', '<rect x="6" y="36" width="42" height="32" rx="4"/><rect x="72" y="36" width="42" height="32" rx="4"/><path d="M52 52h16m-5-5 5 5-5 5"/>']],
    update: [['WHAT\'S NEW · 1.7.5', 'Faster boardview.', 'Large boards open and pan more smoothly.', '<path d="M10 90 40 60l20 16 50-50"/><path d="M84 26h26v26"/>'],
      ['WHAT\'S NEW · 1.7.5', 'A new sign-in screen.', 'A cleaner, quicker way in — with the new logo animation.', '<rect x="22" y="16" width="76" height="88" rx="10"/><path d="M40 52h40M40 66h40M40 84h40"/>'],
      ['WHAT\'S NEW · 1.7.5', 'Fixes.', 'PDF viewer stability and connection-check improvements.', '<path d="M30 60 50 80l40-44"/>']],
    uninstall: [['COMING BACK?', 'Your account stays active.', 'Your plan and account are kept. Reinstall any time from schemaxsolutions.com and sign in.', '<circle cx="60" cy="44" r="20"/><path d="M24 104c4-22 18-34 36-34s32 12 36 34"/>'],
      ['YOUR FILES', 'Your projects are safe.', 'Uninstalling never deletes your project files.', '<path d="M30 14h40l20 20v72H30z"/><path d="M70 14v20h20"/>']],
    error: [['NEED HELP?', 'Send us the log.', 'Close Schemax, restart your PC and run setup again. Still failing? Send the log to support.', '<path d="M30 14h40l20 20v72H30z"/><path d="M44 60h32M44 76h32"/>']],
  };
  const DESIGNS = [
    {key: 'd1', name: 'One-click ring', desc: 'Centered and minimal like modern app installers. The welcome shows your big logo; while installing, a teal ring fills around the logo. Progress is just small dots — no step list.',
      html: `${TB}<div class="pages">${PAGES}</div><div class="foot"><div class="row-b">${FOOT.replace('<span class="hint" data-r="hint"></span>', '')}</div><span class="hint" data-r="hint"></span><div class="dots" data-r="dots"></div></div>${LAYER}`},
    {key: 'd2', name: 'Fluent header', desc: 'Windows 11 native: a thin progress line under the title bar, a header with the logo and "Step 3 of 8", content on a clean surface and a command bar at the bottom.',
      html: `${TB}<div class="fline"><i data-r="fline"></i></div><div class="head"><span class="lg"></span><div><b data-r="htitle">Schemax Schematics</b><small data-r="meta">1.7.5 · 220 MB</small></div><span class="cnt" data-r="cnt"></span></div><div class="pages">${PAGES}</div><div class="foot">${FOOT}</div>${LAYER}`},
    {key: 'd3', name: 'Circuit board', desc: 'For technicians, always dark: a chip column with the logo, LEDs for progress and traces that light up; LED-segment progress bar and a console-style task log.',
      html: `${TB}<div class="body3"><div class="chipcol"><svg class="traces" viewBox="0 0 200 440" preserveAspectRatio="none"><path d="M0 60h50l20 20h30v20" data-tr="0"/><path d="M200 70h-50l-20 20h-30v10" data-tr="2"/><path d="M0 210h60l20-30h20" data-tr="4"/><path d="M200 220h-60l-20-30h-20" data-tr="6"/><path d="M100 160v60l-40 40v180" data-tr="7"/></svg>
        <div class="chip"><span></span></div><b data-r="htitle">Schemax Schematics</b><small data-r="meta">1.7.5 · 220 MB</small><div class="leds" data-r="leds"></div><div class="foot3">© 2026 Schemax Team</div></div>
        <div class="main3"><div class="pages">${PAGES}</div><div class="foot">${FOOT}</div></div></div>${LAYER}`, dark: true},
    {key: 'd4', name: 'Feature theater', desc: 'Content on the left; the right panel is a showcase that changes with the flow — features while installing, what\'s new for updates, "coming back?" for uninstall, help when setup fails.',
      html: `${TB}<div class="body4"><div class="main4"><div class="pages">${PAGES}</div><div class="foot">${FOOT}</div></div><div class="theater" data-r="theater"></div></div>${LAYER}`},
    {key: 'd5', name: 'Card deck', desc: 'Matches the new login: every step is a floating card, and going forward swings the card away and opens the next one as a circle from the button you pressed.',
      html: `${TB}<div class="deckwrap"><div class="dhead"><span class="lg"></span><b data-r="htitle">Schemax Schematics</b><span class="cnt" data-r="cnt"></span></div><div class="card" data-r="card"><div class="pages">${PAGES}</div><div class="foot">${FOOT}</div></div></div>${LAYER}`},
  ];

  document.getElementById('wrap').innerHTML = DESIGNS.map((d, i) => `<article class="opt"><div class="meta"><span class="num">${String(i + 1).padStart(2, '0')}</span><div class="txt"><b>${d.name}</b><span>${d.desc}</span></div>${FLOWBTNS}</div>
    <div class="stage"><div class="iw ${d.key}${d.dark ? ' force-dark' : ''}">${d.html}</div></div></article>`).join('');

  /* =================================================================
     ENGINE — same behaviour as installer.html, one instance per design
     ================================================================= */
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.opt').forEach((opt, di) => {
    const d = DESIGNS[di], w = opt.querySelector('.iw');
    const $ = s => w.querySelector(s), $$ = s => [...w.querySelectorAll(s)], R = n => $(`[data-r="${n}"]`);
    let flowKey = 'install', flow = FLOWS.install, idx = 0, page = 'welcome', blocked = false, licOk = false, purge = false, action = 'update';
    let runTimer = 0, checkTimer = 0, slideTimer = 0, slideI = 0;

    /* ---- design hooks ---- */
    const onStep = cfg => {
      const total = flow.steps.length, s = cfg.step;
      if (R('dots')) R('dots').innerHTML = flow.steps.map((_, k) => `<i class="${k < s ? 'done' : k === s ? 'on' : ''}"></i>`).join('');
      if (R('fline')) R('fline').style.width = s < 0 ? '100%' : ((s + 1) / total * 100) + '%';
      if (R('cnt')) R('cnt').textContent = s < 0 ? 'Problem' : `Step ${s + 1} of ${total}`;
      if (R('leds')) R('leds').innerHTML = flow.steps.map((_, k) => `<i class="${k < s ? 'done' : k === s ? 'on' : ''}"></i>`).join('');
      $$('[data-tr]').forEach(t => t.classList.toggle('on', s >= +t.dataset.tr * total / 8));
    };
    const theater = () => {
      const th = R('theater'); if (!th) return;
      const set = SLIDES[page === 'failed' ? 'error' : (FLOWS.update.pages.includes(page) ? 'update' : FLOWS.uninstall.pages.includes(page) ? 'uninstall' : 'install')];
      if (th.dataset.set !== set[0][1]) {
        th.dataset.set = set[0][1]; slideI = 0;
        th.innerHTML = `<div class="bigpct" data-r="bigpct"></div><div class="sdots">${set.map(() => '<i></i>').join('')}</div>` + set.map(([k, b, s, a]) => `<div class="slide"><svg class="art" viewBox="0 0 120 120">${a}</svg><small>${k}</small><b>${b}</b><span>${s}</span></div>`).join('');
        clearInterval(slideTimer);
        const go = () => { const sl = [...th.querySelectorAll('.slide')], dt = [...th.querySelectorAll('.sdots i')]; sl.forEach((x, j) => x.classList.toggle('on', j === slideI)); dt.forEach((x, j) => x.classList.toggle('on', j === slideI)); slideI = (slideI + 1) % sl.length; };
        go(); slideTimer = setInterval(go, 3200);
      }
    };
    // D5 card swap: swing out, then open the next card as a circle from the pressed button
    let lastBtn = null;
    w.addEventListener('pointerdown', e => { lastBtn = e.target.closest('button'); }, true);
    const swap = (apply, dir) => {
      const card = R('card');
      if (!card || reduce) return apply();
      const out = card.animate([{transform: 'none', opacity: 1}, {transform: `translateX(${dir < 0 ? 40 : -60}%) rotate(${dir < 0 ? 6 : -7}deg)`, opacity: 0}], {duration: 380, easing: 'cubic-bezier(.65,0,.2,1)'});
      out.finished.then(() => {
        apply();
        const r = card.getBoundingClientRect(), k = r.width / card.offsetWidth || 1;
        let x = card.offsetWidth - 70, y = card.offsetHeight - 30;
        if (lastBtn && card.contains(lastBtn)) { const b = lastBtn.getBoundingClientRect(); x = (b.left + b.width / 2 - r.left) / k; y = (b.top + b.height / 2 - r.top) / k; }
        const RR = Math.hypot(Math.max(x, card.offsetWidth - x), Math.max(y, card.offsetHeight - y)) + 20;
        card.animate([{clipPath: `circle(0px at ${x}px ${y}px)`, transform: 'scale(.97)'}, {clipPath: `circle(${RR}px at ${x}px ${y}px)`, transform: 'none'}], {duration: 520, easing: 'cubic-bezier(.65,0,.2,1)'});
      }, () => apply());
    };

    function setFlow(key) {
      clearTimeout(runTimer); clearTimeout(checkTimer);
      flowKey = key; blocked = key === 'blocked';
      opt.querySelectorAll('[data-flow]').forEach(b => b.setAttribute('aria-pressed', b.dataset.flow === key));
      if (key === 'error') { flow = FLOWS.install; go('failed', 1, true); return; }
      flow = FLOWS[blocked ? 'install' : key];
      R('title').textContent = flow.title; if (R('meta')) R('meta').textContent = flow.meta;
      setLic(blocked);
      go(blocked ? 'system' : flow.pages[0], 1, true);
    }
    function go(id, dir = 1, instant = false) {
      const apply = () => render(id, dir, instant);
      if (d.key === 'd5' && !instant) swap(apply, dir); else apply();
    }
    function render(id, dir, instant) {
      clearTimeout(runTimer); clearTimeout(checkTimer);
      page = id; const cfg = P[id]; idx = flow.pages.indexOf(id);
      $$('.pg').forEach(p => p.classList.remove('on', 'back'));
      const el = $(`.pg[data-page="${id}"]`); if (dir < 0) el.classList.add('back'); void el.offsetWidth; el.classList.add('on');
      R('crumb').textContent = cfg.crumb;
      const hint = R('hint'); hint.textContent = cfg.hint; hint.className = 'hint ' + (cfg.hintCls || '');
      R('back').hidden = !cfg.back;
      R('alt').hidden = !cfg.alt; R('alt').textContent = cfg.alt || '';
      const nb = R('next'); nb.className = 'btn ' + (cfg.danger ? 'danger' : 'primary') + (cfg.busy ? ' busy' : '');
      R('nextText').textContent = cfg.next; nb.querySelector('.arr').style.display = (cfg.next === 'Next' || cfg.next === 'Update Now') ? '' : 'none';
      nb.disabled = !!cfg.busy || (id === 'license' && !licOk);
      w.classList.toggle('busy', !!cfg.busy); w.classList.remove('live');
      onStep(cfg); theater();
      if (id === 'system') runSystem();
      if (RUN[id]) runProgress(id);
      if (id === 'ready') { R('sumPath').textContent = R('path').value; R('sumTasks').textContent = $$('.pg[data-page="tasks"] .toggle.on .t').map(t => t.textContent).join(' · ') || '(none)'; }
      if (id === 'finished') R('finLead').textContent = `Installed to ${R('path').value}.\n` + ($('[data-task="desktop"]').classList.contains('on') ? 'A shortcut is on your desktop.' : 'No desktop shortcut was created.');
      if (id === 'uninstalled') R('byeLead').textContent = purge ? 'Schemax Schematics and your preferences have been removed.' : 'Schemax Schematics has been removed from your computer.';
      if (['finished', 'updated', 'uninstalled'].includes(id)) w.classList.add('live');
      if (cfg.confetti && !instant) confetti();
    }
    function setLic(yes) {
      licOk = yes;
      $$('[data-lic]').forEach(r => r.classList.toggle('sel', (r.dataset.lic === 'yes') === yes));
      if (page === 'license') R('next').disabled = !yes;
    }
    function runSystem() {
      const rows = SYSTEM.map(r => ({...r}));
      if (blocked) Object.assign(rows[7], {v: 'On — blocks the app', s: 'bad', tag: 'Blocks the app'});
      R('checks').innerHTML = rows.map((r, i) => `<div class="row" data-i="${i}"><span class="ico">${SV(ICON[r.icon])}</span><div><div class="n">${r.n}</div><div class="v">Checking…</div></div><span class="tag">${r.tag}</span><span class="st"><span class="spin"></span></span></div>`).join('');
      R('sac').hidden = true; R('next').disabled = true;
      R('hint').textContent = 'Checking requirements…'; R('hint').className = 'hint';
      let i = 0;
      const step = () => {
        const row = $(`.row[data-i="${i}"]`); if (!row) return; row.classList.add('live');
        checkTimer = setTimeout(() => {
          const r = rows[i]; row.classList.add(r.s); row.querySelector('.v').textContent = r.v;
          row.querySelector('.st').innerHTML = r.s === 'ok' ? TICK : r.s === 'warn' ? BANG : CROSS;
          i++;
          if (i < rows.length) step();
          else { const bad = rows.some(x => x.s === 'bad'); R('sac').hidden = !bad; R('next').disabled = bad;
            R('hint').textContent = bad ? 'Turn off Smart App Control, then run setup again' : `${rows.length} requirements checked`; R('hint').className = 'hint ' + (bad ? 'bad' : 'ok'); }
        }, 240 + Math.random() * 200);
      };
      step();
    }
    function runProgress(id) {
      const Rn = RUN[id];
      R('runTitle').textContent = Rn.title; R('runLead').textContent = Rn.lead;
      R('runTasks').innerHTML = Rn.tasks.map(t => `<li><span class="st"><span class="spin"></span>${TICK}</span>${t}<em></em></li>`).join('');
      const base = id === 'installing' ? R('path').value.replace(/\\?$/, '\\') : PATH + '\\';
      const t0 = performance.now();
      const tick = () => {
        const p = Math.min(1, (performance.now() - t0) / Rn.time), e = 1 - Math.pow(1 - p, 1.6), pct = Math.round(e * 100);
        R('pct').innerHTML = pct + '<small>%</small>'; R('bar').style.width = pct + '%'; R('ring').style.strokeDashoffset = 1 - e;
        const bp = R('bigpct'); if (bp) bp.textContent = pct + '%';
        const ti = Math.min(Rn.tasks.length - 1, Math.floor(e * Rn.tasks.length));
        [...R('runTasks').children].forEach((li, k) => { li.classList.toggle('done', k < ti || p >= 1); li.classList.toggle('run', k === ti && p < 1); li.querySelector('em').textContent = (k < ti || p >= 1) ? 'done' : ''; });
        const f = Rn.files[Math.min(Rn.files.length - 1, Math.floor(e * Rn.files.length))];
        R('file').textContent = (f.includes(':') || f.startsWith('%') ? '' : base) + f;
        R('eta').textContent = p < 1 ? `About ${Math.max(1, Math.ceil((1 - p) * Rn.time / 1000 * 10))} seconds left` : 'Done';
        $$('[data-tr]').forEach((t, k, all) => { if (pct >= (k + 1) / all.length * 100 - 5) t.classList.add('on'); });
        if (p < 1) runTimer = setTimeout(tick, 60); else runTimer = setTimeout(() => go(flow.pages[idx + 1]), 600);
      };
      tick();
    }
    function confetti() {
      if (reduce) return;
      const box = R('confetti'); box.innerHTML = '';
      const cols = ['#12a39b', '#2dd4bf', '#5fe3d3', '#0e2140', '#ffffff', '#f2b33d', '#7fb1ff'];
      for (let i = 0; i < 80; i++) {
        const p = document.createElement('i'), wd = 6 + Math.random() * 6, h = Math.random() < .3 ? wd : 4 + Math.random() * 10;
        Object.assign(p.style, {width: wd + 'px', height: h + 'px', background: cols[i % 7], borderRadius: Math.random() < .25 ? '50%' : '2px'});
        const a = Math.random() * Math.PI * 2, v = 140 + Math.random() * 240, dx = Math.cos(a) * v, dy = Math.sin(a) * v * .75 - 110, r = Math.random() * 1800 - 900;
        box.appendChild(p);
        p.animate([{transform: 'translate(-50%,-50%) scale(.4)', opacity: 1}, {transform: `translate(calc(-50% + ${dx * .7}px), calc(-50% + ${dy * .7}px)) rotate(${r * .5}deg)`, opacity: 1, offset: .35},
          {transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + 240}px)) rotate(${r}deg) scale(.9)`, opacity: 0}], {duration: 1500 + Math.random() * 700, delay: Math.random() * 120, easing: 'cubic-bezier(.15,.7,.35,1)', fill: 'forwards'});
      }
      setTimeout(() => { box.innerHTML = ''; }, 2600);
    }
    const restart = () => setFlow(flowKey);
    const openCancel = () => { if (page !== 'uninstalling') R('layer').classList.add('on'); };
    const closeCancel = () => R('layer').classList.remove('on');

    /* ---- wiring ---- */
    $$('[data-lic]').forEach(r => r.addEventListener('click', () => setLic(r.dataset.lic === 'yes')));
    $$('.toggle').forEach(t => t.addEventListener('click', () => { t.classList.toggle('on'); t.setAttribute('aria-checked', t.classList.contains('on')); if (t.dataset.task === 'purge') purge = t.classList.contains('on'); }));
    $$('[data-act]').forEach(r => r.addEventListener('click', () => { action = r.dataset.act; $$('[data-act]').forEach(x => x.classList.toggle('sel', x === r)); }));
    R('next').addEventListener('click', () => {
      if (R('next').disabled) return;
      if (page === 'choose') {
        if (action === 'uninstall') return go('confirmUninstall');
        flow = FLOWS[action === 'update' ? 'update' : 'install']; R('title').textContent = flow.title; if (R('meta')) R('meta').textContent = flow.meta;
        return go(flow.pages[0]);
      }
      if (['finished', 'updated', 'uninstalled', 'failed'].includes(page)) return restart();
      const n = flow.pages[idx + 1]; if (n) go(n, 1);
    });
    R('back').addEventListener('click', () => { const pv = flow.pages[idx - 1]; if (pv) go(pv, -1); });
    R('alt').addEventListener('click', () => {
      if (page === 'update') return restart();
      if (page === 'failed') { R('hint').textContent = 'Log path copied'; R('hint').className = 'hint ok'; return; }
      openCancel();
    });
    R('close').addEventListener('click', () => { if (['finished', 'updated', 'uninstalled', 'failed'].includes(page)) restart(); else openCancel(); });
    R('browse').addEventListener('click', () => { const v = prompt('Install location', R('path').value); if (v) R('path').value = v; });
    R('ncKeep').addEventListener('click', closeCancel);
    R('ncStop').addEventListener('click', () => { closeCancel(); restart(); });
    opt.querySelectorAll('[data-flow]').forEach(b => b.addEventListener('click', () => setFlow(b.dataset.flow)));
    w.__set = setFlow; w.__go = go;
    setFlow('install');
  });

  const setTheme = t => { document.documentElement.dataset.theme = t; document.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x.dataset.t === t)); try { localStorage.setItem('sx-inst-theme', t); } catch (e) {} };
  let t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; try { t = localStorage.getItem('sx-inst-theme') || t; } catch (e) {}
  setTheme(t); document.querySelectorAll('[data-t]').forEach(x => x.addEventListener('click', () => setTheme(x.dataset.t)));
})();
