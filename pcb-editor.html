<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCB Theme Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#e9edf3;--ptext:#0e2140;--pt2:#5a6a82;--phair:#dbe2ea;--checker:repeating-conic-gradient(#d4d9e1 0 25%,#fff 0 50%) 0 0/10px 10px;--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{font:13px/1.45 Inter,system-ui,sans-serif;background:var(--page);color:var(--ptext);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
input,select{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--page) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--phair)}
.top .in{max-width:1180px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:16px}.top p{font-size:12px;color:var(--pt2)}
.jump{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.jump a{display:grid;place-items:center;min-width:32px;height:30px;padding:0 8px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--phair);font:700 11.5px var(--mono);color:var(--pt2);text-decoration:none}
.jump a:hover{color:#0d847d;box-shadow:0 0 0 1.5px #0d847d}
main{max-width:1180px;margin:auto;padding:24px;display:grid;gap:24px}
.opt{background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(14,33,64,.06),0 24px 50px -28px rgba(14,33,64,.35);padding:16px;display:grid;gap:14px;scroll-margin-top:70px}
.meta{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;font:700 13px var(--mono);color:#0d847d;background:rgba(13,132,125,.1);border-radius:8px;padding:4px 8px}
.meta h3{font-size:15px}.meta p{font-size:12.5px;color:var(--pt2);max-width:800px}
.meta .tags{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:330px}
.meta .tags span{font-size:11px;font-weight:600;color:var(--pt2);background:#f1f4f8;padding:3px 8px;border-radius:99px;white-space:nowrap}
.stage{position:relative;display:grid;place-items:center;padding:36px 18px;border-radius:18px;overflow:hidden;background:#0b1220}
.stage .bg{position:absolute;inset:-6%;z-index:0;display:grid;place-items:center;pointer-events:none}
.stage .bg svg{width:100%;height:auto;min-height:100%}
.stage::after{content:"";position:absolute;inset:0;z-index:1;background:rgba(6,10,18,.55);pointer-events:none}
.stage .slot{position:relative;z-index:2;width:100%;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:999;background:#0e2140;color:#fff;font-weight:600;font-size:12.5px;padding:10px 16px;border-radius:12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6);display:flex;gap:8px;align-items:center;animation:tin .25s}
.toast svg.i{color:#34d399}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* ======================= shared pieces ======================= */
.dz{--r:16px;--line:#e6e8ee;--mut:#6b7280;--fg:#111827;--bg:#fff;--acc:#4f46e5;--inbg:#fff;--hov:rgba(0,0,0,.04);
  position:relative;width:min(920px,100%);height:650px;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;text-align:left;box-shadow:0 44px 90px -30px rgba(0,0,0,.8),0 0 0 1px var(--edge,rgba(255,255,255,.08))}
.dz.fresh{animation:dzin .35s cubic-bezier(.2,.8,.2,1)}
.bsvg .hl{animation:hlb .8s ease-in-out infinite alternate}@keyframes hlb{to{opacity:.3}}
.pv button b{text-transform:uppercase}
@keyframes dzin{from{opacity:0;transform:translateY(10px) scale(.985)}}
.mk{flex:none;width:28px;height:28px}
.scr{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sw{position:relative;flex:none;display:block;width:32px;height:32px;border-radius:50%;background:linear-gradient(var(--c),var(--c)),var(--checker);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.x{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut);transition:background .15s,color .15s}
.x:hover{background:var(--hov);color:var(--fg)}
.in{width:100%;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--inbg);padding:0 12px;color:var(--fg);outline:0;transition:border-color .15s,box-shadow .15s}
.in::placeholder{color:var(--mut);opacity:.8}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.in.err{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.err-t{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#ef4444;animation:fdin .2s}
.err-t svg.i{width:13px;height:13px}
@keyframes fdin{from{opacity:0}}
.tg{position:relative;flex:none;display:inline-block;width:38px;height:22px;border-radius:99px;background:var(--tgoff,#c7ccd6);transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(16px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 18px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.c{border:1px solid var(--line);color:var(--fg)}.btn.c:hover{background:var(--hov)}
.btn.s{background:var(--acc);color:var(--onacc,#fff)}.btn.s:hover{filter:brightness(1.08)}
.btn.s.ok{animation:okp .5s}@keyframes okp{40%{transform:scale(1.06)}}
.btn svg.i{width:15px;height:15px}
.hint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.hint i{flex:none;width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22)}
.lbl{font:700 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.pv{display:flex;height:38px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.pv button{position:relative;flex:1;display:grid;place-items:center;font:800 10px Inter;letter-spacing:.1em;color:var(--ink);background:linear-gradient(var(--c),var(--c)),var(--checker);transition:flex .25s}
.pv button:hover{flex:1.4}
.pv button+button{box-shadow:-1px 0 0 rgba(0,0,0,.14)}
.pv button b{position:absolute;inset:0;display:grid;place-items:center;font:700 10.5px var(--mono);letter-spacing:0;background:linear-gradient(var(--c),var(--c)),var(--checker);opacity:0;transition:opacity .15s}
.pv button:hover b{opacity:1}
.chgd{flex:none;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);opacity:0;transition:opacity .2s}
.chg>.chgd,.chg .chgd{opacity:1}
.rv{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut);opacity:0;transition:opacity .15s}
.chg .rv{opacity:.7}.rv:hover{opacity:1!important;background:var(--hov);color:var(--fg)}
.rv svg.i{width:14px;height:14px}
.dz code{font-family:var(--mono)}

/* ======================= advanced colour picker ======================= */
.pk{--pkbg:var(--bg);width:296px;padding:12px;border-radius:14px;font-family:Inter,sans-serif;color:var(--fg);background:var(--pkbg);user-select:none}
.pk.pop{position:fixed;z-index:500;border:1px solid var(--line);box-shadow:0 36px 70px -24px rgba(0,0,0,.65);animation:pkin .18s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pkin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.pk.emb{width:100%;padding:0;background:transparent;border-radius:0}
.pk-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pk-cmp{flex:none;width:46px;height:34px;border-radius:9px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:var(--checker);box-shadow:0 0 0 1px var(--line)}
.pk-cmp span{display:block}.pk-cmp span:first-child{cursor:pointer}
.pk-hd b{display:block;font-size:12.5px;font-weight:700;line-height:1.25}.pk-hd small{display:block;font:600 10.5px var(--mono);color:var(--mut)}
.pk-hd .x{margin-left:auto;width:28px;height:28px}
.pk-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;margin-bottom:10px;border-radius:10px;background:var(--hov)}
.pk-tabs button{height:27px;border-radius:8px;text-align:center;font-size:11.5px;font-weight:600;color:var(--mut)}
.pk-tabs button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.pk-sv{position:relative;height:150px;border-radius:10px;cursor:crosshair;touch-action:none;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(calc(var(--h)*1deg),100%,50%));box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pk-sv i{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.45);pointer-events:none}
.pk-row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;margin-top:11px}
.pk-eye{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mut);border:1px solid var(--line)}
.pk-eye:hover{color:var(--acc);border-color:var(--acc)}
.pk-bars{display:grid;gap:10px}
.pk-bar{position:relative;height:12px;border-radius:99px;cursor:pointer;touch-action:none}
.pk-hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.pk-al{background:linear-gradient(90deg,transparent,var(--o)),var(--checker);background-size:auto,8px 8px}
.pk-bar i{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.pk-sl{display:grid;gap:7px}
.pk-sl div{display:grid;grid-template-columns:14px 1fr 44px;gap:9px;align-items:center;font:700 10.5px var(--mono);color:var(--mut)}
.pk-sl input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:99px;outline:0;background-size:auto,8px 8px}
.pk-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 5px rgba(0,0,0,.35);cursor:grab}
.pk-sl .sep{display:block;height:1px;background:var(--line);margin:2px 0}
.pk-n{width:100%;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--inbg);text-align:center;font:600 11px var(--mono);color:var(--fg);outline:0}
.pk-pal .eyb{display:flex;justify-content:space-between;font:800 9.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:9px 0 6px}
.pk-pal .eyb:first-child{margin-top:0}
.pk-pal .g{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pk-pal .g button{position:relative;aspect-ratio:1;border-radius:7px;background:var(--checker);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.15);transition:transform .12s}
.pk-pal .g button i{position:absolute;inset:0}
.pk-pal .g button:hover{transform:scale(1.15);z-index:1}
.pk-pal .hm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pk-pal .hm button{display:grid;gap:3px;justify-items:center;font-size:9.5px;font-weight:600;color:var(--mut)}
.pk-pal .hm span{display:flex;width:100%;height:22px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.pk-pal .hm span i{flex:1}
.pk-fmt{display:grid;grid-template-columns:72px 1fr;gap:6px;margin-top:11px;align-items:end}
.pk-fmt select{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--inbg);color:var(--fg);font:700 10.5px var(--mono);padding:0 6px;outline:0}
.pk-fmt .vals{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.pk-fmt .vals label{display:grid;gap:2px;font:700 8.5px var(--mono);color:var(--mut);text-align:center}
.pk-fmt .vals input{width:100%;min-width:0;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--inbg);text-align:center;font:600 11px var(--mono);color:var(--fg);outline:0}
.pk-fmt .vals input:focus{border-color:var(--acc)}
.pk-ct{display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 9px;border-radius:9px;background:var(--hov);font-size:11px;color:var(--mut)}
.pk-ct .ab{width:26px;height:18px;border-radius:5px;display:grid;place-items:center;font:800 10px Inter;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.pk-ct b{margin-left:auto;font:700 10px var(--mono);padding:2px 7px;border-radius:99px}
.pk-ct b.g{background:rgba(34,197,94,.16);color:#16a34a}.pk-ct b.m{background:rgba(234,179,8,.18);color:#b45309}.pk-ct b.l{background:rgba(239,68,68,.15);color:#dc2626}
.pk-ft{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px}
.pk-ft .rvt{margin-right:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--mut)}
.pk-ft .rvt:hover{color:var(--fg)}.pk-ft .rvt svg.i{width:13px;height:13px}
.pk-ft .btn{height:32px;padding:0 14px;font-size:12.5px}
.pk.emb .pk-ft .btn{display:none}
.pk.emb .pk-hd{display:none}
/* horizontal embedded picker (design 06) */
.pk.hz{display:grid;grid-template-columns:230px 1fr 250px;gap:0 18px;align-items:start}
.pk.hz .pk-main{grid-column:1;grid-row:1/6}
.pk.hz .pk-hd,.pk.hz .pk-tabs{grid-column:2}
.pk.hz .pk-fmt,.pk.hz .pk-ct,.pk.hz .pk-ft{grid-column:3}
.pk.hz .pk-fmt{margin-top:0;grid-row:1}.pk.hz .pk-ct{grid-row:2}.pk.hz .pk-ft{grid-row:3;margin-top:8px}
.pk.hz .pk-sv{height:118px}

/* ======================= 01 SIDEBAR STUDIO ======================= */
.d1{--bg:#fff;--fg:#101828;--mut:#667085;--line:#eaecf0;--acc:#4f46e5;--side:#f7f8fb;flex-direction:row}
.d1-side{flex:none;width:236px;display:flex;flex-direction:column;gap:4px;padding:16px 14px;background:var(--side);border-right:1px solid var(--line)}
.d1-brand{display:flex;align-items:center;gap:10px;padding:2px 4px 16px}
.d1-brand b{display:block;font-size:14px}.d1-brand small{font-size:11.5px;color:var(--mut)}
.d1-side .lbl{padding:8px 6px 6px}
.d1-nav{display:grid;grid-template-columns:30px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px;border-radius:12px;transition:background .15s}
.d1-nav:hover{background:var(--hov)}
.d1-nav .ti{grid-row:span 2;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--t);background:color-mix(in srgb,var(--t) 14%,transparent)}
.d1-nav b{font-size:13px;font-weight:600}
.d1-nav em{font:700 10.5px var(--mono);font-style:normal;color:var(--mut)}
.d1-nav .dots{grid-column:2/4;display:flex;margin-top:4px}
.d1-nav .dots .sw{width:12px;height:12px;margin-right:-3px;box-shadow:0 0 0 1.5px var(--side)}
.d1-nav.on{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.1),0 0 0 1px var(--line)}
.d1-nav.on .ti{background:var(--t);color:#fff}
.d1-sp{flex:1}
.d1-ov{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line);text-align:left}
.d1-ov b{display:block;font-size:12.5px}.d1-ov small{font-size:11px;color:var(--mut);line-height:1.35}
.d1-main{flex:1;min-width:0;display:flex;flex-direction:column}
.d1-top{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 12px 24px}
.d1-top h2{font-size:20px;letter-spacing:-.02em}.d1-top p{font-size:12.5px;color:var(--mut)}
.d1-top .x{margin-left:auto}
.d1-pv{display:flex;align-items:center;gap:14px;padding:0 24px 14px;border-bottom:1px solid var(--line)}
.d1-pv .pv{flex:1}
.d1-list{flex:1;padding:8px 14px}
.d1-row{display:flex;align-items:center;gap:14px;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
.d1-row:hover{background:var(--hov)}
.d1-row .sw{width:36px;height:36px}
.d1-row .tx{flex:1;min-width:0}.d1-row .tx b{display:block;font-size:13.5px;font-weight:600}.d1-row .tx small{font-size:11.5px;color:var(--mut)}
.d1-row code{font-size:11.5px;color:var(--mut);background:#f2f4f7;padding:3px 8px;border-radius:6px}
.d1-row .al{width:44px;text-align:right;font:600 11.5px var(--mono);color:var(--mut)}
.d1-ft{display:flex;align-items:center;gap:10px;padding:12px 18px 14px 24px;border-top:1px solid var(--line)}
.d1-ft .hint{margin-right:auto}

/* ======================= 02 HONEYCOMB ======================= */
.d2{--bg:#16171b;--fg:#ecebe6;--mut:#8d8f99;--line:#2a2c33;--acc:#e8d9a6;--onacc:#1b1a16;--inbg:#0f1013;--hov:rgba(255,255,255,.05);--tgoff:#3a3c44;--outl:#cfc6a3;--edge:#2a2c33;--checker:repeating-conic-gradient(#3a3c44 0 25%,#24262c 0 50%) 0 0/10px 10px}
.d2-hd{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line)}
.d2-hd h2{font-size:15px;white-space:nowrap;letter-spacing:.01em}
.d2-hd .in{max-width:240px;height:34px;margin-left:10px}
.d2-ovb{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.d2-hd .x{margin-left:auto}
.d2-err{padding:6px 18px 0 300px}
.d2-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px}
.d2-cv{position:relative;display:flex;flex-direction:column;min-width:0;background:radial-gradient(70% 60% at 50% 45%,#1f2026,#121316)}
.d2-tabs{display:flex;justify-content:center;gap:16px;padding:16px 10px 0}
.d2-ht{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mut)}
.d2-ht .hxo{width:44px;height:50px}
.d2-ht .hxi{display:grid;place-items:center;background:#1c1d22;color:var(--t)}
.d2-ht em{font:700 10px var(--mono);font-style:normal;opacity:.75}
.d2-ht.on{color:var(--fg)}.d2-ht.on .hxo{background:var(--t);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--t) 60%,transparent))}.d2-ht.on .hxi{background:var(--t);color:#16171b}
.hxo,.hxi{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hxo{position:relative;display:block;background:var(--outl);transition:background .2s,filter .2s}
.hxi{position:absolute;inset:1.5px;display:block}
.d2-comb{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 4px}
.d2-crow{display:flex;gap:8px}
.d2-crow+.d2-crow{margin-top:-24px}
.d2-hc{position:relative;width:110px;height:126px;display:block;transition:transform .2s}
.d2-comb.anim .d2-hc{animation:hxin .4s both}
@keyframes hxin{from{opacity:0;transform:scale(.8)}}
.d2-hc .hxo{position:absolute;inset:0;background:rgba(207,198,163,.55)}
.d2-hc .hxi{background:linear-gradient(var(--c),var(--c)),var(--checker)}
.d2-hc .lb{position:absolute;inset:30px 14px;display:grid;place-items:center;align-content:center;gap:3px;text-align:center;color:var(--ink);pointer-events:none}
.d2-hc .lb b{font-size:10.5px;font-weight:700;line-height:1.2}
.d2-hc .lb code{font-size:9.5px;opacity:.8}
.d2-hc:hover{transform:scale(1.05);z-index:2}
.d2-hc:hover .hxo{background:var(--outl)}

const EMB = new Set(['d2', 'd3', 'd6', 'd9']);
const S = {};
DS.forEach(x => S[x.id] = {name: '', orig: '', ov: true, c: {...GRAPHITE}, base: {...GRAPHITE}, sec: 'board', sel: x.id === 'd4' ? null : 'boardFill', err: '', q: '', step: 0, chOnly: false, fsec: 'all', hl: '', anim: true});
const nchg = d => Object.keys(S[d].c).filter(k => S[d].c[k] !== S[d].base[k]).length;
const CHG = (d, k) => S[d].c[k] !== S[d].base[k] ? ' chg' : '';
const SW = (d, k, cls = '') => `<span class="sw ${cls}" data-c="${k}" style="--c:${css(S[d].c[k])};--ink:${ink(S[d].c[k])}"></span>`;
const NAMEIN = (d, cls = 'in') => `<input class="${cls}${S[d].err ? ' err' : ''}" data-name value="${esc(S[d].name)}" placeholder="${S[d].err && !S[d].name.trim() ? 'Please enter a theme name' : 'e.g. Dark Pro'}" spellcheck="false" title="Theme name">`;
const ERRT = d => S[d].err ? `<div class="err-t">${I('warn')}${esc(S[d].err)}</div>` : '';
const TGL = d => `<span class="tg${S[d].ov ? ' on' : ''}"></span>`;
const PV = d => `<div class="pv">${PVSEG.map(([l, k]) => `<button data-pick="${k}" data-c="${k}" style="--c:${css(S[d].c[k])};--ink:${ink(S[d].c[k])}" title="${LABEL[k][0]} · click to change">${l.toUpperCase()}<b data-hx="${k}">${S[d].c[k]}</b></button>`).join('')}</div>`;
const HINT = d => { const n = nchg(d); return `<span class="hint" data-counttxt><i></i>${n ? `${n} change${n > 1 ? 's' : ''} · preview live on the board` : 'Changes preview live on the board'}</span>`; };
const BTNS = `<button class="btn c" data-a="cancel">Cancel</button><button class="btn s" data-a="save">Save theme</button>`;
const XB = `<button class="x" data-a="cancel" title="Close">${I('x')}</button>`;
const ERRROW = (d, cls) => S[d].err ? `<div class="${cls}">${ERRT(d)}</div>` : '';
function boardBG(d, hl = '') { const c = S[d].c, C = {}; Object.keys(c).forEach(k => C[k] = css(c[k])); return boardSVG(C, Array.from({length: 16}, (_, i) => css(c['L' + (i + 1)])), S[d].ov, hl); }
const boardHl = d => d === 'd4' ? (S[d].sel || '') : d === 'd5' ? S[d].hl : '';

/* ======================= 01 SIDEBAR STUDIO ======================= */
function L1(d) {
  const s = S[d], sec = SECOF(s.sec);
  return `<div class="dz d1" data-d="${d}">
  <aside class="d1-side"><div class="d1-brand">${MARK}<div><b>PCB Theme Editor</b><small>${s.orig ? esc(s.orig) : 'New theme'}</small></div></div>
    <div class="lbl">Sections</div>
    ${SEC.map(x => `<button class="d1-nav${x.k === s.sec ? ' on' : ''}" style="--t:${x.a}" data-a="sec" data-v="${x.k}"><span class="ti">${I(x.ic)}</span><b>${x.l}</b><em>${x.f.length}</em><span class="dots">${x.f.slice(0, 8).map(([k]) => SW(d, k)).join('')}</span></button>`).join('')}
    <div class="d1-sp"></div>
    <div class="lbl">Theme name</div>${NAMEIN(d)}${ERRT(d)}
    <button class="d1-ov" data-a="ov">${TGL(d)}<span><b>Override pin colours</b><small>Use theme colours instead of net-based colouring</small></span></button>
  </aside>
  <section class="d1-main">
    <header class="d1-top"><div><h2>${sec.k === 'copper' ? 'Copper layers (1–16)' : sec.l}</h2><p>${SECDESC[sec.k]}</p></div>${XB}</header>
    <div class="d1-pv"><span class="lbl">Preview</span>${PV(d)}</div>
    <div class="d1-list scr" data-scroll="l">${sec.f.map(([k, l]) => `<div class="d1-row${CHG(d, k)}" data-chg="${k}" data-pick="${k}" title="Change ${l} colour">${SW(d, k)}<div class="tx"><b>${l}</b><small>${desc(k)}</small></div><span class="chgd"></span><code data-hx="${k}">${s.c[k]}</code><span class="al" data-al="${k}">${alp(s.c[k])}%</span><button class="rv" data-a="rev" data-v="${k}" title="Undo this colour">${I('undo')}</button></div>`).join('')}</div>
    <footer class="d1-ft">${HINT(d)}${BTNS}</footer>
  </section></div>`;
}

/* ======================= 02 HONEYCOMB ======================= */
function honeyRows(n, A) { const rows = []; let i = 0, big = true; while (i < n) { const m = Math.min(big ? A : A - 1, n - i); rows.push(m); i += m; big = !big; } return rows; }
function L2(d) {
  const s = S[d], sec = SECOF(s.sec), cu = sec.k === 'copper', ROWS = {5: [3, 2], 7: [4, 3], 8: [3, 2, 3], 16: [5, 6, 5]};
  let idx = 0;
  const comb = (ROWS[sec.f.length] || honeyRows(sec.f.length, 4)).map(m => `<div class="d2-crow">${sec.f.slice(idx, idx += m).map(([k, l], j) => `<button class="d2-hc${s.sel === k ? ' on' : ''}${CHG(d, k)}" data-chg="${k}" data-a="sel" data-v="${k}" style="animation-delay:${(idx - m + j) * 35}ms" title="${l}"><span class="hxo"><span class="hxi" data-c="${k}" style="--c:${css(s.c[k])}"></span></span><span class="lb" data-c="${k}" style="--ink:${ink(s.c[k])}"><b>${cu ? k : short(l)}</b><code data-hx="${k}">${s.c[k]}</code></span><span class="chgd"></span></button>`).join('')}</div>`).join('');
  return `<div class="dz d2" data-d="${d}">
  <header class="d2-hd">${MARK}<h2>PCB Theme Editor</h2>${NAMEIN(d)}<button class="d2-ovb" data-a="ov">${TGL(d)}Override pin colours</button>${XB}</header>
  ${ERRROW(d, 'd2-err')}
  <div class="d2-body"><div class="d2-cv">
    <div class="d2-tabs">${SEC.map(x => `<button class="d2-ht${x.k === s.sec ? ' on' : ''}" style="--t:${x.a}" data-a="sec" data-v="${x.k}"><span class="hxo"><span class="hxi">${I(x.ic)}</span></span>${x.l}<em>${x.f.length}</em></button>`).join('')}</div>
    <div class="d2-comb${cu ? ' cu' : ''}${s.anim ? ' anim' : ''}">${comb}</div>
    <div class="d2-pv"><span class="lbl">Preview</span>${PVSEG.map(([l, k]) => `<button data-pick="${k}" title="${LABEL[k][0]}"><span class="hxo"><span class="hxi" data-c="${k}" style="--c:${css(s.c[k])}"></span></span>${l.toUpperCase()}</button>`).join('')}</div>
  </div>
  <aside class="d2-side"><div class="d2-sel"><span class="hxo"><span class="hxi" data-c="${s.sel}" style="--c:${css(s.c[s.sel])}"></span></span><div><small>${LABEL[s.sel][1].l}</small><b>${LABEL[s.sel][0]}</b><p>${desc(s.sel)}</p></div></div><div data-pkhost></div></aside></div>
  <footer class="d2-ft">${HINT(d)}${BTNS}</footer></div>`;
}

/* ======================= 03 INSPECTOR ======================= */
function L3(d) {
  const s = S[d], sec = SECOF(s.sec);
  return `<div class="dz d3" data-d="${d}">
  <header class="d3-hd">${MARK}<span class="t">PCB Theme Editor</span><span class="sep"></span>${NAMEIN(d)}<button class="d3-chip" data-a="ov">${TGL(d)}Override pin colours</button>${PV(d)}${XB}</header>
  ${ERRROW(d, 'd3-err')}
  <div class="d3-m"><nav class="d3-sec"><div class="lbl">Sections</div>${SEC.map(x => `<button class="${x.k === s.sec ? 'on' : ''}" style="--t:${x.a}" data-a="sec" data-v="${x.k}">${I(x.ic)}${x.l}<em>${x.f.length}</em></button>`).join('')}</nav>
    <div class="d3-fl scr" data-scroll="f"><div class="lbl">${sec.k === 'copper' ? 'Copper layers (1–16)' : sec.l}</div>${sec.f.map(([k, l]) => `<button class="d3-it${s.sel === k ? ' on' : ''}${CHG(d, k)}" data-chg="${k}" data-a="sel" data-v="${k}">${SW(d, k)}<span>${l}</span><span class="chgd"></span><code data-hx="${k}">${s.c[k]}</code></button>`).join('')}</div>
    <div class="d3-ins scr"><div class="d3-ih">${SW(d, s.sel)}<div><b>${LABEL[s.sel][0]}</b><small>${LABEL[s.sel][1].l} · ${desc(s.sel)}</small></div></div><div data-pkhost></div></div></div>
  <footer class="d3-ft">${HINT(d)}${BTNS}</footer></div>`;
}

/* ======================= 04 CLICK THE BOARD ======================= */
function L4(d) {
  const s = S[d];
  const cur = s.sel ? `<div class="d4-cur">${SW(d, s.sel)}<div><b>${LABEL[s.sel][0]}</b><code data-hx="${s.sel}">${s.c[s.sel]}</code></div><button class="btn s" data-pick="${s.sel}">Change…</button></div>` : `<div class="d4-cur none">${I('cursor')}Nothing selected — click a part of the board.</div>`;
  return `<div class="dz d4" data-d="${d}">
  <header class="d4-hd">${MARK}<h2>PCB Theme Editor</h2><span class="tip">${I('cursor')}Click any part of the board to recolour it</span>${XB}</header>
  <div class="d4-m"><div class="d4-cv"><div class="d4-bd" data-board>${boardBG(d, s.sel || '')}</div><div class="d4-tt" hidden></div><div class="d4-pv"><span class="lbl">Preview</span>${PV(d)}</div></div>
  <aside class="d4-side"><div><div class="lbl" style="margin-bottom:6px">Theme name</div>${NAMEIN(d)}${ERRT(d)}</div>
    <button class="d4-ovb" data-a="ov">${TGL(d)}<span>Override pin colours<small>Theme colours instead of net-based</small></span></button>
    ${cur}
    <div class="d4-all scr" data-scroll="a">${SEC.map(x => `<div class="d4-g" style="--t:${x.a}"><div class="lbl">${x.l} <em>${x.f.length}</em></div><div class="gr">${x.f.map(([k, l]) => `<button class="${s.sel === k ? 'on' : ''}${CHG(d, k)}" data-chg="${k}" data-a="sel" data-v="${k}" title="${l}">${SW(d, k)}<span class="chgd"></span></button>`).join('')}</div></div>`).join('')}</div>
  </aside></div>
  <footer class="d4-ft">${HINT(d)}${BTNS}</footer></div>`;
}

/* ======================= 05 GUIDED STEPS ======================= */
const STEPS = ['Name', 'Board', 'Components', 'Pins & nets', 'Copper', 'Review'];
function L5(d) {
  const s = S[d], st = s.step; let body;
  if (st === 0) body = `<div class="d5-intro"><div><h3>Name your theme</h3><p>It starts as a copy of Graphite — change only what you need.</p>${NAMEIN(d)}<div style="margin-top:6px">${ERRT(d)}</div><button class="d5-ovc" data-a="ov">${TGL(d)}<span><b>Override pin colours</b><small>Use theme colours for pins instead of net-based colouring</small></span></button><div class="lbl" style="margin-bottom:6px">Preview</div>${PV(d)}</div><div class="d5-art" data-board>${boardBG(d)}</div></div>`;
  else if (st < 5) { const sec = SEC[st - 1]; body = `<div class="d5-two"><div class="d5-thumb" data-board>${boardBG(d, s.hl)}</div><div class="d5-rows scr" data-scroll="r">${sec.f.map(([k, l]) => `<div class="d5-rw${CHG(d, k)}" data-chg="${k}" data-pick="${k}" data-hlk="${k}">${SW(d, k)}<div><b>${l}</b><code data-hx="${k}">${s.c[k]}</code></div><span class="chgd"></span></div>`).join('')}</div></div>`; }
  else { const ch = nchg(d); body = `<div class="d5-rev scr"><div class="d5-sum">${I('check')}<div>Ready to save <b>${esc(s.name || '(no name yet)')}</b> with <b>${ch}</b> changed colour${ch === 1 ? '' : 's'} · pins use ${s.ov ? 'theme' : 'net-based'} colours. Click any colour to change it.</div></div>${SEC.map(x => `<div class="d5-rs"><b>${x.l}</b><div class="strip">${x.f.map(([k, l]) => `<button data-pick="${k}" data-c="${k}" style="--c:${css(s.c[k])}" title="${l} · ${s.c[k]}"></button>`).join('')}</div></div>`).join('')}</div>`; }
  return `<div class="dz d5" data-d="${d}">
  <header class="d5-hd">${MARK}<div><h2>PCB Theme Editor</h2><small>Step ${st + 1} of 6 · ${STEPS[st]}</small></div>${XB}</header>
  <ol class="d5-steps">${STEPS.map((x, i) => `<li class="${i < st ? 'done' : ''}${i === st ? ' on' : ''}" data-a="step" data-v="${i}"><span class="n">${i < st ? I('check') : i + 1}</span>${x}</li>`).join('')}</ol>
  <div class="d5-body${s.anim ? ' anim' : ''}">${body}</div>
  <footer class="d5-ft"><button class="btn c" data-a="cancel">Cancel</button>${HINT(d)}<span class="sp"></span>${st > 0 ? `<button class="btn c" data-a="step" data-v="${st - 1}">Back</button>` : ''}${st < 5 ? `<button class="btn s" data-a="step" data-v="${st + 1}">Next: ${STEPS[st + 1]}</button>` : `<button class="btn s" data-a="save">${I('check')}Save theme</button>`}</footer></div>`;
}

/* ======================= 06 PALETTE BANDS ======================= */
function L6(d) {
  const s = S[d], sec = SECOF(s.sec), cu = sec.k === 'copper';
  return `<div class="dz d6" data-d="${d}">
  <header class="d6-hd">${MARK}<h2>PCB Theme Editor</h2>${NAMEIN(d)}<button class="d6-ovb" data-a="ov">${TGL(d)}Override pins</button><div class="d6-seg">${SEC.map(x => `<button class="${x.k === s.sec ? 'on' : ''}" style="--t:${x.a}" data-a="sec" data-v="${x.k}"><i></i>${x.l.split(' ')[0]}</button>`).join('')}</div>${XB}</header>
  ${ERRROW(d, 'd6-err')}
  <div class="d6-bands${cu ? ' cu' : ''}">${sec.f.map(([k, l]) => `<button class="d6-b${s.sel === k ? ' on' : ''}${CHG(d, k)}" data-chg="${k}" data-a="sel" data-v="${k}" data-c="${k}" style="--c:${css(s.c[k])};--ink:${ink(s.c[k])}" title="${l}"><span class="chgd"></span><b data-hx="${k}">${s.c[k]}</b><span>${cu ? k : l}</span></button>`).join('')}</div>
  <div class="d6-dock" data-pkhost data-hz="1"></div>
  <footer class="d6-ft">${PV(d)}${HINT(d)}${BTNS}</footer></div>`;
}

/* ======================= 07 DATA TABLE ======================= */
function L7(d) {
  const s = S[d], q = s.q.trim().toLowerCase(), n = nchg(d);
  const rows = SEC.flatMap(x => x.f.map(([k, l]) => ({k, l, x}))).filter(r => (s.fsec === 'all' || r.x.k === s.fsec) && (!q || (r.l + ' ' + r.k + ' ' + s.c[r.k]).toLowerCase().includes(q)) && (!s.chOnly || s.c[r.k] !== s.base[r.k]));
  return `<div class="dz d7" data-d="${d}">
  <header class="d7-hd">${MARK}<h2>PCB Theme Editor</h2>${NAMEIN(d)}<button class="d7-ovb" data-a="ov">${TGL(d)}Override pin colours</button>${XB}</header>
  ${ERRROW(d, 'd7-err')}
  <div class="d7-tb"><label class="d7-q">${I('search')}<input data-q placeholder="Filter by name or hex…" value="${esc(s.q)}"></label><div class="d7-chips"><button class="${s.fsec === 'all' ? 'on' : ''}" data-a="fsec" data-v="all">All<em>36</em></button>${SEC.map(x => `<button class="${s.fsec === x.k ? 'on' : ''}" data-a="fsec" data-v="${x.k}">${x.l.split(' ')[0]}<em>${x.f.length}</em></button>`).join('')}</div><button class="d7-co" data-a="chonly"><span class="tg${s.chOnly ? ' on' : ''}"></span>Changed only · ${n}</button></div>
  <div class="d7-tw scr" data-scroll="t">${rows.length ? `<table><thead><tr><th></th><th>Colour</th><th>Section</th><th>ARGB</th><th>Opacity</th><th></th><th></th></tr></thead><tbody>${rows.map(r => `<tr class="${CHG(d, r.k).trim()}" data-chg="${r.k}"><td style="width:44px"><button data-pick="${r.k}" title="Open the colour picker">${SW(d, r.k)}</button></td><td><b>${r.l}</b></td><td><span class="tag" style="--t:${r.x.a}"><i></i>${r.x.l}</span></td><td><input class="d7-hx" data-hxin="${r.k}" data-hx="${r.k}" value="${s.c[r.k]}" maxlength="9" spellcheck="false"></td><td><input class="d7-al" data-alin="${r.k}" data-al="${r.k}" value="${alp(s.c[r.k])}"> %</td><td class="st"><span class="chgd"></span></td><td style="width:38px"><button class="rv" data-a="rev" data-v="${r.k}" title="Undo">${I('undo')}</button></td></tr>`).join('')}</tbody></table>` : `<div class="d7-empty">No colour matches “${esc(s.q)}”.</div>`}</div>
  <footer class="d7-ft">${PV(d)}${HINT(d)}${BTNS}</footer></div>`;
}

/* ======================= 08 ONE SCROLL + LAYER STACK ======================= */
function MAP8(d) { const s = S[d]; return `<nav class="d8-map">${SEC.map(x => { const n = x.f.filter(([k]) => s.c[k] !== s.base[k]).length; return `<button class="${s.sec === x.k ? 'on' : ''}" style="--t:${x.a}" data-a="jump" data-v="${x.k}"><b>${x.l}<em>${n}/${x.f.length}</em></b><span class="bar"><i style="width:${Math.max(4, n / x.f.length * 100)}%"></i></span></button>`; }).join('')}<p class="hint" style="margin-top:10px;padding:0 6px;line-height:1.4">Bars fill as you change colours in each section.</p></nav>`; }
function STACK(d) { const s = S[d], L = Array.from({length: 16}, (_, i) => 'L' + (i + 1));
  return `<div class="d8-stk"><div class="d8-iso">${L.map((k, i) => `<button class="d8-pl" data-pick="${k}" data-c="${k}" style="--c:${css(s.c[k])};top:${6 + i * 17}px;z-index:${16 - i}" title="Layer ${i + 1} · ${s.c[k]}"></button>`).join('')}</div><div class="d8-ll">${L.map((k, i) => `<button class="${CHG(d, k).trim()}" data-chg="${k}" data-pick="${k}">${SW(d, k)}L${i + 1}<span class="chgd"></span></button>`).join('')}</div></div>`; }
function L8(d) {
  const s = S[d];
  return `<div class="dz d8" data-d="${d}">
  <header class="d8-hd">${MARK}<h2>PCB Theme Editor</h2>${NAMEIN(d)}<button class="d8-ovb" data-a="ov">${TGL(d)}Override pin colours</button>${XB}</header>
  ${ERRROW(d, 'd8-err')}
  <div class="d8-pvr"><span class="lbl">Preview</span>${PV(d)}</div>
  <div class="d8-m">${MAP8(d)}
    <div class="d8-sc scr" data-scroll="s" id="${d}-sc">${SEC.map(x => `<section id="${d}-${x.k}" data-sk="${x.k}" style="--t:${x.a}"><div class="d8-sh"><span class="ti">${I(x.ic)}</span>${x.k === 'copper' ? 'Copper layers (1–16) · layer stack' : x.l}<em>${x.f.length}</em></div>${x.k === 'copper' ? STACK(d) : `<div class="d8-chips">${x.f.map(([k, l]) => `<button class="d8-chip${CHG(d, k)}" data-chg="${k}" data-pick="${k}" title="${l}">${SW(d, k)}<span><b>${l}</b><code data-hx="${k}">${s.c[k]}</code></span><span class="chgd"></span></button>`).join('')}</div>`}</section>`).join('')}</div></div>
  <footer class="d8-ft">${HINT(d)}${BTNS}</footer></div>`;
}

/* ======================= 09 SEARCH FIRST ======================= */
function L9(d) {
  const s = S[d], q = s.q.trim(), ql = q.toLowerCase();
  const items = SEC.flatMap(x => x.f.map(([k, l]) => ({k, l, x}))).filter(r => !ql || (r.l + ' ' + r.x.l + ' ' + r.k + ' ' + s.c[r.k] + (r.k[0] === 'L' ? ' layer ' + r.k.slice(1) : '')).toLowerCase().includes(ql));
  s.vis = items.map(r => r.k); if (items.length && !s.vis.includes(s.sel)) s.sel = items[0].k;
  const groups = SEC.map(x => [x, items.filter(r => r.x === x)]).filter(g => g[1].length);
  return `<div class="dz d9" data-d="${d}">
  <div class="d9-top">${MARK}<label class="d9-q">${I('search')}<input data-q placeholder="Search a colour — pin, silk, layer 3, #ff…" value="${esc(q)}"></label><kbd>Esc</kbd>${XB}</div>
  ${ERRROW(d, 'd9-err')}
  <div class="d9-m"><div class="d9-list scr" data-scroll="l">${groups.length ? groups.map(([x, rs]) => `<div class="d9-gh" style="--t:${x.a}"><i></i>${x.l}</div>${rs.map(r => `<button class="d9-it${s.sel === r.k ? ' on' : ''}${CHG(d, r.k)}" data-chg="${r.k}" data-a="sel" data-v="${r.k}">${SW(d, r.k)}<b>${markQ(r.l, q)}</b><span class="chgd"></span><code data-hx="${r.k}">${s.c[r.k]}</code></button>`).join('')}`).join('') : `<div class="d9-none">Nothing matches “${esc(q)}”.</div>`}</div>
    <div class="d9-r"><div class="d9-sel">${SW(d, s.sel)}<div><b>${LABEL[s.sel][0]}</b><small>${LABEL[s.sel][1].l} · ${desc(s.sel)}</small></div></div><div data-pkhost></div></div></div>
  <div class="d9-bar">${NAMEIN(d)}<button class="d9-ovb" data-a="ov">${TGL(d)}Override pins</button><span class="keys"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Ctrl</kbd><kbd>S</kbd> save</span><button class="btn c" data-a="cancel">Cancel</button><button class="btn s" data-a="save">Save theme</button></div></div>`;
}

/* ======================= 10 COLOUR WHEEL ======================= */
const WR = 160;
function dotPos(c) { const [h, sa] = hsvOf(c), a = h * Math.PI / 180; return [WR + WR * sa * Math.sin(a), WR - WR * sa * Math.cos(a)]; }
const vTrack = c => { const [h, sa] = hsvOf(c), [r, g, b] = hsv2rgb(h, sa, 1); return `background:linear-gradient(90deg,#000,rgb(${r},${g},${b}))`; };
function L10(d) {

  if (t.dataset.sl) { fromField(P, t.dataset.sl, t.value); return; }
  if (t.dataset.sn) { fromField(P, t.dataset.sn, t.value); return; }
  if (t.dataset.pkf && t.dataset.pkf !== 'argb' && t.dataset.pkf !== 'hex') fromField(P, t.dataset.pkf, t.value);
});
document.addEventListener('change', e => {
  const t = e.target, root = t.closest('.dz');
  if (root && t.dataset.hxin) { const d = root.dataset.d, k = t.dataset.hxin; let v = t.value.trim().toLowerCase(); if (!v.startsWith('#')) v = '#' + v; if (/^#[0-9a-f]{6}$/.test(v)) v = '#ff' + v.slice(1); if (/^#[0-9a-f]{8}$/.test(v)) { S[d].c[k] = v; paint(d, k); } else { t.value = S[d].c[k]; toast('Use #AARRGGBB, e.g. #ff272727'); } return; }
  const pkEl = t.closest('.pk'); if (!pkEl) return; const P = PKS[pkEl.dataset.d]; if (!P) return;
  if (t.matches('[data-pkfmt]')) { P.fmt = t.value; P.el.querySelector('.vals').innerHTML = fmtFields(P); return; }
  if (t.dataset.pkf === 'argb' || t.dataset.pkf === 'hex') { if (!fromField(P, t.dataset.pkf, t.value)) { toast(t.dataset.pkf === 'argb' ? 'Use #AARRGGBB, e.g. #FF272727' : 'Use #RRGGBB, e.g. #272727'); t.blur(); syncPick(P); } }
});
document.addEventListener('keydown', e => {
  const t = e.target, root = t.closest?.('.dz');
  if (e.key === 'Escape' && POP) { cancelPop(); return; }
  if (e.key === 'Enter' && t.matches?.('.pk input,[data-hxin]')) { t.dispatchEvent(new Event('change', {bubbles: true})); t.blur(); return; }
  if (root && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); act(root.dataset.d, 'save'); return; }
  if (root && e.key === 'Enter' && t.matches('[data-name]')) { const d = root.dataset.d; act(d, d === 'd5' && S[d].step < 5 ? 'step' : 'save', String(S[d].step + 1)); return; }
  if (root && root.dataset.d === 'd9' && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !t.closest('.pk')) {
    e.preventDefault(); const s = S.d9, vis = s.vis || [], i = vis.indexOf(s.sel), j = cl(i + (e.key === 'ArrowDown' ? 1 : -1), 0, vis.length - 1);
    if (vis[j] && vis[j] !== s.sel) { s.sel = vis[j]; draw('d9'); rootOf('d9').querySelector('.d9-it.on')?.scrollIntoView({block: 'nearest'}); }
  }
});
document.addEventListener('mouseover', e => {
  const h = e.target.closest?.('.d5 [data-hlk]'), k = h ? h.dataset.hlk : '';
  if (S.d5.step > 0 && S.d5.step < 5 && k !== S.d5.hl && (h || e.target.closest?.('.d5'))) { S.d5.hl = k; boardsIn('d5'); }
});
document.addEventListener('mousemove', e => {
  const tt = $('.d4-tt'); if (!tt) return;
  const p = e.target.closest?.('.d4-bd [data-pk]');
  $$('.d4-bd .hov').forEach(x => x.classList.remove('hov'));
  if (!p) { tt.hidden = true; return; }
  const k = p.dataset.pk.split(' ')[0], cv = tt.parentElement.getBoundingClientRect();
  $$(`.d4-bd [data-pk~="${k}"]`).forEach(x => x.classList.add('hov'));
  tt.hidden = false; tt.style.left = e.clientX - cv.left + 'px'; tt.style.top = e.clientY - cv.top + 'px';
  tt.innerHTML = `${SW('d4', k)}${LABEL[k][0]}<code>${S.d4.c[k]}</code>`;
});
document.addEventListener('scroll', e => {
  const t = e.target;
  if (t === document && POP && !DRAG) { commitPop(); return; }
  if (t.id === 'd8-sc') { const top = t.getBoundingClientRect().top; let cur = 'board'; t.querySelectorAll('section').forEach(sx => { if (sx.getBoundingClientRect().top - top < 80) cur = sx.dataset.sk; }); if (S.d8.sec !== cur) { S.d8.sec = cur; rootOf('d8').querySelectorAll('.d8-map button').forEach(b => b.classList.toggle('on', b.dataset.v === cur)); } }
}, true);
