<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer controls — 20 designs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--win:#fff;--panel:#f6f8fb;--panel-2:#eef2f7;--hair:#e1e7ef;--hair-2:#d3dbe6;--text:#0e2140;--text-2:#4a5b75;--text-3:#8592a6;--accent:#0d847d;--acc-t:#0d847d;--accent-soft:rgba(13,132,125,.12);--hover:rgba(14,33,64,.06);--glass:rgba(255,255,255,.9);--sh:0 1px 2px rgba(14,33,64,.06),0 12px 30px -18px rgba(14,33,64,.35);--pop:0 0 0 1px rgba(14,33,64,.08),0 2px 4px rgba(14,33,64,.05),0 18px 36px -16px rgba(14,33,64,.5);--mono:'JetBrains Mono',ui-monospace,monospace}
[data-theme=dark]{--bg:#0b1220;--card:#111a2b;--win:#16223a;--panel:#17233a;--panel-2:#1a2740;--hair:#26354f;--hair-2:#30425f;--text:#e6edf7;--text-2:#a7b4c8;--text-3:#6f7f99;--acc-t:#2dd4bf;--accent-soft:rgba(45,212,191,.14);--hover:rgba(255,255,255,.07);--glass:rgba(18,28,46,.9);--sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);--pop:0 0 0 1px rgba(255,255,255,.08),0 18px 36px -16px rgba(0,0,0,.85)}
*{box-sizing:border-box;margin:0}
body{font:13px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{cursor:text;outline:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font:600 10px var(--mono);padding:1px 5px;border-radius:5px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);color:var(--text-3)}

.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.top .in{max-width:1180px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:17px}.top p{color:var(--text-2);font-size:12.5px}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.mode{display:flex;padding:3px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair)}
.mode button{height:30px;padding:0 14px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--text-2)}
.mode button.on{background:var(--accent);color:#fff}
.tbtn{height:36px;padding:0 12px;border-radius:9px;background:var(--card);box-shadow:0 0 0 1px var(--hair);font-weight:600;font-size:12.5px}
.toc{max-width:1180px;margin:auto;padding:16px 24px 0;display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:11.5px;font-weight:600;color:var(--text-2);text-decoration:none;padding:4px 10px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--hair)}
.toc a:hover{color:var(--acc-t)}
main{max-width:1180px;margin:auto;padding:18px 24px 80px;display:grid;gap:22px}
.opt{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);display:grid;gap:12px;min-width:0;scroll-margin-top:80px}
.meta{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;font:700 13px var(--mono);color:var(--acc-t);background:var(--accent-soft);border-radius:8px;padding:4px 8px}
.meta h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta p{color:var(--text-2);font-size:12.5px;margin-top:2px;max-width:920px}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair)}

/* stage + canvas */
.stage{--lc:#cbd5e1;--lc2:#7b8aa3;--line:rgba(255,255,255,.35);position:relative;height:440px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0b2a1f,#05110c 75%);box-shadow:0 0 0 1px var(--hair);display:flex;flex-direction:column;user-select:none}
.stage.pdfm{--lc:var(--text-2);--lc2:var(--text-3);--line:rgba(14,33,64,.25);background:radial-gradient(ellipse at 50% 40%,#f3f6fa,#dfe5ee 80%)}
[data-theme=dark] .stage.pdfm{--lc:#cbd5e1;--line:rgba(255,255,255,.3);background:radial-gradient(ellipse at 50% 40%,#22304a,#141d2e 80%)}
.cvw{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden}
.cvi{position:absolute;inset:0;display:grid;place-items:center;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.cvi svg{width:60%;height:66%;filter:drop-shadow(0 18px 26px rgba(0,0,0,.35))}
.cv .tr,.cv .rt,.cv .dv,.cv .rf,.cv .ph,.cv .nh,.cv .hl{display:none}
.cv.L .tr,.cv.A .rt,.cv.D .dv,.cv.B .rf,.cv.P .ph,.cv.Q .nh,.cv.Q .hl{display:inline}
.cv.B .rf{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--pop)}
.tls{position:absolute;z-index:6;width:250px}
.sfx{display:flex;align-items:center;gap:7px;height:34px;padding:0 6px 0 11px;border-radius:12px;background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--pop);color:var(--text-3)}
.sfx:focus-within{box-shadow:0 0 0 2px var(--accent),var(--pop)}
.sfx input{flex:1;min-width:0;font-size:12px;color:var(--text)}
.sfx .hits{font:700 10.5px var(--mono);color:var(--acc-t);background:var(--accent-soft);padding:1px 6px;border-radius:6px;white-space:nowrap}
.sfx .mini{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}.sfx .mini svg.i{width:13px;height:13px}
.sfx .mini.on{background:var(--accent-soft);color:var(--acc-t)}.sfx .ab{font:700 11px var(--mono);text-decoration:underline}
.lbl{font-size:9.5px;font-weight:700;color:var(--lc);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.stage.pdfm .lbl{text-shadow:none}
.cap{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lc2)}
/* base round button used by many shapes */
.rb{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--win);box-shadow:var(--pop);transition:transform .15s,background .15s,color .15s}
.rb:hover{transform:scale(1.08);color:var(--text)}
.rb.on{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft),0 8px 18px -6px var(--accent)}
.zt{font:800 12px var(--mono);color:var(--text)}

/* 07 curved dock — hangs from the top */
.cd{position:absolute;z-index:6;top:0;left:50%;height:104px;transform:translateX(-50%)}
.cd svg.bg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.cd .it{position:absolute;transform:translate(-50%,-50%)}
.rb.sm{width:32px;height:32px}.rb.sm svg.i{width:16px;height:16px}
.rb.sm.zpill{width:auto;min-width:50px;padding:0 9px;border-radius:99px;font:800 10.5px var(--mono);color:var(--text)}
.cd .pgl{font:800 10px var(--mono);color:var(--text-2);background:var(--win);padding:3px 7px;border-radius:99px;box-shadow:var(--pop);white-space:nowrap}
/* 08 slanted strip — one slim slanted bar at the top */
.sk8{position:absolute;z-index:6;top:12px;left:50%;display:flex;align-items:center;height:44px;padding:0 4px;border-radius:9px;transform:translateX(-50%) skewX(-14deg);background:var(--win);box-shadow:var(--pop)}
.sk8 .ed{flex:none;width:9px;height:44px;margin:0 7px 0 -4px;border-radius:9px 0 0 9px;background:linear-gradient(180deg,#2dd4bf,#0d847d)}
.sk8 .ed.r{margin:0 -4px 0 7px;border-radius:0 9px 9px 0}
.sk{height:34px;min-width:34px;padding:0 5px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s,box-shadow .15s}
.sk>span{display:flex;align-items:center;gap:6px;transform:skewX(14deg);font-size:11px;font-weight:700;white-space:nowrap}
.sk svg.i{width:17px;height:17px}
.sk:hover{color:var(--text);background:var(--hover)}
.sk.on{background:var(--accent);color:#fff;box-shadow:0 6px 12px -6px var(--accent)}
.sk.zv8 span{font:800 11px var(--mono);color:var(--text);min-width:40px;justify-content:center}
.sdv{flex:none;width:1.5px;height:24px;margin:0 6px;border-radius:1px;background:var(--hair-2)}
/* 13 notched nav — top bar, zoom dial in the notch */
.nb{position:absolute;z-index:6;top:10px;left:50%;height:54px;border-radius:16px;display:flex;align-items:center;padding:0 8px;transform:translateX(-50%);-webkit-mask:radial-gradient(circle 40px at 50% calc(100% + 8px),transparent 97%,#000 100%);mask:radial-gradient(circle 40px at 50% calc(100% + 8px),transparent 97%,#000 100%)}
.nb .sd{display:flex;align-items:center;gap:1px}
.nb .gapn{flex:none;width:88px}
.il{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:46px;height:44px;padding:0 3px;border-radius:10px;font-size:9px;font-weight:600;color:var(--text-2);white-space:nowrap}
.il svg.i{width:16px;height:16px}
.il:hover{background:var(--hover);color:var(--text)}.il.on{color:var(--acc-t);background:var(--accent-soft)}
.dial{position:absolute;z-index:7;left:50%;top:32px;width:64px;height:64px;margin-left:-32px;border-radius:50%;display:grid;place-items:center;align-content:center;background:linear-gradient(145deg,var(--accent),#0b5f5a);color:#fff;box-shadow:0 12px 24px -8px rgba(13,132,125,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.dial b{font:800 12.5px var(--mono);line-height:1}
.dial small{font:700 8.5px var(--mono);opacity:.8}
.dial button{position:absolute;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--win);color:var(--text);box-shadow:var(--pop)}
.dial button:hover{color:var(--acc-t)}
.dial button svg.i{width:13px;height:13px}
.dial .m{left:-8px;top:46px}.dial .p{right:-8px;top:46px}
.tip{position:fixed;z-index:80;pointer-events:none;padding:6px 9px;border-radius:9px;background:#0e2140;color:#fff;font-size:11.5px;font-weight:600;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .1s;white-space:nowrap}
.tip.on{opacity:1}.tip kbd{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#0e2140;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:12.5px;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}


/* ===================== new designs: shared ===================== */
.tb{position:absolute;z-index:6;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;border-radius:14px;white-space:nowrap}
.q{position:relative;flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);transition:background .15s,color .15s,box-shadow .15s,transform .15s}
.q svg.i{width:17px;height:17px}
.q:hover{background:var(--hover);color:var(--text)}
.q.on{background:var(--accent);color:#fff;box-shadow:0 6px 14px -6px var(--accent)}
.sep{flex:none;width:1px;height:22px;margin:0 5px;background:var(--hair-2)}
.zw{display:flex;align-items:center;gap:1px;padding:2px;border-radius:10px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
.zw .q{width:30px;height:30px;border-radius:8px}
.zr{min-width:52px;height:30px;padding:0 6px;border-radius:8px;font:800 11.5px var(--mono);color:var(--text)}
.zr:hover{background:var(--hover)}
.pgx{flex:none;font:800 11px var(--mono);color:var(--text-2);padding:0 6px}
.trk{position:relative;height:30px;flex:none}
.trk .ln{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--hair-2)}
.trk .ln i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#2dd4bf,var(--accent))}
.trk .kn{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--accent),0 3px 8px rgba(0,0,0,.3);pointer-events:none;transition:left .25s}
.trk .tk{position:absolute;top:0;bottom:0;width:14px;margin-left:-7px;cursor:pointer}
.trk .tk::after{content:"";position:absolute;left:6px;bottom:3px;width:2px;height:4px;border-radius:1px;background:var(--text-3)}
.trk .tk:hover::after{background:var(--acc-t);height:6px}

/* 01 glass pro */
.a1{border-radius:16px;padding:6px;box-shadow:var(--pop),inset 0 1px 0 rgba(255,255,255,.55)}
.a1o.on{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.a1o.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
/* 02 three islands */
.a2{position:absolute;z-index:6;display:flex;align-items:center;gap:2px;padding:5px;border-radius:14px;white-space:nowrap}
.a2r{display:grid;gap:4px;justify-items:center;padding:3px 10px;border-radius:8px}
.a2r:hover{background:var(--hover)}
.a2r b{font:800 12px var(--mono);line-height:1}
.a2t{display:block;width:70px;height:3px;border-radius:2px;background:var(--hair-2);overflow:hidden}
.a2t i{display:block;height:100%;background:linear-gradient(90deg,#2dd4bf,var(--accent))}
/* 03 carbon */
.a3{background:linear-gradient(180deg,#222b3b,#11161f);box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.09),0 18px 36px -14px rgba(0,0,0,.75)}
.a3 .q{color:#8b98ad}
.a3 .q:hover{color:#eef2f7;background:rgba(255,255,255,.06)}
.a3 .q.on{background:rgba(45,212,191,.12);color:#5eead4;box-shadow:inset 0 0 0 1px rgba(45,212,191,.35)}
.a3 .q.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-5px;height:2px;border-radius:2px;background:#2dd4bf;box-shadow:0 0 8px #2dd4bf}
.a3 .sep{background:rgba(255,255,255,.1)}
.a3 .lcd{height:30px;min-width:64px;padding:0 8px;margin:0 2px;border-radius:7px;background:#05080d;box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06);font:700 12px var(--mono);color:#5eead4;text-shadow:0 0 8px rgba(45,212,191,.6)}
.a3 .pgx{color:#5eead4;font-weight:700}
/* 04 chip toolbar */
.a4c{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 9px;margin:0 1px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair-2);transition:.15s}
.a4c i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--c);transition:.15s}
.a4c:hover{color:var(--text);background:var(--hover)}
.a4c.on{background:color-mix(in srgb,var(--c) 14%,var(--win));color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
.a4c.on i{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
/* 05 tool palette */
.a5{position:absolute;z-index:6;left:12px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,32px);gap:2px;padding:6px;border-radius:14px}
.a5 .q{width:32px;height:32px}
.a5 .sep{grid-column:1/-1;width:auto;height:1px;margin:4px 2px}
.a5h,.a5z,.a5 .pgx{grid-column:1/-1;text-align:center}
.a5h{font:800 8.5px Inter;letter-spacing:.16em;color:var(--text-3);padding:2px 0 4px}
.a5z{height:26px;margin-bottom:2px;border-radius:7px;font:800 11px var(--mono);color:var(--text);background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
.a5 .pgx{padding:4px 0}
/* 06 app header */
.a6{position:absolute;z-index:6;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--hair);box-shadow:0 10px 24px -18px rgba(0,0,0,.6)}
.a6 .doc{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:var(--text);white-space:nowrap}
.a6 .doc b{font:800 9.5px Inter;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:var(--accent);color:#fff}
.a6 .doc span{color:var(--text-3);font-weight:500}
.a6 .ctr{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px}
.a6 .rgt{margin-left:auto;display:flex;align-items:center;gap:2px}
.a6 .q{width:32px;height:32px}
/* 09 aurora edge */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes a9{to{--ang:360deg}}
.a9{padding:1.5px;border-radius:16px;background:conic-gradient(from var(--ang),#2dd4bf,#3b82f6,#a855f7,#f43f5e,#f59e0b,#2dd4bf);animation:a9 6s linear infinite;box-shadow:0 18px 40px -16px rgba(45,212,191,.7)}
.a9 .in{display:flex;align-items:center;gap:2px;padding:5px;border-radius:14.5px;background:#0c111c}
.a9 .q{color:#94a3b8}
.a9 .q:hover{color:#fff;background:rgba(255,255,255,.07)}
.a9 .q.on{background:linear-gradient(135deg,#14b8a6,#3b82f6);color:#fff;box-shadow:0 6px 16px -6px #3b82f6}
.a9 .sep{background:rgba(255,255,255,.12)}
.a9 .zr{color:#e2e8f0;background:rgba(255,255,255,.05)}
.a9 .zr:hover{background:rgba(255,255,255,.1)}
.a9 .pgx{color:#cbd5e1}
/* 10 slider bar */
.b0v{min-width:46px;height:30px;border-radius:8px;font:800 11.5px var(--mono);color:var(--text)}
.b0v:hover{background:var(--hover)}
/* 11 two-tier */
.b1{position:absolute;z-index:6;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.b1m{position:relative;z-index:2;display:flex;align-items:center;gap:2px;padding:5px;border-radius:14px}
.b1t{display:flex;align-items:center;gap:2px;padding:10px 7px 5px;margin-top:-5px;border-radius:0 0 12px 12px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);box-shadow:var(--pop)}
.b1c{display:flex;align-items:center;gap:5px;height:26px;padding:0 9px 0 7px;border-radius:7px;font-size:11px;font-weight:600;color:var(--text-2);transition:.15s}
.b1c svg.i{width:14px;height:14px;color:var(--c)}
.b1c:hover{background:var(--hover);color:var(--text)}
.b1c.on{background:var(--win);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14),inset 0 -2px 0 var(--c)}
.b1p{font:800 11px var(--mono);color:var(--text);padding:0 8px}
/* 12 labelled dock */
.b2{position:absolute;z-index:6;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:1px;padding:6px 8px;border-radius:18px;white-space:nowrap}
.b2i{display:flex;flex-direction:column;align-items:center;gap:3px;width:50px;padding:2px 0;border-radius:10px;font-size:9.5px;font-weight:600;color:var(--text-2)}
.b2i .t{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);transition:.15s}
.b2i .t svg.i{width:16px;height:16px}
.b2i:hover{color:var(--text)}.b2i:hover .t{transform:translateY(-2px)}
.b2i.on{color:var(--acc-t)}.b2i.on .t{background:var(--accent);color:#fff;box-shadow:0 6px 14px -6px var(--accent)}
.b2 .sep{height:40px;align-self:center}
.b2z{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px;font-size:9.5px;font-weight:600;color:var(--text-3)}
.b2z .zw{height:36px}
.b2pg{align-self:center;font:800 11px var(--mono);color:var(--text);padding:0 4px 14px}
/* 14 swatch bar */
.b4s{flex:none;width:32px;height:34px;display:grid;place-items:center}
.b4s i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 10px var(--mono);font-style:normal;color:var(--c);box-shadow:inset 0 0 0 2px var(--c);transition:.15s}
.b4s:hover i{transform:scale(1.12)}
.b4s.on i{background:var(--c);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent),0 4px 12px -2px var(--c)}
.b4n{display:grid;line-height:1.15;margin:0 4px 0 6px;font:800 8.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}

/* 15 captioned groups */
.b5{position:absolute;z-index:6;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;padding:7px 4px 5px;border-radius:14px;white-space:nowrap}
.b5g{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.b5g+.b5g{border-left:1px solid var(--hair)}
.b5g h6{display:flex;justify-content:space-between;gap:10px;padding:0 4px;font:800 8.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.b5g h6 em{font:800 9px var(--mono);font-style:normal;letter-spacing:0;color:var(--acc-t)}
.b5g .r{display:flex;align-items:center;gap:1px}
/* 16 wings */
.b6{position:absolute;z-index:6;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;white-space:nowrap}
.b6w{display:flex;align-items:center;gap:2px;height:46px;padding:0 6px;border-radius:23px}
.b6w.l{padding-right:24px;margin-right:-18px}.b6w.r{padding-left:24px;margin-left:-18px}
.b6c{position:relative;z-index:2;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 35% 28%,#24324a,#0a101b);color:#fff;box-shadow:0 0 0 4px var(--win),0 14px 28px -8px rgba(0,0,0,.65)}
.b6c svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.b6c b{font:800 13px var(--mono);line-height:1.1}
.b6c small{font:800 7.5px Inter;letter-spacing:.16em;color:#5eead4}
/* 17 corner card */
.b7{position:absolute;z-index:6;top:12px;right:12px;width:238px;padding:11px;border-radius:16px;display:grid;gap:6px}
.b7h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 2px}
.b7h b{font-size:12.5px;font-weight:700}
.b7h span{font:700 10px var(--mono);color:var(--acc-t);background:var(--accent-soft);padding:2px 7px;border-radius:99px}
.b7c{font:800 8.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:2px 2px 0}
.b7r{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.b7 .q{width:auto;height:34px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
.b7 .q:hover{background:var(--hover)}
.b7 .q.on{background:var(--accent);box-shadow:0 6px 14px -6px var(--accent)}
.b7o.on{background:var(--c)!important;box-shadow:0 6px 14px -6px var(--c)!important}
.b7z{display:flex;align-items:center;gap:6px}
.b7z .q{width:30px;height:30px;flex:none}
.b7 .pgx{grid-column:span 3;display:grid;place-items:center;border-radius:9px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
/* 18 segmented */
.b8{gap:8px;padding:6px}
.seg{display:flex;align-items:center;gap:1px;padding:2px;border-radius:10px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--hair)}
.seg .q{width:32px;height:30px;border-radius:8px}
.seg .q.on{background:var(--win);color:var(--acc-t);box-shadow:0 1px 3px rgba(14,33,64,.18),0 0 0 .5px rgba(14,33,64,.08)}
.seg .zr{height:30px}
/* 19 search-first + navigator */
.b9 .sfx{width:210px;height:34px;margin-right:4px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);backdrop-filter:none}
.b9 .sfx:focus-within{box-shadow:0 0 0 2px var(--accent)}
.b9 .q{width:32px;height:32px}
.b9m{position:absolute;z-index:6;right:12px;bottom:12px;width:176px;padding:8px;border-radius:14px;display:grid;gap:6px}
.b9m .mm{position:relative;height:100px;border-radius:9px;overflow:hidden;background:#071b13;display:grid;place-items:center}
.stage.pdfm .b9m .mm{background:#e6ebf2}
.b9m .mm svg{width:92%;height:auto}
.b9m .mm .ph,.b9m .mm .rf,.b9m .mm .nh,.b9m .mm .hl,.b9m .mm .dv,.b9m .mm .rt{display:none}
.b9m .vp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #2dd4bf;border-radius:4px;background:rgba(45,212,191,.12);box-shadow:0 0 0 999px rgba(0,0,0,.28);transition:.3s}
.b9m .ft{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--text-2);padding:0 2px}
.b9m .ft b{font:800 10.5px var(--mono);color:var(--acc-t)}
/* 20 dual bars */
.c0v{position:absolute;z-index:6;right:12px;top:50%;transform:translateY(-50%);width:162px;padding:6px;border-radius:14px;display:grid;gap:2px}
.c0h{display:flex;justify-content:space-between;padding:2px 6px 4px;font:800 8.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.c0h em{font:800 9.5px var(--mono);font-style:normal;letter-spacing:0;color:var(--acc-t)}
.c0i{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:9px;font-size:12px;font-weight:600;color:var(--text-2);text-align:left;transition:.15s}
.c0i svg.i{width:16px;height:16px;color:var(--c)}
.c0i:hover{background:var(--hover);color:var(--text)}
.c0i.on{background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--text)}
.c0i .sw{margin-left:auto;flex:none;position:relative;width:26px;height:15px;border-radius:99px;background:var(--hair-2);transition:.15s}
.c0i .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.c0i.on .sw{background:var(--c)}.c0i.on .sw::after{left:13px}
.c0i kbd{margin-left:auto}
.c0pg{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:8px 0;font:800 22px var(--mono);color:var(--text)}
.c0pg small{font-size:11px;color:var(--text-3)}
</style>

<body>
<header class="top"><div class="in">
  <div><h1>Viewer controls — 20 designs</h1><p>Static: every option always visible. Compact, modern toolbars — 07, 08 and 13 kept from before. Same controls as the app's <code>BoardToolbar</code>; keys R, D, L, +, − work too.</p></div>
  <div class="ctl">
    <div class="mode"><button data-a="mode" data-v="pcb">PCB board</button><button data-a="mode" data-v="pdf">PDF schematic</button></div>
    <button class="tbtn" data-a="theme">◐</button>
  </div>
</div></header>
<nav class="toc" id="toc"></nav>
<main id="main"></main>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $all = (s, r = document) => [...r.querySelectorAll(s)];
const P = {
  rot:'M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5', flipH:'M12 3v18M9 7 4 12l5 5zM15 7l5 5-5 5z', flipV:'M3 12h18M7 9l5-5 5 5zM7 15l5 5 5-5z',
  zout:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8M7.5 10.5h6', zin:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8M7.5 10.5h6M10.5 7.5v6',
  fit:'M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4M9 9h6v6H9z', full:'M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5',
  layers:'M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5', diode:'M3 12h5M16 12h5M8 6.5l8 5.5-8 5.5zM16 6.5v11',
  rats:'M6 6h.01M18 18h.01M6 18h.01M18 6h.01M8 8l8 8M8 16l8-8', photo:'M4 6h16v12H4zM4 15l4.5-4.5 4 4 3-3L20 16M15.5 9.5h.01',
  rffe:'M12 13v8M8.5 9.5a5 5 0 0 1 7 0M6 7a8.5 8.5 0 0 1 12 0M12 13h.01', info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5.5M12 7.8v.2',
  results:'M4 5h16v14H4zM14 5v14M7 9h4M7 12h4M7 15h3', sol:'M5 4h9l4 4v4M5 4v16h5M8 9h5M8 13h3M13 20.5l6.5-6.5 2 2-6.5 6.5H13z',
  lock:'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3', unlock:'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 6.8-1.2',
  link:'M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1',
  search:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8', prev:'M15 6l-6 6 6 6', next:'M9 6l6 6-6 6', up:'M12 19V5M6 11l6-6 6 6', down:'M12 5v14M6 13l6 6 6-6', x:'M6 6l12 12M18 6 6 18'};
const I = n => `<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;

/* ---------- the app's controls (toolbar.ui + BoardToolbar::applyMode) ---------- */
const ACT = {
  rot:{l:'Rotate 90°', s:'Rotate', ic:'rot', m:'both', key:'R'}, flipH:{l:'Flip horizontal', s:'Flip ↔', ic:'flipH', m:'pcb', key:'H'}, flipV:{l:'Flip vertical', s:'Flip ↕', ic:'flipV', m:'pcb', key:'V'},
  fit:{l:'Fit to view', s:'Fit', ic:'fit', m:'pcb', key:'F'}, full:{l:'Full screen', s:'Full', ic:'full', m:'both', key:'F11'},
  zin:{l:'Zoom in', s:'Zoom in', ic:'zin', m:'both', key:'+'}, zout:{l:'Zoom out', s:'Zoom out', ic:'zout', m:'both', key:'−'},
  layers:{l:'Trace layers', s:'Layers', ic:'layers', m:'pcb', tog:1, key:'L', c:'#d4a017'}, diode:{l:'Diode readings', s:'Diode', ic:'diode', m:'pcb', tog:1, key:'D', c:'#16a34a'},
  rats:{l:'Airwires', s:'Airwires', ic:'rats', m:'pcb', tog:1, key:'A', c:'#2563eb'}, photo:{l:'Board photo', s:'Photo', ic:'photo', m:'pcb', tog:1, key:'P', c:'#a16207'},
  rffe:{l:'Blink RFFE', s:'RFFE', ic:'rffe', m:'pcb', tog:1, key:'B', c:'#e11d48'},
  info:{l:'Pin info panel', s:'Pin info', lp:'Results panel', sp:'Results', ic:'info', ip:'results', m:'both', tog:1, key:'I'},
  sol:{l:'Solution editor', s:'Solution', ic:'sol', m:'pcb', tog:1, key:'E'}, lock:{l:'Lock board', s:'Lock', ic:'lock', m:'pcb', tog:1, key:'K'},
  link:{l:'Linked tab', s:'Linked', ic:'link', m:'both', key:'Ctrl L'},
  pgPrev:{l:'Previous page', s:'Prev page', ic:'prev', m:'pdf', key:'PgUp'}, pgNext:{l:'Next page', s:'Next page', ic:'next', m:'pdf', key:'PgDn'},
  whole:{l:'Whole word', s:'Whole word', ic:'search', m:'pdf', tog:1, key:'W'}};
const OV = ['layers', 'diode', 'rats', 'photo', 'rffe'];
const D = {mode:'pcb', zoom:100, rot:0, flipH:false, flipV:false, full:false, layers:false, diode:true, rats:false, photo:false, rffe:false, info:false, sol:false, lock:false, page:3, pages:24, q:'', hit:1, hits:0, whole:false};
const ok = id => { const a = ACT[id]; return a && (a.m === 'both' || a.m === D.mode); };
const lab = id => D.mode === 'pdf' && ACT[id].lp ? ACT[id].lp : ACT[id].l;
const sl = id => D.mode === 'pdf' && ACT[id].sp ? ACT[id].sp : ACT[id].s;
const icn = id => D.mode === 'pdf' && ACT[id].ip ? ACT[id].ip : (id === 'lock' && !D.lock ? 'unlock' : ACT[id].ic);
const isOn = id => ACT[id] && ACT[id].tog ? !!D[id] : id === 'full' ? D.full : false;
const ZS = [25, 50, 75, 100, 125, 150, 200, 300, 400];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
/* groups for the current mode */
const G = () => D.mode === 'pcb'
  ? {view:['rot', 'flipH', 'flipV', 'fit', 'full'], ov:OV, tools:['info', 'sol', 'lock', 'link']}
  : {view:['rot', 'full'], ov:['pgPrev', 'pgNext'], tools:['info', 'whole', 'link']};
const GN = () => D.mode === 'pcb' ? {view:'View', ov:'Overlays', tools:'Tools'} : {view:'View', ov:'Page', tools:'Find'};

function run(id) {
  const a = ACT[id];
  if (a && a.tog) { D[id] = !D[id]; toast(`${lab(id)} ${D[id] ? 'on' : 'off'}`); return draw(); }
  switch (id) {
    case 'rot': D.rot = (D.rot + 90) % 360; break;
    case 'flipH': case 'flipV': D[id] = !D[id]; break;
    case 'fit': D.zoom = 100; D.rot = 0; break;
    case 'full': D.full = !D.full; break;
    case 'zin': D.zoom = ZS.find(z => z > D.zoom) || 400; break;
    case 'zout': D.zoom = [...ZS].reverse().find(z => z < D.zoom) || 25; break;
    case 'z100': D.zoom = 100; break;
    case 'link': setMode(D.mode === 'pcb' ? 'pdf' : 'pcb'); toast(`Jumped to the linked ${D.mode.toUpperCase()} tab`); return;
    case 'pgPrev': D.page = Math.max(1, D.page - 1); toast(`Page ${D.page}`); break;
    case 'pgNext': D.page = Math.min(D.pages, D.page + 1); toast(`Page ${D.page}`); break;
    case 'hitPrev': if (D.hits) D.hit = (D.hit - 2 + D.hits) % D.hits + 1; break;
    case 'hitNext': if (D.hits) D.hit = D.hit % D.hits + 1; break;
    case 'clear': D.q = ''; D.hits = 0; break;
  }
  draw();
}
function setQuery(q) { D.q = q.trim(); D.hits = D.q ? (D.mode === 'pcb' ? 12 : 6) : 0; D.hit = 1; draw(); }
function setMode(m) { D.mode = m; D.q = ''; D.hits = 0; draw(); }

/* ---------- canvas ---------- */
let BOARD = '', PAGE = '';
(function build() {
  let s = 0; const r = () => (s = (s * 16807 + 11) % 2147483647) / 2147483647, f = v => v.toFixed(1);
  s = 777; let b = '<defs><linearGradient id="phg" x1="0" x2="1"><stop offset="0" stop-color="#8b6b3d"/><stop offset=".5" stop-color="#3d6b54"/><stop offset="1" stop-color="#5b4a2e"/></linearGradient></defs>';
  b += '<rect x="6" y="6" width="308" height="188" rx="22" fill="#0f4d36" stroke="#c9a24a" stroke-width="2"/><rect class="ph" x="6" y="6" width="308" height="188" rx="22" fill="url(#phg)" opacity=".55"/>';
  b += '<g class="tr">'; for (let n = 0; n < 22; n++) { const x = 20 + r() * 280, y = 20 + r() * 160; b += `<path d="M${f(x)} ${f(y)}h${f(r() * 70 - 35)}v${f(r() * 50 - 25)}h${f(r() * 50 - 25)}" fill="none" stroke="${n % 3 ? '#e2b33c' : '#5aa9ff'}" stroke-width="1.3" opacity=".9"/>`; } b += '</g>';
  for (let n = 0; n < 9; n++) { const w = 16 + r() * 36, h = 14 + r() * 26, x = 22 + r() * (270 - w), y = 22 + r() * (150 - h); b += `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="#11161b" stroke="#3b4b45"/>`; }
  for (let n = 0; n < 60; n++) b += `<circle cx="${f(18 + r() * 284)}" cy="${f(18 + r() * 164)}" r="1.6" fill="#d9b55c"/>`;
  b += '<g class="rt">'; for (let n = 0; n < 10; n++) b += `<line x1="${f(30 + r() * 260)}" y1="${f(25 + r() * 150)}" x2="${f(30 + r() * 260)}" y2="${f(25 + r() * 150)}" stroke="#fff" stroke-width=".8" stroke-dasharray="3 3" opacity=".75"/>`; b += '</g>';
  b += '<g class="dv">'; for (let n = 0; n < 14; n++) b += `<text x="${f(24 + r() * 260)}" y="${f(26 + r() * 150)}" font-size="7" font-family="JetBrains Mono" fill="#fde68a">0.${300 + Math.floor(r() * 400)}</text>`; b += '</g>';
  b += '<g class="rf"><path d="M40 60H150V120H260" fill="none" stroke="#f43f5e" stroke-width="2.6"/><path d="M60 160V100H200" fill="none" stroke="#f43f5e" stroke-width="2.6"/></g>';
  b += '<g class="nh"><path d="M30 40H120V150H290" fill="none" stroke="#22d3ee" stroke-width="3"/><circle cx="120" cy="150" r="5" fill="none" stroke="#fff" stroke-width="1.5"/></g>';
  BOARD = `<svg viewBox="0 0 320 200">${b}</svg>`;
  s = 99; let p = '<rect width="320" height="210" fill="#fff"/><rect x="6" y="6" width="308" height="198" fill="none" stroke="#c9d2de"/>';
  const C = []; for (let n = 0; n < 11; n++) { const w = 18 + r() * 44, h = 12 + r() * 30, x = 16 + r() * (270 - w), y = 16 + r() * (150 - h); C.push([x, y, w, h]); p += `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="none" stroke="#1f2d45" stroke-width="1.1"/>`; }
  for (let n = 0; n < 10; n++) { const a = C[n], c = C[n + 1]; p += `<path d="M${f(a[0] + a[2])} ${f(a[1] + a[3] / 2)}H${f((a[0] + a[2] + c[0]) / 2)}V${f(c[1] + c[3] / 2)}H${f(c[0])}" fill="none" stroke="#3a4a66" stroke-width=".7"/>`; }
  p += '<g class="hl"><rect x="96" y="58" width="62" height="9" rx="2" fill="#facc15" opacity=".55"/><rect x="190" y="132" width="62" height="9" rx="2" fill="#f97316" opacity=".6"/></g><rect x="236" y="178" width="72" height="20" fill="none" stroke="#9aa7b8"/><rect x="240" y="183" width="40" height="3" fill="#d93a3a"/>';
  PAGE = `<svg viewBox="0 0 320 210">${p}</svg>`;
})();
function canvas(extra = '') {
  const pcb = D.mode === 'pcb';
  const cls = pcb ? `${D.layers ? 'L' : ''} ${D.rats ? 'A' : ''} ${D.diode ? 'D' : ''} ${D.rffe ? 'B' : ''} ${D.photo ? 'P' : ''} ${D.q ? 'Q' : ''}` : (D.q ? 'Q' : '');
  const tf = `rotate(${D.rot}deg) scale(${(D.flipH ? -1 : 1) * D.zoom / 100},${(D.flipV ? -1 : 1) * D.zoom / 100})`;
  return `<div class="cvw"><div class="cv ${cls}"><div class="cvi" style="transform:${tf}">${pcb ? BOARD : PAGE}</div></div>${extra}</div>`;
}

/* ---------- shared pieces ---------- */
const tipA = id => `data-tip="${esc(lab(id))}|${ACT[id].key}"`;
const B = (id, cls, inner, style = '') => ok(id) ? `<button class="${cls}${isOn(id) ? ' on' : ''}" data-run="${id}" ${tipA(id)}${style ? ` style="${style}"` : ''}>${inner ?? I(icn(id))}</button>` : '';
function sf() {
  const pcb = D.mode === 'pcb';
  return `<label class="sfx">${I('search')}<input data-q placeholder="${pcb ? 'Search nets & parts' : 'Find in schematic'}" value="${esc(D.q)}">
    ${D.hits ? `<span class="hits">${D.hit}/${D.hits}</span><button class="mini" data-run="hitPrev">${I(pcb ? 'prev' : 'up')}</button><button class="mini" data-run="hitNext">${I(pcb ? 'next' : 'down')}</button>` : ''}
    ${pcb ? '' : `<button class="mini ab${D.whole ? ' on' : ''}" data-run="whole">ab</button>`}${D.q ? `<button class="mini" data-run="clear">${I('x')}</button>` : ''}</label>`;
}
const S = pos => `<div class="tls" style="${pos}">${sf()}</div>`;
const ALL = () => { const g = G(); return [...g.view, ...g.ov, ...g.tools].filter(ok); };
const pageTxt = () => D.mode === 'pdf' ? ` · p.${D.page}` : '';
/* place buttons on an arc: list, centre (cx,cy), radius, start/end angle in degrees (0 = right, 90 = down) */
const arc = (list, cx, cy, r, a0, a1, cls = 'rb', labels = true) => list.map((id, k) => {
  const a = (list.length === 1 ? (a0 + a1) / 2 : a0 + (a1 - a0) * k / (list.length - 1)) * Math.PI / 180, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
  return B(id, cls, null, `left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;position:absolute;margin:-20px 0 0 -20px`) + (labels ? `<span class="lbl" style="position:absolute;left:${x.toFixed(1)}px;top:${(y + 24).toFixed(1)}px;transform:translateX(-50%)">${sl(id)}</span>` : '');
}).join('');
const zoomTrio = cls => `${B('zout', cls)}<button class="${cls} zt" data-run="z100" data-tip="Reset to 100%|0" style="font:800 11px var(--mono)">${D.zoom}%</button>${B('zin', cls)}`;

/* ---------- 20 designs ---------- */
const R = {};
// 07 Curved dock — hangs from the top edge
R[7] = () => { const g = G(), pdf = D.mode === 'pdf';
  const list = [...g.view, 'zout', 'Z', 'zin', ...(pdf ? ['pgPrev', 'P', 'pgNext'] : g.ov), ...g.tools].filter(id => id === 'Z' || id === 'P' || ok(id));
  const N = list.length, W = Math.min(820, N * 44 + 60);

const META = [
  ['Glass Pro', 'Frosted top bar', 'One frosted-glass bar at the top centre, like your app toolbar: icon buttons in four groups, an inset zoom well, and overlays that light up in their own colour with a small dot.'],

$('#toc').innerHTML = META.map((m, n) => `<a href="#c${n + 1}">${String(n + 1).padStart(2, '0')} ${m[0]}</a>`).join('');
$('#main').innerHTML = META.map(([h, tag, p], n) => `<section class="opt" id="c${n + 1}"><div class="meta"><span class="num">${String(n + 1).padStart(2, '0')}</span><div><h3>${h}<span class="tag">${tag}</span></h3><p>${p}</p></div></div><div class="stage" id="s${n + 1}" data-n="${n + 1}"></div></section>`).join('');

/* ---------- draw + events ---------- */
function draw() {
  for (let n = 1; n <= META.length; n++) { const s = $('#s' + n); s.className = 'stage' + (D.mode === 'pdf' ? ' pdfm' : ''); s.innerHTML = R[n](); }
  $all('.mode button').forEach(x => x.classList.toggle('on', x.dataset.v === D.mode));
}
let tt; function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1400); }
const tip = $('#tip'); let HOV = 0;
document.addEventListener('mouseover', e => {
  const st = e.target.closest('.stage'); HOV = st ? +st.dataset.n : 0;
  const el = e.target.closest('[data-tip]'); if (!el) { tip.classList.remove('on'); return; }
  const [t, k] = el.dataset.tip.split('|'); tip.innerHTML = `${t}${k ? `<kbd>${k}</kbd>` : ''}`;
  const r = el.getBoundingClientRect(); tip.classList.add('on');
  tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = (r.bottom + 34 > innerHeight ? r.top - 36 : r.bottom + 8) + 'px';
});
document.addEventListener('click', e => {
  tip.classList.remove('on');
  const r = e.target.closest('[data-run]'); if (r) return run(r.dataset.run);
  const zz = e.target.closest('[data-zoom]'); if (zz) { D.zoom = +zz.dataset.zoom; toast(`Zoom ${D.zoom}%`); return draw(); }
  const ru = e.target.closest('[data-ruler]');
  if (ru && !e.target.closest('.vw')) { const x = e.clientX - ru.getBoundingClientRect().left; let best = 100, bd = 1e9; ZS.forEach(z => { const d = Math.abs(20 + (Math.log2(z / 25) / 4) * 830 - x); if (d < bd) { bd = d; best = z; } }); D.zoom = best; return draw(); }
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'mode') setMode(a.dataset.v);
  if (a.dataset.a === 'theme') { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; }
});
const KEYMAP = {r:'rot', h:'flipH', v:'flipV', f:'fit', l:'layers', d:'diode', a:'rats', p:'photo', b:'rffe', i:'info', e:'sol', k:'lock', w:'whole', '+':'zin', '=':'zin', '-':'zout', '0':'z100', PageUp:'pgPrev', PageDown:'pgNext'};
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('[data-q]')) { if (e.key === 'Enter') setQuery(t.value); if (e.key === 'Escape') setQuery(''); return; }
  if (t.matches && t.matches('input') || !HOV || e.ctrlKey || e.metaKey || e.altKey) return;
  const id = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!id || (ACT[id] && !ok(id))) return;
  e.preventDefault(); run(id);
});
draw();
