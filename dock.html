<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer controls — 20 shapes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--win:#fff;--panel:#f6f8fb;--panel-2:#eef2f7;--hair:#e1e7ef;--hair-2:#d3dbe6;--text:#0e2140;--text-2:#4a5b75;--text-3:#8592a6;--accent:#0d847d;--acc-t:#0d847d;--accent-soft:rgba(13,132,125,.12);--hover:rgba(14,33,64,.06);--glass:rgba(255,255,255,.9);--sh:0 1px 2px rgba(14,33,64,.06),0 12px 30px -18px rgba(14,33,64,.35);--pop:0 0 0 1px rgba(14,33,64,.08),0 2px 4px rgba(14,33,64,.05),0 18px 36px -16px rgba(14,33,64,.5);--mono:'JetBrains Mono',ui-monospace,monospace}
[data-theme=dark]{--bg:#0b1220;--card:#111a2b;--win:#16223a;--panel:#17233a;--panel-2:#1a2740;--hair:#26354f;--hair-2:#30425f;--text:#e6edf7;--text-2:#a7b4c8;--text-3:#6f7f99;--acc-t:#2dd4bf;--accent-soft:rgba(45,212,191,.14);--hover:rgba(255,255,255,.07);--glass:rgba(18,28,46,.9);--sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.7);--pop:0 0 0 1px rgba(255,255,255,.08),0 18px 36px -16px rgba(0,0,0,.85)}
*{box-sizing:border-box;margin:0}
body{font:13px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{cursor:text;outline:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
kbd{font:600 10px var(--mono);padding:1px 5px;border-radius:5px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);color:var(--text-3)}

.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.top .in{max-width:1180px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:17px}.top p{color:var(--text-2);font-size:12.5px}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.mode{display:flex;padding:3px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--hair)}
.mode button{height:30px;padding:0 14px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--text-2)}
.mode button.on{background:var(--accent);color:#fff}
.tbtn{height:36px;padding:0 12px;border-radius:9px;background:var(--card);box-shadow:0 0 0 1px var(--hair);font-weight:600;font-size:12.5px}
.toc{max-width:1180px;margin:auto;padding:16px 24px 0;display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:11.5px;font-weight:600;color:var(--text-2);text-decoration:none;padding:4px 10px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--hair)}
.toc a:hover{color:var(--acc-t)}
main{max-width:1180px;margin:auto;padding:18px 24px 80px;display:grid;gap:22px}
.opt{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);display:grid;gap:12px;min-width:0;scroll-margin-top:80px}
.meta{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;font:700 13px var(--mono);color:var(--acc-t);background:var(--accent-soft);border-radius:8px;padding:4px 8px}
.meta h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta p{color:var(--text-2);font-size:12.5px;margin-top:2px;max-width:920px}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--hair)}

/* stage + canvas */
.stage{--lc:#cbd5e1;--lc2:#7b8aa3;--line:rgba(255,255,255,.35);position:relative;height:440px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0b2a1f,#05110c 75%);box-shadow:0 0 0 1px var(--hair);display:flex;flex-direction:column;user-select:none}
.stage.pdfm{--lc:var(--text-2);--lc2:var(--text-3);--line:rgba(14,33,64,.25);background:radial-gradient(ellipse at 50% 40%,#f3f6fa,#dfe5ee 80%)}
[data-theme=dark] .stage.pdfm{--lc:#cbd5e1;--line:rgba(255,255,255,.3);background:radial-gradient(ellipse at 50% 40%,#22304a,#141d2e 80%)}
.cvw{position:relative;flex:1;min-height:0;min-width:0;overflow:hidden}
.cvi{position:absolute;inset:0;display:grid;place-items:center;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.cvi svg{width:60%;height:66%;filter:drop-shadow(0 18px 26px rgba(0,0,0,.35))}
.cv .tr,.cv .rt,.cv .dv,.cv .rf,.cv .ph,.cv .nh,.cv .hl{display:none}
.cv.L .tr,.cv.A .rt,.cv.D .dv,.cv.B .rf,.cv.P .ph,.cv.Q .nh,.cv.Q .hl{display:inline}
.cv.B .rf{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--pop)}
.tls{position:absolute;z-index:6;width:250px}
.sfx{display:flex;align-items:center;gap:7px;height:34px;padding:0 6px 0 11px;border-radius:12px;background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--pop);color:var(--text-3)}
.sfx:focus-within{box-shadow:0 0 0 2px var(--accent),var(--pop)}
.sfx input{flex:1;min-width:0;font-size:12px;color:var(--text)}
.sfx .hits{font:700 10.5px var(--mono);color:var(--acc-t);background:var(--accent-soft);padding:1px 6px;border-radius:6px;white-space:nowrap}
.sfx .mini{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--text-2)}.sfx .mini svg.i{width:13px;height:13px}
.sfx .mini.on{background:var(--accent-soft);color:var(--acc-t)}.sfx .ab{font:700 11px var(--mono);text-decoration:underline}
.lbl{font-size:9.5px;font-weight:700;color:var(--lc);white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.stage.pdfm .lbl{text-shadow:none}
.cap{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lc2)}
/* base round button used by many shapes */
.rb{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--win);box-shadow:var(--pop);transition:transform .15s,background .15s,color .15s}
.rb:hover{transform:scale(1.08);color:var(--text)}
.rb.on{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft),0 8px 18px -6px var(--accent)}
.zt{font:800 12px var(--mono);color:var(--text)}

/* 01 dynamic island */
.isl{position:absolute;z-index:6;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;padding:6px 10px;border-radius:30px;background:#04070c;box-shadow:0 14px 34px -10px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.07)}
.isl .ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#8b98ad;transition:all .15s}
.isl .ib:hover{color:#fff;background:rgba(255,255,255,.08)}
.isl .ib.on{color:#5eead4;background:rgba(45,212,191,.15);box-shadow:inset 0 0 0 1px rgba(45,212,191,.55),0 0 14px -2px rgba(45,212,191,.6)}
.isl .dt{width:4px;height:4px;border-radius:50%;background:#2a3446;margin:0 5px}
.isl .zz{display:flex;align-items:center;gap:2px;padding:0 4px;border-radius:20px;background:#0e1520}
.isl .zz b{font:800 12px var(--mono);color:#fff;min-width:44px;text-align:center}
.isl .cam{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3b55,#0a0f18);box-shadow:0 0 0 2px #0e1520;margin:0 6px}
/* 02 spine */
.spn{position:absolute;z-index:6;left:18px;top:10px;bottom:10px;width:180px;overflow:auto;scrollbar-width:none}
.spn::before{content:"";position:absolute;left:16px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(var(--accent),var(--line) 30%,var(--line) 70%,var(--accent))}
.nd{position:relative;display:flex;align-items:center;gap:10px;height:27px}
.nd .c{flex:none;width:34px;height:24px;display:grid;place-items:center}
.nd .c i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--win);color:var(--text-2);box-shadow:0 0 0 3px rgba(5,17,12,.6),var(--pop);transition:all .15s}
.stage.pdfm .nd .c i{box-shadow:0 0 0 3px rgba(223,229,238,.9),var(--pop)}
.nd .c svg.i{width:13px;height:13px}
.nd .t{font-size:11.5px;font-weight:600;color:var(--lc)}
.nd:hover .c i{transform:scale(1.15)}
.nd.on .c i{background:var(--accent);color:#fff}.nd.on .t{color:var(--acc-t)}
.stage:not(.pdfm) .nd.on .t{color:#5eead4}
.spn .cap{display:block;padding:8px 0 2px 44px}
/* 03 honeycomb */
.hc{position:absolute;z-index:6;right:16px;bottom:10px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
.hr{display:flex;gap:4px;margin-top:-14px}.hr:first-child{margin-top:0}.hr.off{margin-left:30px}
.hx{width:56px;height:62px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--win);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-2);font-size:8.5px;font-weight:700;transition:background .15s,color .15s}
.hx:hover{background:color-mix(in srgb,var(--accent) 12%,var(--win));color:var(--text)}
.hx.on{background:var(--accent);color:#fff}
.hx.zm{background:#0e2140;color:#fff;font:800 12px var(--mono)}
.hx svg.i{width:17px;height:17px}
/* 04 corner arc */
.ca{position:absolute;z-index:5;left:0;bottom:0;width:0;height:0}
.ca .disc{position:absolute;left:-305px;bottom:-305px;width:610px;height:610px;border-radius:50%}
.ca .rb,.qp .rb,.or .rb,.pod .rb{position:absolute;margin:0 0 -20px -20px}
.ca .lbl,.qp .lbl{position:absolute;transform:translate(-50%,0)}
/* 05 orbit */
.or{position:absolute;z-index:6;right:16px;top:16px;width:260px;height:260px}
.or .ring{position:absolute;inset:26px;border-radius:50%;border:1.5px dashed var(--line)}
.or .hub{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;align-content:center;gap:2px}
.or .hub .zb{display:flex;gap:2px}.or .hub .zb button{width:24px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--text-2)}.or .hub .zb button:hover{background:var(--hover)}.or .hub svg.i{width:14px;height:14px}
.or .rb{width:38px;height:38px;margin:-19px 0 0 -19px}
/* 06 folder tabs */
.ftw{position:absolute;z-index:6;top:0;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:flex-start}
.ft{position:relative;display:flex;gap:2px;padding:8px 8px 7px;border-radius:0 0 16px 16px}
.ft .ear{position:absolute;left:50%;bottom:-19px;transform:translateX(-50%);height:20px;padding:0 12px;border-radius:0 0 10px 10px;display:grid;place-items:center;font:800 9px Inter;letter-spacing:.12em;color:var(--text-3);background:var(--glass);box-shadow:0 6px 10px -6px rgba(0,0,0,.4)}
.ib2{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);transition:all .15s}
.ib2:hover{background:var(--hover);color:var(--text)}.ib2.on{background:var(--accent);color:#fff}
.zl2{font:800 11.5px var(--mono);min-width:44px;text-align:center;align-self:center}
/* 07 curved dock */
.cd{position:absolute;z-index:6;left:50%;bottom:0;width:960px;height:150px;margin-left:-480px}
.cd svg.bg{position:absolute;inset:0;width:100%;height:100%}
.cd .it{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-50%)}
/* 08 slanted strip */
.sk8{position:absolute;z-index:6;top:14px;left:14px;display:flex;gap:10px}
.skg{display:flex;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.sk{height:38px;padding:0 14px;margin-left:-1px;transform:skewX(-16deg);background:var(--win);color:var(--text-2);box-shadow:inset -1px 0 0 var(--hair);transition:all .15s}
.sk:first-child{border-radius:8px 0 0 8px}.sk:last-child{border-radius:0 8px 8px 0;box-shadow:none}
.sk>span{display:flex;align-items:center;gap:6px;transform:skewX(16deg);font-size:11.5px;font-weight:700;white-space:nowrap}
.sk svg.i{width:15px;height:15px}
.sk:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 10%,var(--win))}
.sk.on{background:var(--accent);color:#fff}
/* 09 viewfinder brackets */
.vf{position:absolute;z-index:6;width:300px;height:110px;pointer-events:none}
.vf::before{content:"";position:absolute;width:60px;height:60px;border:3px solid var(--line)}
.vf.tl{top:12px;left:12px}.vf.tl::before{top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.vf.tr{top:12px;right:12px}.vf.tr::before{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf.bl{bottom:12px;left:12px}.vf.bl::before{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf.br{bottom:12px;right:12px;width:480px}.vf.br::before{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.vf .arm{position:absolute;display:flex;gap:4px;align-items:center;pointer-events:auto}
.vf.tl .arm{top:12px;left:14px}.vf.tr .arm{top:12px;right:14px}.vf.bl .arm{bottom:14px;left:12px;flex-direction:column;align-items:flex-start}.vf.br .arm{bottom:12px;right:14px}
.vf .ib2{background:var(--glass);box-shadow:var(--pop);backdrop-filter:blur(10px)}
.vf .ib2.on{background:var(--accent)}
/* 10 card deck */
.dk{position:absolute;z-index:6;right:18px;top:16px;width:220px;display:grid}
.dc{position:relative;padding:10px;border-radius:14px;margin-top:-6px;transition:transform .2s}
.dc:first-child{margin-top:0}
.dc:nth-child(odd){transform:rotate(-1.6deg)}.dc:nth-child(even){transform:rotate(1.2deg) translateX(-6px)}
.dc:hover{transform:rotate(0) translateX(-10px);z-index:5}
.dc h6{display:flex;justify-content:space-between;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-bottom:6px}
.dc .gr{display:flex;flex-wrap:wrap;gap:3px}
/* 11 pods */
.pods{position:absolute;z-index:6;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:16px;align-items:flex-end}
.pod{position:relative;width:140px;height:140px;border-radius:50%}
.pod.sm{width:100px;height:100px}
.pod .pn{position:absolute;inset:0;display:grid;place-items:center;font:800 9px Inter;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase;pointer-events:none}
.pod .rb{width:34px;height:34px;margin:-17px 0 0 -17px;box-shadow:0 0 0 1px var(--hair)}
.pod .pn b{font:800 13px var(--mono);color:var(--text);letter-spacing:0}
/* 12 bezel frame */
.bz{flex:1;min-height:0;display:grid;grid-template-columns:54px 1fr 54px;grid-template-rows:54px 1fr 56px;background:linear-gradient(160deg,#2a3344,#11161f);padding:0}
.bz .cvw{border-radius:16px;box-shadow:inset 0 0 0 2px #05080d,inset 0 4px 14px rgba(0,0,0,.6)}
.bz .bt,.bz .bb{display:flex;align-items:center;justify-content:center;gap:4px}
.bz .bl,.bz .br{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bk{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#a7b4c8;background:linear-gradient(#323c50,#232b3a);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.5);transition:all .12s}
.bk:hover{color:#fff}.bk.on{color:#5eead4;box-shadow:inset 0 0 0 1px rgba(45,212,191,.6),0 0 12px -2px rgba(45,212,191,.7)}
.bk svg.i{width:16px;height:16px}
.bz .zv{font:800 11px var(--mono);color:#e6edf7}
.bz .gl{font:800 8.5px Inter;letter-spacing:.14em;color:#64748b;margin:0 8px}
.bz .sfx{width:220px;height:32px;background:#1a2130;box-shadow:inset 0 0 0 1px #2c3648}
.bz .sfx input{color:#e6edf7}
/* 13 notched nav */
.nb{position:absolute;z-index:6;left:12px;right:12px;bottom:12px;height:64px;border-radius:20px;display:flex;align-items:center;padding:0 16px;-webkit-mask:radial-gradient(circle 46px at 50% -6px,transparent 98%,#000);mask:radial-gradient(circle 46px at 50% -6px,transparent 98%,#000)}
.nb .sd{flex:1;display:flex;align-items:center;gap:2px}.nb .sd.r{justify-content:flex-end}
.il{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;height:50px;justify-content:center;border-radius:12px;font-size:9.5px;font-weight:600;color:var(--text-2);white-space:nowrap}
.il:hover{background:var(--hover);color:var(--text)}.il.on{color:var(--acc-t);background:var(--accent-soft)}
.dial{position:absolute;z-index:7;left:50%;bottom:44px;width:80px;height:80px;margin-left:-40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#0b5f5a);color:#fff;box-shadow:0 12px 24px -8px rgba(13,132,125,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.dial b{font:800 15px var(--mono)}
.dial button{position:absolute;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--win);color:var(--text);box-shadow:var(--pop)}
.dial button svg.i{width:14px;height:14px}
.dial .m{left:-14px;top:27px}.dial .p{right:-14px;top:27px}
/* 14 isometric keys */
.iso{position:absolute;z-index:6;left:50%;bottom:-20px;width:820px;margin-left:-410px;padding:18px 22px 40px;border-radius:24px;transform:perspective(900px) rotateX(36deg);transform-origin:50% 100%;display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.ik{height:50px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:var(--text-2);background:linear-gradient(var(--win),var(--panel));box-shadow:0 7px 0 var(--hair-2),0 12px 16px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.ik:active{transform:translateY(5px);box-shadow:0 2px 0 var(--hair-2)}
.ik.on{color:#fff;background:linear-gradient(#14a39a,var(--accent));box-shadow:0 7px 0 #075d58,0 12px 16px rgba(0,0,0,.35)}
.ik svg.i{width:17px;height:17px}
/* 15 liquid capsule */
.lq{position:absolute;z-index:6;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;padding:5px;border-radius:99px;white-space:nowrap}
.lb .nm{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .25s}.lb.on .nm{max-width:90px}
.lb{position:relative;display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--text-2);transition:background .2s,color .2s,border-radius .2s}
.lb svg.i{width:15px;height:15px}
.lb:hover{color:var(--text);background:var(--hover)}
.lb.on{color:#fff;background:linear-gradient(180deg,#14a39a,var(--accent))}
.lb.on.jl{border-top-left-radius:0;border-bottom-left-radius:0}.lb.on.jr{border-top-right-radius:0;border-bottom-right-radius:0}
.lq .gap{width:10px}
/* 16 rulers */
.ru{position:absolute;z-index:6;left:64px;right:0;top:0;height:30px;background:var(--glass);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair-2);background-image:repeating-linear-gradient(90deg,var(--text-3) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--text-2) 0 1px,transparent 1px 50px);background-size:100% 6px,100% 12px;background-repeat:no-repeat;background-position:0 100%,0 100%;cursor:pointer}
.ru .mk{position:absolute;bottom:0;width:0;height:0;border:7px solid transparent;border-bottom:10px solid var(--accent);margin-left:-7px;transition:left .3s}
.ru .nv{position:absolute;top:3px;font:700 9.5px var(--mono);color:var(--text-2);transform:translateX(-50%);pointer-events:none}
.ru .vw{position:absolute;right:6px;top:2px;display:flex;gap:2px}
.ru .vw .ib2{width:26px;height:24px;border-radius:7px}.ru .vw svg.i{width:14px;height:14px}

.pad{position:absolute;z-index:6;left:50%;bottom:12px;width:560px;height:170px;margin-left:-280px}

<body>
<header class="top"><div class="in">
  <div><h1>Viewer controls — 20 shapes</h1><p>Static: every option always visible. Each design is a different <b>shape</b>. Same controls as the app's <code>BoardToolbar</code>; keys R, D, L, +, − work too.</p></div>
  <div class="ctl">
    <div class="mode"><button data-a="mode" data-v="pcb">PCB board</button><button data-a="mode" data-v="pdf">PDF schematic</button></div>
    <button class="tbtn" data-a="theme">◐</button>
  </div>
</div></header>
<nav class="toc" id="toc"></nav>
<main id="main"></main>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $all = (s, r = document) => [...r.querySelectorAll(s)];
const P = {
  rot:'M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5', flipH:'M12 3v18M9 7 4 12l5 5zM15 7l5 5-5 5z', flipV:'M3 12h18M7 9l5-5 5 5zM7 15l5 5 5-5z',
  zout:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8M7.5 10.5h6', zin:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8M7.5 10.5h6M10.5 7.5v6',
  fit:'M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4M9 9h6v6H9z', full:'M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5',
  layers:'M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5', diode:'M3 12h5M16 12h5M8 6.5l8 5.5-8 5.5zM16 6.5v11',
  rats:'M6 6h.01M18 18h.01M6 18h.01M18 6h.01M8 8l8 8M8 16l8-8', photo:'M4 6h16v12H4zM4 15l4.5-4.5 4 4 3-3L20 16M15.5 9.5h.01',
  rffe:'M12 13v8M8.5 9.5a5 5 0 0 1 7 0M6 7a8.5 8.5 0 0 1 12 0M12 13h.01', info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5.5M12 7.8v.2',
  results:'M4 5h16v14H4zM14 5v14M7 9h4M7 12h4M7 15h3', sol:'M5 4h9l4 4v4M5 4v16h5M8 9h5M8 13h3M13 20.5l6.5-6.5 2 2-6.5 6.5H13z',
  lock:'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3', unlock:'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 6.8-1.2',
  link:'M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1',
  search:'M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM20 20l-4.8-4.8', prev:'M15 6l-6 6 6 6', next:'M9 6l6 6-6 6', up:'M12 19V5M6 11l6-6 6 6', down:'M12 5v14M6 13l6 6 6-6', x:'M6 6l12 12M18 6 6 18'};
const I = n => `<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;

/* ---------- the app's controls (toolbar.ui + BoardToolbar::applyMode) ---------- */
const ACT = {
  rot:{l:'Rotate 90°', s:'Rotate', ic:'rot', m:'both', key:'R'}, flipH:{l:'Flip horizontal', s:'Flip ↔', ic:'flipH', m:'pcb', key:'H'}, flipV:{l:'Flip vertical', s:'Flip ↕', ic:'flipV', m:'pcb', key:'V'},
  fit:{l:'Fit to view', s:'Fit', ic:'fit', m:'pcb', key:'F'}, full:{l:'Full screen', s:'Full', ic:'full', m:'both', key:'F11'},
  zin:{l:'Zoom in', s:'Zoom in', ic:'zin', m:'both', key:'+'}, zout:{l:'Zoom out', s:'Zoom out', ic:'zout', m:'both', key:'−'},
  layers:{l:'Trace layers', s:'Layers', ic:'layers', m:'pcb', tog:1, key:'L', c:'#d4a017'}, diode:{l:'Diode readings', s:'Diode', ic:'diode', m:'pcb', tog:1, key:'D', c:'#16a34a'},
  rats:{l:'Airwires', s:'Airwires', ic:'rats', m:'pcb', tog:1, key:'A', c:'#2563eb'}, photo:{l:'Board photo', s:'Photo', ic:'photo', m:'pcb', tog:1, key:'P', c:'#a16207'},
  rffe:{l:'Blink RFFE', s:'RFFE', ic:'rffe', m:'pcb', tog:1, key:'B', c:'#e11d48'},
  info:{l:'Pin info panel', s:'Pin info', lp:'Results panel', sp:'Results', ic:'info', ip:'results', m:'both', tog:1, key:'I'},
  sol:{l:'Solution editor', s:'Solution', ic:'sol', m:'pcb', tog:1, key:'E'}, lock:{l:'Lock board', s:'Lock', ic:'lock', m:'pcb', tog:1, key:'K'},
  link:{l:'Linked tab', s:'Linked', ic:'link', m:'both', key:'Ctrl L'},
  pgPrev:{l:'Previous page', s:'Prev page', ic:'prev', m:'pdf', key:'PgUp'}, pgNext:{l:'Next page', s:'Next page', ic:'next', m:'pdf', key:'PgDn'},
  whole:{l:'Whole word', s:'Whole word', ic:'search', m:'pdf', tog:1, key:'W'}};
const OV = ['layers', 'diode', 'rats', 'photo', 'rffe'];
const D = {mode:'pcb', zoom:100, rot:0, flipH:false, flipV:false, full:false, layers:false, diode:true, rats:false, photo:false, rffe:false, info:false, sol:false, lock:false, page:3, pages:24, q:'', hit:1, hits:0, whole:false};
const ok = id => { const a = ACT[id]; return a && (a.m === 'both' || a.m === D.mode); };
const lab = id => D.mode === 'pdf' && ACT[id].lp ? ACT[id].lp : ACT[id].l;
const sl = id => D.mode === 'pdf' && ACT[id].sp ? ACT[id].sp : ACT[id].s;
const icn = id => D.mode === 'pdf' && ACT[id].ip ? ACT[id].ip : (id === 'lock' && !D.lock ? 'unlock' : ACT[id].ic);
const isOn = id => ACT[id] && ACT[id].tog ? !!D[id] : id === 'full' ? D.full : false;
const ZS = [25, 50, 75, 100, 125, 150, 200, 300, 400];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
/* groups for the current mode */
const G = () => D.mode === 'pcb'
  ? {view:['rot', 'flipH', 'flipV', 'fit', 'full'], ov:OV, tools:['info', 'sol', 'lock', 'link']}
  : {view:['rot', 'full'], ov:['pgPrev', 'pgNext'], tools:['info', 'whole', 'link']};
const GN = () => D.mode === 'pcb' ? {view:'View', ov:'Overlays', tools:'Tools'} : {view:'View', ov:'Page', tools:'Find'};

function run(id) {
  const a = ACT[id];
  if (a && a.tog) { D[id] = !D[id]; toast(`${lab(id)} ${D[id] ? 'on' : 'off'}`); return draw(); }
  switch (id) {
    case 'rot': D.rot = (D.rot + 90) % 360; break;
    case 'flipH': case 'flipV': D[id] = !D[id]; break;
    case 'fit': D.zoom = 100; D.rot = 0; break;
    case 'full': D.full = !D.full; break;
    case 'zin': D.zoom = ZS.find(z => z > D.zoom) || 400; break;
    case 'zout': D.zoom = [...ZS].reverse().find(z => z < D.zoom) || 25; break;
    case 'z100': D.zoom = 100; break;
    case 'link': setMode(D.mode === 'pcb' ? 'pdf' : 'pcb'); toast(`Jumped to the linked ${D.mode.toUpperCase()} tab`); return;
    case 'pgPrev': D.page = Math.max(1, D.page - 1); toast(`Page ${D.page}`); break;
    case 'pgNext': D.page = Math.min(D.pages, D.page + 1); toast(`Page ${D.page}`); break;
    case 'hitPrev': if (D.hits) D.hit = (D.hit - 2 + D.hits) % D.hits + 1; break;
    case 'hitNext': if (D.hits) D.hit = D.hit % D.hits + 1; break;
    case 'clear': D.q = ''; D.hits = 0; break;
  }
  draw();
}
function setQuery(q) { D.q = q.trim(); D.hits = D.q ? (D.mode === 'pcb' ? 12 : 6) : 0; D.hit = 1; draw(); }
function setMode(m) { D.mode = m; D.q = ''; D.hits = 0; draw(); }

/* ---------- canvas ---------- */
let BOARD = '', PAGE = '';
(function build() {
  let s = 0; const r = () => (s = (s * 16807 + 11) % 2147483647) / 2147483647, f = v => v.toFixed(1);
  s = 777; let b = '<defs><linearGradient id="phg" x1="0" x2="1"><stop offset="0" stop-color="#8b6b3d"/><stop offset=".5" stop-color="#3d6b54"/><stop offset="1" stop-color="#5b4a2e"/></linearGradient></defs>';
  b += '<rect x="6" y="6" width="308" height="188" rx="22" fill="#0f4d36" stroke="#c9a24a" stroke-width="2"/><rect class="ph" x="6" y="6" width="308" height="188" rx="22" fill="url(#phg)" opacity=".55"/>';
  b += '<g class="tr">'; for (let n = 0; n < 22; n++) { const x = 20 + r() * 280, y = 20 + r() * 160; b += `<path d="M${f(x)} ${f(y)}h${f(r() * 70 - 35)}v${f(r() * 50 - 25)}h${f(r() * 50 - 25)}" fill="none" stroke="${n % 3 ? '#e2b33c' : '#5aa9ff'}" stroke-width="1.3" opacity=".9"/>`; } b += '</g>';
  for (let n = 0; n < 9; n++) { const w = 16 + r() * 36, h = 14 + r() * 26, x = 22 + r() * (270 - w), y = 22 + r() * (150 - h); b += `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="#11161b" stroke="#3b4b45"/>`; }
  for (let n = 0; n < 60; n++) b += `<circle cx="${f(18 + r() * 284)}" cy="${f(18 + r() * 164)}" r="1.6" fill="#d9b55c"/>`;
  b += '<g class="rt">'; for (let n = 0; n < 10; n++) b += `<line x1="${f(30 + r() * 260)}" y1="${f(25 + r() * 150)}" x2="${f(30 + r() * 260)}" y2="${f(25 + r() * 150)}" stroke="#fff" stroke-width=".8" stroke-dasharray="3 3" opacity=".75"/>`; b += '</g>';
  b += '<g class="dv">'; for (let n = 0; n < 14; n++) b += `<text x="${f(24 + r() * 260)}" y="${f(26 + r() * 150)}" font-size="7" font-family="JetBrains Mono" fill="#fde68a">0.${300 + Math.floor(r() * 400)}</text>`; b += '</g>';
  b += '<g class="rf"><path d="M40 60H150V120H260" fill="none" stroke="#f43f5e" stroke-width="2.6"/><path d="M60 160V100H200" fill="none" stroke="#f43f5e" stroke-width="2.6"/></g>';
  b += '<g class="nh"><path d="M30 40H120V150H290" fill="none" stroke="#22d3ee" stroke-width="3"/><circle cx="120" cy="150" r="5" fill="none" stroke="#fff" stroke-width="1.5"/></g>';
  BOARD = `<svg viewBox="0 0 320 200">${b}</svg>`;
  s = 99; let p = '<rect width="320" height="210" fill="#fff"/><rect x="6" y="6" width="308" height="198" fill="none" stroke="#c9d2de"/>';
  const C = []; for (let n = 0; n < 11; n++) { const w = 18 + r() * 44, h = 12 + r() * 30, x = 16 + r() * (270 - w), y = 16 + r() * (150 - h); C.push([x, y, w, h]); p += `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="none" stroke="#1f2d45" stroke-width="1.1"/>`; }
  for (let n = 0; n < 10; n++) { const a = C[n], c = C[n + 1]; p += `<path d="M${f(a[0] + a[2])} ${f(a[1] + a[3] / 2)}H${f((a[0] + a[2] + c[0]) / 2)}V${f(c[1] + c[3] / 2)}H${f(c[0])}" fill="none" stroke="#3a4a66" stroke-width=".7"/>`; }
  p += '<g class="hl"><rect x="96" y="58" width="62" height="9" rx="2" fill="#facc15" opacity=".55"/><rect x="190" y="132" width="62" height="9" rx="2" fill="#f97316" opacity=".6"/></g><rect x="236" y="178" width="72" height="20" fill="none" stroke="#9aa7b8"/><rect x="240" y="183" width="40" height="3" fill="#d93a3a"/>';
  PAGE = `<svg viewBox="0 0 320 210">${p}</svg>`;
})();
function canvas(extra = '') {
  const pcb = D.mode === 'pcb';
  const cls = pcb ? `${D.layers ? 'L' : ''} ${D.rats ? 'A' : ''} ${D.diode ? 'D' : ''} ${D.rffe ? 'B' : ''} ${D.photo ? 'P' : ''} ${D.q ? 'Q' : ''}` : (D.q ? 'Q' : '');
  const tf = `rotate(${D.rot}deg) scale(${(D.flipH ? -1 : 1) * D.zoom / 100},${(D.flipV ? -1 : 1) * D.zoom / 100})`;
  return `<div class="cvw"><div class="cv ${cls}"><div class="cvi" style="transform:${tf}">${pcb ? BOARD : PAGE}</div></div>${extra}</div>`;
}

/* ---------- shared pieces ---------- */
const tipA = id => `data-tip="${esc(lab(id))}|${ACT[id].key}"`;
const B = (id, cls, inner, style = '') => ok(id) ? `<button class="${cls}${isOn(id) ? ' on' : ''}" data-run="${id}" ${tipA(id)}${style ? ` style="${style}"` : ''}>${inner ?? I(icn(id))}</button>` : '';
function sf() {
  const pcb = D.mode === 'pcb';
  return `<label class="sfx">${I('search')}<input data-q placeholder="${pcb ? 'Search nets & parts' : 'Find in schematic'}" value="${esc(D.q)}">
    ${D.hits ? `<span class="hits">${D.hit}/${D.hits}</span><button class="mini" data-run="hitPrev">${I(pcb ? 'prev' : 'up')}</button><button class="mini" data-run="hitNext">${I(pcb ? 'next' : 'down')}</button>` : ''}
    ${pcb ? '' : `<button class="mini ab${D.whole ? ' on' : ''}" data-run="whole">ab</button>`}${D.q ? `<button class="mini" data-run="clear">${I('x')}</button>` : ''}</label>`;
}
const S = pos => `<div class="tls" style="${pos}">${sf()}</div>`;
const ALL = () => { const g = G(); return [...g.view, ...g.ov, ...g.tools].filter(ok); };
const pageTxt = () => D.mode === 'pdf' ? ` · p.${D.page}` : '';
/* place buttons on an arc: list, centre (cx,cy), radius, start/end angle in degrees (0 = right, 90 = down) */
const arc = (list, cx, cy, r, a0, a1, cls = 'rb', labels = true) => list.map((id, k) => {
  const a = (list.length === 1 ? (a0 + a1) / 2 : a0 + (a1 - a0) * k / (list.length - 1)) * Math.PI / 180, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
  return B(id, cls, null, `left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;position:absolute;margin:-20px 0 0 -20px`) + (labels ? `<span class="lbl" style="position:absolute;left:${x.toFixed(1)}px;top:${(y + 24).toFixed(1)}px;transform:translateX(-50%)">${sl(id)}</span>` : '');
}).join('');
const zoomTrio = cls => `${B('zout', cls)}<button class="${cls} zt" data-run="z100" data-tip="Reset to 100%|0" style="font:800 11px var(--mono)">${D.zoom}%</button>${B('zin', cls)}`;

/* ---------- 20 shapes ---------- */
const R = {};
// 01 Dynamic Island
R[1] = () => { const g = G(); const ib = id => B(id, 'ib');
  return canvas(`<div class="isl">${g.view.map(ib).join('')}<span class="dt"></span><span class="zz">${ib('zout')}<b>${D.zoom}%</b>${ib('zin')}</span><span class="cam"></span>${g.ov.map(ib).join('')}<span class="dt"></span>${g.tools.map(ib).join('')}</div>${S('bottom:14px;left:50%;margin-left:-125px')}`); };
// 02 Spine timeline
R[2] = () => { const g = G(), n = GN(); const nd = id => ok(id) ? `<button class="nd${isOn(id) ? ' on' : ''}" data-run="${id}" ${tipA(id)}><span class="c"><i>${I(icn(id))}</i></span><span class="t">${lab(id)}</span></button>` : '';
  return canvas(`<div class="spn"><span class="cap">${n.view}</span>${g.view.map(nd).join('')}<span class="cap">Zoom · ${D.zoom}%</span>${nd('zin')}${nd('zout')}<span class="cap">${n.ov}${pageTxt()}</span>${g.ov.map(nd).join('')}<span class="cap">${n.tools}</span>${g.tools.map(nd).join('')}</div>${S('top:14px;right:14px')}`); };
// 03 Honeycomb
R[3] = () => { const list = [...ALL()]; const hx = id => B(id, 'hx', `${I(icn(id))}${sl(id)}`);
  const cells = [...list.map(hx), B('zout', 'hx', `${I('zout')}Out`), `<button class="hx zm" data-run="z100" data-tip="Reset to 100%|0">${D.zoom}%</button>`, B('zin', 'hx', `${I('zin')}In`)];
  const rows = []; let i = 0, w = 5; while (i < cells.length) { rows.push(cells.slice(i, i + w)); i += w; w = w === 5 ? 4 : 5; }
  return canvas(`<div class="hc">${rows.map((r, k) => `<div class="hr${k % 2 ? ' off' : ''}">${r.join('')}</div>`).join('')}</div>${S('top:14px;left:14px')}`); };
// 04 Corner arc
R[4] = () => { const g = G(), H = 440;
  return canvas(`<div class="ca" style="top:100%"><div class="disc glass"></div>${arc(g.view.filter(ok), 0, 0, 115, -84, -6, 'rb', false)}${arc(['zout', 'zin', ...g.ov].filter(ok), 0, 0, 195, -85, -5, 'rb', false)}${arc(g.tools.filter(ok), 0, 0, 272, -80, -10, 'rb', false)}<span class="zt" style="position:absolute;left:22px;top:-46px">${D.zoom}%</span><span class="cap" style="position:absolute;left:58px;top:-28px">View</span></div>${S('top:14px;right:14px')}`); };
// 05 Orbit
R[5] = () => { const list = ALL();
  return canvas(`<div class="or"><span class="ring"></span><div class="hub glass"><span class="zt">${D.zoom}%</span><span class="zb"><button data-run="zout" data-tip="Zoom out|−">${I('zout')}</button><button data-run="zin" data-tip="Zoom in|+">${I('zin')}</button></span></div>${list.map((id, k) => { const a = (k / list.length * 360 - 90) * Math.PI / 180; return B(id, 'rb', null, `left:${130 + Math.cos(a) * 104}px;top:${130 + Math.sin(a) * 104}px`); }).join('')}</div>${S('top:14px;left:14px')}`); };
// 06 Folder tabs
R[6] = () => { const g = G(), n = GN(); const ft = (name, html) => `<div class="ft glass">${html}<span class="ear">${name.toUpperCase()}</span></div>`;
  return canvas(`<div class="ftw">${ft(n.view, g.view.map(id => B(id, 'ib2')).join(''))}${ft('Zoom', `${B('zout', 'ib2')}<span class="zl2">${D.zoom}%</span>${B('zin', 'ib2')}`)}${ft(n.ov + pageTxt(), g.ov.map(id => B(id, 'ib2')).join(''))}${ft(n.tools, g.tools.map(id => B(id, 'ib2')).join(''))}</div>${S('bottom:14px;left:14px')}`); };
// 07 Curved dock
R[7] = () => { const list = [...G().view, 'zout', 'zin', ...G().ov, ...G().tools].filter(ok), W = 960, N = list.length;
  const items = list.map((id, k) => { const x = 50 + k * (W - 100) / (N - 1), t = (x - W / 2) / (W / 2), y = 70 + t * t * 44; return `<div class="it" style="left:${x}px;top:${y}px">${B(id, 'rb')}<span class="lbl">${sl(id)}</span></div>`; }).join('');
  return canvas(`<div class="cd"><svg class="bg" viewBox="0 0 960 150" preserveAspectRatio="none"><path d="M0 150 L0 112 Q480 18 960 112 L960 150 Z" fill="var(--glass)" stroke="var(--line)"/></svg>${items}<span class="zt" style="position:absolute;left:50%;top:116px;transform:translateX(-50%)">${D.zoom}%</span></div>${S('top:14px;left:14px')}`); };
// 08 Slanted strip
R[8] = () => { const g = G(); const sk = id => B(id, 'sk', `<span>${I(icn(id))}${sl(id)}</span>`);
  return canvas(`<div class="sk8" style="flex-wrap:wrap;right:14px"><div class="skg">${g.view.map(sk).join('')}</div><div class="skg">${sk('zout')}<button class="sk" data-run="z100"><span style="font-family:var(--mono)">${D.zoom}%</span></button>${sk('zin')}</div><div class="skg">${g.ov.map(sk).join('')}</div><div class="skg">${g.tools.map(sk).join('')}</div></div>${S('bottom:14px;right:14px')}`); };
// 09 Viewfinder brackets
R[9] = () => { const g = G(); const ib = id => B(id, 'ib2');
  return canvas(`<div class="vf tl"><div class="arm">${g.view.map(ib).join('')}</div></div><div class="vf tr" style="width:320px"><div class="arm">${sf()}</div></div>
    <div class="vf bl" style="height:170px;width:120px"><div class="arm">${ib('zin')}<span class="zt" style="font-size:11px;color:var(--lc)">${D.zoom}%</span>${ib('zout')}</div></div><div class="vf br"><div class="arm">${g.ov.map(ib).join('')}<span style="width:10px"></span>${g.tools.map(ib).join('')}</div></div>`); };
// 10 Card deck
R[10] = () => { const g = G(), n = GN(); const card = (name, html, k) => `<div class="dc glass" style="z-index:${4 - k}"><h6><span>${name}</span><span>${k === 1 ? D.zoom + '%' : ''}</span></h6><div class="gr">${html}</div></div>`;
  return canvas(`<div class="dk">${card(n.view, g.view.map(id => B(id, 'ib2')).join(''), 0)}${card('Zoom', `${B('zout', 'ib2')}<button class="ib2" data-run="z100" style="width:auto;padding:0 8px;font:800 11px var(--mono)">${D.zoom}%</button>${B('zin', 'ib2')}`, 1)}${card(n.ov + pageTxt(), g.ov.map(id => B(id, 'ib2')).join(''), 2)}${card(n.tools, g.tools.map(id => B(id, 'ib2')).join(''), 3)}</div>${S('top:14px;left:14px')}`); };
// 11 Group pods
R[11] = () => { const g = G(), n = GN(); const pod = (name, list, sm) => { const W = sm ? 100 : 140, r = sm ? 34 : 50; return `<div class="pod glass${sm ? ' sm' : ''}"><span class="pn">${name}</span>${list.filter(ok).map((id, k, a) => { const ang = (k / a.length * 360 - 90) * Math.PI / 180; return B(id, 'rb', null, `position:absolute;left:${W / 2 + Math.cos(ang) * r}px;top:${W / 2 + Math.sin(ang) * r}px`); }).join('')}</div>`; };
  return canvas(`<div class="pods">${pod(n.view, g.view)}${`<div class="pod glass sm"><span class="pn"><b>${D.zoom}%</b></span>${B('zout', 'rb', null, 'position:absolute;left:18px;top:50px')}${B('zin', 'rb', null, 'position:absolute;left:82px;top:50px')}</div>`}${pod(n.ov + pageTxt(), g.ov)}${pod(n.tools, g.tools)}</div>${S('top:14px;left:14px')}`); };
// 12 Device bezel
R[12] = () => { const g = G(), n = GN(); const bk = id => B(id, 'bk');
  return `<div class="bz"><span></span><div class="bt"><span class="gl">${n.view.toUpperCase()}</span>${g.view.map(bk).join('')}<span class="gl">${n.tools.toUpperCase()}</span>${g.tools.map(bk).join('')}</div><span></span>
    <div class="bl">${bk('zin')}<span class="zv">${D.zoom}</span>${bk('zout')}</div>${canvas()}<div class="br">${g.ov.map(bk).join('')}</div>
    <span></span><div class="bb">${sf()}</div><span></span></div>`; };
// 13 Notched nav
R[13] = () => { const g = G(); const il = id => B(id, 'il', `${I(icn(id))}${sl(id)}`);
  return canvas(`<div class="nb glass"><div class="sd">${g.view.map(il).join('')}</div><div style="width:110px"></div><div class="sd r">${g.ov.map(il).join('')}${g.tools.map(il).join('')}</div></div>
    <div class="dial"><b>${D.zoom}%</b><button class="m" data-run="zout" data-tip="Zoom out|−">${I('zout')}</button><button class="p" data-run="zin" data-tip="Zoom in|+">${I('zin')}</button></div>${S('top:14px;left:14px')}`); };
// 14 Isometric keys
R[14] = () => { const list = [...ALL(), 'zout', 'zin']; const ik = id => B(id, 'ik', `${I(icn(id))}${sl(id)}`);
  return canvas(`<div class="iso glass">${list.map(ik).join('')}</div><span class="zt" style="position:absolute;z-index:7;right:18px;bottom:16px;color:var(--lc)">${D.zoom}%</span>${S('top:14px;left:14px')}`); };
// 15 Liquid capsule
R[15] = () => { const g = G(); const seq = (list) => list.filter(ok).map((id, k, a) => { const on = isOn(id), jl = on && k > 0 && isOn(a[k - 1]), jr = on && k < a.length - 1 && isOn(a[k + 1]); return `<button class="lb${on ? ' on' : ''}${jl ? ' jl' : ''}${jr ? ' jr' : ''}" data-run="${id}" ${tipA(id)}>${I(icn(id))}<span class="nm">${sl(id)}</span></button>`; }).join('');
  return canvas(`<div class="lq glass">${seq(g.view)}<span class="gap"></span>${seq(['zout'])}<button class="lb" data-run="z100" style="font-family:var(--mono)">${D.zoom}%</button>${seq(['zin'])}<span class="gap"></span>${seq(g.ov)}<span class="gap"></span>${seq(g.tools)}</div>${S('bottom:14px;left:50%;margin-left:-125px')}`); };
// 16 Rulers
R[16] = () => { const g = G(), W = 1030, xz = z => 20 + (Math.log2(z / 25) / 4) * (W - 200);
  return canvas(`<div class="rco">${D.zoom}%</div><div class="ru" data-ruler>${ZS.map(z => `<span class="nv" style="left:${xz(z)}px">${z}</span>`).join('')}<span class="mk" style="left:${xz(D.zoom)}px"></span><div class="vw">${g.view.map(id => B(id, 'ib2')).join('')}</div></div>
    <div class="rl">${g.ov.map(id => B(id, 'ib2')).join('')}<span style="height:8px"></span>${g.tools.map(id => B(id, 'ib2')).join('')}</div>${S('bottom:14px;right:14px')}`); };
// 17 Quarter pies
R[17] = () => { const g = G(), W = 1094, H = 440;
  const pie = (x, y, list, a0, a1, cap, cx, cy) => `<div class="qp" style="left:${x};top:${y}"><div class="disc glass"></div>${arc(list.filter(ok), 0, 0, 108, a0, a1, 'rb', false)}<span class="cap" style="left:${cx}px;top:${cy}px">${cap}</span></div>`;
  return canvas(`${pie('0', '0', g.view, 8, 82, GN().view, 22, 18)}${pie('100%', '0', ['zin', 'zout', 'full'], 95, 175, `${D.zoom}%`, -26, 18)}${pie('0', '100%', g.ov, -82, -8, GN().ov, 30, -16)}${pie('100%', '100%', g.tools, -172, -98, GN().tools, -28, -16)}${S('top:14px;left:50%;margin-left:-125px')}`); };
// 18 Side grips
R[18] = () => { const g = G(), n = GN(); const ib = id => B(id, 'ib2');
  return canvas(`<div class="gp l glass"><span class="cap">${n.view}</span>${g.view.map(ib).join('')}<span class="cap">Zoom</span>${ib('zin')}<span class="zt" style="font-size:10px">${D.zoom}</span>${ib('zout')}</div>
    <div class="gp r glass"><span class="cap">${n.ov}</span>${g.ov.map(ib).join('')}<span class="cap">${n.tools}</span>${g.tools.map(ib).join('')}</div>${S('top:14px;left:50%;margin-left:-125px')}`); };
// 19 Controller
R[19] = () => { const pcb = D.mode === 'pcb';
  const dp = pcb ? {u:'zin', d:'zout', lf:'rot', rt:'fit'} : {u:'zin', d:'zout', lf:'pgPrev', rt:'pgNext'};
  const face = pcb ? {y:'layers', x:'rats', b:'rffe', a:'diode'} : {y:'info', x:'rot', b:'full', a:'whole'};
  const fcol = {y:'#d4a017', x:'#2563eb', b:'#e11d48', a:'#16a34a'};
  const sh = pcb ? [['l', ['info', 'flipH']], ['r', ['flipV', 'lock', 'sol']]] : [['l', ['info']], ['r', ['full']]];
  return canvas(`<div class="pad"><div class="body glass"></div>
    ${sh.map(([s, l]) => `<div class="sh ${s}">${l.map(id => B(id, '', `${I(icn(id))}${sl(id)}`)).join('')}</div>`).join('')}
    <div class="dpad"><span class="ct"></span>${Object.entries(dp).map(([k, id]) => B(id, k)).join('')}</div>
    <div class="mid"><span class="zt">${D.zoom}%${pageTxt()}</span><div class="row">${B('full', '', 'FULL')}${B('link', '', 'LINK')}${pcb ? B('photo', '', 'PHOTO') : ''}</div></div>
    <div class="face">${Object.entries(face).map(([k, id]) => B(id, k, I(icn(id)), `background:${fcol[k]};color:#fff`)).join('')}</div></div>
    ${S('top:14px;left:14px')}<div style="position:absolute;z-index:6;top:14px;right:14px;font-size:11px;color:var(--lc)" class="lbl">${pcb ? '✚ zoom / rotate / fit · Y layers · X airwires · B RFFE · A diode' : '✚ zoom / page · Y results · X rotate · B full · A whole word'}</div>`); };
// 20 Hanging tags
R[20] = () => { const g = G(); const tg = id => ok(id) ? `<button class="tgi${isOn(id) ? ' on' : ''}" data-run="${id}" ${tipA(id)}><span class="st"></span><span class="tc">${I(icn(id))}${sl(id)}</span></button>` : '';
  return canvas(`<div class="tg"><span class="rail"></span><div class="row">${g.view.map(tg).join('')}<span class="gsp"></span>${tg('zout')}<button class="tgi" data-run="z100"><span class="st"></span><span class="tc" style="font:800 11px var(--mono);padding:16px 0 12px">${D.zoom}%</span></button>${tg('zin')}<span class="gsp"></span>${g.ov.map(tg).join('')}<span class="gsp"></span>${g.tools.map(tg).join('')}</div></div>${S('bottom:14px;left:14px')}`); };

/* ---------- cards ---------- */
const META = [
  ['Dynamic Island', 'Black capsule', 'A sleek black capsule at the top, like a phone’s Dynamic Island. Groups separated by tiny dots, zoom in the middle; on options glow teal.'],
  ['Spine timeline', 'Vertical line', 'A glowing line down the left side with round nodes — every option is a node with its name beside it. Reads top to bottom.'],
  ['Honeycomb', 'Hexagon cluster', 'A cluster of hexagon tiles in the corner, packed like a honeycomb. Zoom lives in the dark centre cell.'],
  ['Corner arc', 'Quarter circle', 'A big quarter-circle in the bottom-left corner with three arcs of round buttons: inner = view, middle = zoom & overlays, outer = tools.'],
  ['Orbit', 'Circle around zoom', 'Every option orbits a central zoom hub on a dashed ring — compact, balanced, always visible.'],
  ['Folder tabs', 'Hanging tabs', 'Groups hang from the top edge like folder tabs, each with its name on a little ear underneath.'],
  ['Curved dock', 'Arched bottom', 'A dock bent into a gentle arch along the bottom edge — the middle rises, the ends dip, every option labelled.'],
  ['Slanted strip', 'Parallelograms', 'Sporty slanted buttons with icon + name, grouped into angled segments. Bold and fast-looking.'],
  ['Viewfinder', 'Camera brackets', 'Camera-viewfinder corner brackets frame the board: view on the top arm, search top-right, zoom down the left, overlays & tools along the bottom.'],
  ['Card deck', 'Stacked cards', 'Each group is a small card, stacked with a slight tilt on the right. Hover a card and it straightens out.'],
  ['Group pods', 'Circles', 'Each group is a round pod with its buttons around the rim and the group name in the middle; a small zoom pod sits between.'],
  ['Device bezel', 'Frame around the board', 'The board sits inside a device-like bezel: view & tools on the top edge, overlays down the right edge, zoom down the left, search at the bottom.'],
  ['Notched nav', 'Centre zoom dial', 'A bottom bar with a round notch cut out; the zoom dial sits in the notch, view on the left, overlays & tools on the right.'],
  ['Isometric keys', '3D keyboard', 'A tilted 3D keyboard panel at the bottom — every option is a physical key that presses down; lit keys are on.'],
  ['Liquid capsule', 'Merging pills', 'One slim capsule of icons; an option that is on grows a teal pill with its name, and neighbours that are both on melt together into one shape.'],
  ['Rulers', 'CAD rulers', 'CAD-style rulers: the top ruler is the zoom scale (click to jump), the left ruler holds overlays & tools.'],
  ['Quarter pies', 'Four corners', 'A quarter-circle in each corner: view top-left, zoom top-right, overlays bottom-left, tools bottom-right.'],
  ['Side grips', 'Two handles', 'Two tall capsules hug the left and right edges like handles: view & zoom on the left, overlays & tools on the right.'],
  ['Controller', 'Game-pad layout', 'A game-pad: the D-pad zooms / rotates (pages in PDF), coloured face buttons toggle overlays, shoulder buttons for tools.'],
  ['Hanging tags', 'Tags on a rail', 'Every option is a tag hanging from a rail along the top; on tags turn teal and swing a little.']];
$('#toc').innerHTML = META.map((m, n) => `<a href="#c${n + 1}">${String(n + 1).padStart(2, '0')} ${m[0]}</a>`).join('');
$('#main').innerHTML = META.map(([h, tag, p], n) => `<section class="opt" id="c${n + 1}"><div class="meta"><span class="num">${String(n + 1).padStart(2, '0')}</span><div><h3>${h}<span class="tag">${tag}</span></h3><p>${p}</p></div></div><div class="stage" id="s${n + 1}" data-n="${n + 1}"></div></section>`).join('');

/* ---------- draw + events ---------- */
function draw() {
  for (let n = 1; n <= 20; n++) { const s = $('#s' + n); s.className = 'stage' + (D.mode === 'pdf' ? ' pdfm' : ''); s.innerHTML = R[n](); }
  $all('.mode button').forEach(x => x.classList.toggle('on', x.dataset.v === D.mode));
}
let tt; function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1400); }
const tip = $('#tip'); let HOV = 0;
document.addEventListener('mouseover', e => {
  const st = e.target.closest('.stage'); HOV = st ? +st.dataset.n : 0;
  const el = e.target.closest('[data-tip]'); if (!el) { tip.classList.remove('on'); return; }
  const [t, k] = el.dataset.tip.split('|'); tip.innerHTML = `${t}${k ? `<kbd>${k}</kbd>` : ''}`;
  const r = el.getBoundingClientRect(); tip.classList.add('on');
  tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = (r.bottom + 34 > innerHeight ? r.top - 36 : r.bottom + 8) + 'px';
});
document.addEventListener('click', e => {
  tip.classList.remove('on');
  const r = e.target.closest('[data-run]'); if (r) return run(r.dataset.run);
  const ru = e.target.closest('[data-ruler]');
  if (ru && !e.target.closest('.vw')) { const x = e.clientX - ru.getBoundingClientRect().left; let best = 100, bd = 1e9; ZS.forEach(z => { const d = Math.abs(20 + (Math.log2(z / 25) / 4) * 830 - x); if (d < bd) { bd = d; best = z; } }); D.zoom = best; return draw(); }
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'mode') setMode(a.dataset.v);
  if (a.dataset.a === 'theme') { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; }
});
const KEYMAP = {r:'rot', h:'flipH', v:'flipV', f:'fit', l:'layers', d:'diode', a:'rats', p:'photo', b:'rffe', i:'info', e:'sol', k:'lock', w:'whole', '+':'zin', '=':'zin', '-':'zout', '0':'z100', PageUp:'pgPrev', PageDown:'pgNext'};
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('[data-q]')) { if (e.key === 'Enter') setQuery(t.value); if (e.key === 'Escape') setQuery(''); return; }
  if (t.matches && t.matches('input') || !HOV || e.ctrlKey || e.metaKey || e.altKey) return;
  const id = KEYMAP[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!id || (ACT[id] && !ok(id))) return;
  e.preventDefault(); run(id);
});
draw();
</script>
